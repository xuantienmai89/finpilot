      let m;
      form.addEventListener('submit', e => { e.preventDefault(); F.clearErrors(form); const f = F.dateVal(form, 'from'), t = F.dateVal(form, 'to'); const errs = {}; if (!f) errs.from = 'Ngày không hợp lệ.'; if (!t) errs.to = 'Ngày không hợp lệ.'; if (f && t && f > t) errs.to = 'Ngày kết thúc phải sau ngày bắt đầu.'; if (f && t && DateUtil.diffDays(f, t) > 36600) errs.to = 'Khoảng ngày quá dài.'; if (Object.keys(errs).length) return F.showErrors(form, errs); this.setPref('period', { key: 'custom', custom: { from: f, to: t } }); m.close(); this.render(); });
      m = Modal.open({ title: 'Chọn khoảng ngày', size: 'sm', body: form, footer: [h('button', { class: 'btn btn-ghost', type: 'button', onclick: () => m.close() }, 'Hủy'), h('button', { class: 'btn btn-primary', type: 'submit', form: 'period-form' }, 'Áp dụng')], onClose: () => this.renderHeader() });
      return;
    }
    this.setPref('period', { key: v, custom: null }); this.render();
  },
  navigate(route) { if (('#/' + route) === location.hash) this.render(); else location.hash = '#/' + route; },
  onRoute(initial) {
    const r = (location.hash.match(/^#\/([a-z-]+)/) || [])[1];
    this.route = ROUTES[r] ? r : 'dashboard';
    if (!ROUTES[r] && !initial) { history.replaceState(null, '', '#/dashboard'); }
    Modal.closeAll();
    this.render(true);
  },
  renderHeader() {
    const r = ROUTES[this.route];
    document.getElementById('page-title').textContent = r.title;
    const prof = Profiles.active(); const multi = Profiles.count() > 1;
    document.title = `${r.title}${multi ? ' · ' + prof.name : ''} · ${APP_NAME}`;
    const pb = document.getElementById('btn-profile');
    if (pb) { pb.replaceChildren(Pages.avatar(prof), h('span', { class: 'nm', text: prof.name })); pb.title = `Hồ sơ: ${prof.name}${prof.email ? ' (' + prof.email + ')' : ''} — bấm để chuyển hồ sơ`; }
    const pc = document.getElementById('period-ctl'); pc.style.display = r.period ? '' : 'none';
    const p = this.period(); const sel = document.getElementById('period-select'); sel.value = p.key;
    document.getElementById('page-sub').textContent = r.period ? p.range : '';
    for (const a of document.querySelectorAll('[data-route]')) a.classList.toggle('active', a.dataset.route === this.route);
    const due = this.state ? Recurring.due(this.state).length : 0;
    const navRec = document.querySelector('#nav [data-route=recurring]');
    if (navRec) { const old = navRec.querySelector('.nav-badge'); if (old) old.remove(); if (due) navRec.append(h('span', { class: 'nav-badge warn', text: String(due) })); }
    const over = this.state ? Budget.usage(this.state, DateUtil.monthKey(DateUtil.today())).overCount : 0;
    const navB = document.querySelector('#nav [data-route=budgets]');
    if (navB) { const old = navB.querySelector('.nav-badge'); if (old) old.remove(); if (over) navB.append(h('span', { class: 'nav-badge', text: String(over) })); }
    this.renderSidebarFoot();
  },
  renderSidebarFoot() {
    const el = document.getElementById('sidebar-foot'); if (!el || !this.state) return;
    const info = StorageService.info;
    el.replaceChildren(
      h('div', { class: 'row', style: { cursor: 'pointer' }, onclick: () => Pages.profileSwitcher(), title: 'Chuyển hồ sơ' }, Icon('eye', 13), 'Hồ sơ: ' + Profiles.active().name),
      h('div', { class: 'row' }, Icon('database', 13), ({ indexeddb: 'Lưu: IndexedDB', localstorage: 'Lưu: localStorage', memory: 'Lưu: tạm thời!' })[info.mode]),
      h('div', { class: 'row' }, Icon(SyncService.isEnabled() ? 'cloud' : 'cloudOff', 13), SyncService.isEnabled() ? 'Đồng bộ: ' + (SyncService.status.text || 'bật') : 'Đồng bộ: tắt'),
      h('div', { class: 'row', style: { opacity: .7 } }, `v${APP_VERSION} · #${this.state.meta.revision}`));
  },
  setSave(kind, text) { this.saveState = { kind, text }; this.renderStatus(); },
  renderStatus() {
    const pill = document.getElementById('save-status'); if (!pill) return;
    const s = this.saveState; const sy = SyncService.status; const syncOn = SyncService.isEnabled();
    pill.className = 'status-pill ' + s.kind + (syncOn ? ' sync-' + ({ ok: 'ok', busy: 'busy', idle: 'ok', offline: 'warn', auth: 'warn', error: 'warn' }[sy.state] || '') : '');
    const kids = [h('span', { class: 'dot' }), h('span', { class: 'txt', text: s.text })];
    if (syncOn) kids.push(h('span', { class: 'sync-ico', title: sy.text }, Icon(sy.state === 'busy' ? 'sync' : (sy.state === 'ok' || sy.state === 'idle') ? 'cloud' : 'cloudOff', 15)));
    pill.replaceChildren(...kids);
    pill.title = `Lưu cục bộ: ${s.text}${syncOn ? ' · Đồng bộ: ' + sy.text : ''}${!navigator.onLine ? ' · Đang ngoại tuyến' : ''}`;
    this.renderSidebarFoot();
  },
  banner(id, tone, title, text, actions = []) {
    const root = document.getElementById('banners'); const old = root.querySelector(`[data-banner="${id}"]`); if (old) old.remove();
    root.append(h('div', { class: 'banner ' + (tone === 'info' ? '' : tone), dataset: { banner: id }, role: tone === 'danger' ? 'alert' : 'status' }, Icon(tone === 'info' ? 'info' : 'alert'), h('div', { class: 'b-body' }, h('div', { class: 'b-title', text: title }), h('div', { class: 'small', text }), actions.length ? h('div', { class: 'b-actions' }, actions.map(a => h('button', { class: 'btn btn-sm', type: 'button', onclick: a.fn }, a.label))) : null), tone !== 'danger' ? h('button', { class: 'icon-btn sm', type: 'button', 'aria-label': 'Ẩn thông báo', onclick: () => this.clearBanner(id) }, Icon('x', 14)) : null));
  },
  clearBanner(id) { const el = document.querySelector(`#banners [data-banner="${id}"]`); if (el) el.remove(); },
  render(resetScroll = false) {
    if (!this.state) return;
    this.renderHeader();
    const view = document.getElementById('view');
    const y = window.scrollY;
    const frag = h('div', { class: 'page' });
    try { (Pages[this.route] || Pages.dashboard)(frag); }
    catch (e) {
      console.error(e);
      frag.replaceChildren(C.card('Đã xảy ra lỗi khi hiển thị trang', h('div', {}, C.callout('alert', String(e && e.message || e), 'danger'), h('p', { class: 'small mt-12', text: 'Dữ liệu của bạn không bị ảnh hưởng. Bạn có thể xuất bản sao lưu hoặc chuyển sang trang khác.' }), h('div', { class: 'btn-group mt-12' }, C.btn('Xuất sao lưu', () => Pages.exportBackup(false), { icon: 'download' }), C.btn('Về Tổng quan', () => this.navigate('dashboard'))))));
    }
    view.replaceChildren(frag);
    if (resetScroll) window.scrollTo(0, 0); else window.scrollTo(0, y);
  }
};

/* Biểu tượng cho "Thêm vào màn hình chính" (tạo PNG tại chỗ, không tải từ mạng) */
function installTouchIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#0f2350'; x.fillRect(0, 0, 180, 180);
    x.strokeStyle = '#ffffff'; x.lineWidth = 14; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(42, 126); x.lineTo(74, 88); x.lineTo(98, 106); x.lineTo(138, 56); x.stroke();
    x.fillStyle = '#7ef0c0'; x.beginPath(); x.arc(138, 56, 12, 0, Math.PI * 2); x.fill();
    const link = document.createElement('link'); link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png'); document.head.appendChild(link);
  } catch (e) {}
}

window.addEventListener('error', e => { try { console.error(e.error || e.message); Toast.show('Lỗi không mong muốn: ' + (e.message || 'không rõ') + '. Dữ liệu đã lưu không bị ảnh hưởng.', { type: 'error' }); } catch (_) {} });
window.addEventListener('unhandledrejection', e => { try { console.error(e.reason); const msg = e.reason && e.reason.message || String(e.reason); if (!(e.reason instanceof AppError)) Toast.show('Lỗi: ' + msg, { type: 'error' }); } catch (_) {} });

/* Giao diện kiểm tra/khám phá dành cho người dùng nâng cao (chỉ đọc) */
window.FinPilot = Object.freeze({
  version: APP_VERSION,
  getState: () => Util.clone(App.state),
  totals: (from, to) => Ledger.totals(App.state, from, to),
  current: () => { const c = Ledger.current(App.state); return { cash: c.cash, totalAssets: c.totalAssets, liabilities: c.liabilities, netWorth: c.netWorth, balances: Object.fromEntries(c.balances), debts: Object.fromEntries(c.debtBalances) }; },
  integrity: () => Validation.integrity(App.state),
  _internal: { App, Ledger, Validation, MergeService, ImportExport, Recurring, DateUtil, Money, SyncService, StorageService }
});

installTouchIcon();
App.init().catch(e => { console.error(e); document.getElementById('view').replaceChildren(h('div', { class: 'card' }, h('h3', { text: 'Không khởi động được ứng dụng' }), h('p', { text: String(e && e.message || e) }))); });

})();
</script>
