    return arr.filter(t => Util.isObj(t) && COLLECTIONS.includes(t.c) && typeof t.id === 'string' && typeof t.at === 'string').map(t => ({ c: t.c, id: t.id.slice(0, 120), at: t.at.slice(0, 40) }));
  },
  /** Chuẩn hóa một bộ dữ liệu đầy đủ (dùng cho tải, nhập file, đồng bộ). */
  dataset(d) {
    const ds = {
      settings: this.settings(d.settings),
      categories: (d.categories || []).map(x => this.category(x)),
      accounts: (d.accounts || []).map(x => this.account(x)),
      transactions: (d.transactions || []).map(x => this.transaction(x)),
      budgets: (d.budgets || []).map(x => this.budget(x)),
      assets: (d.assets || []).map(x => this.asset(x)),
      debts: (d.debts || []).map(x => this.debt(x)),
      goals: (d.goals || []).map(x => this.goal(x)),
      recurring: (d.recurring || []).map(x => this.recurring(x)),
      snapshots: (d.snapshots || []).map(x => this.snapshot(x)),
      tombstones: this.tombstones(d.tombstones)
    };
    if (!ds.categories.some(c => c.id === INTEREST_CAT_ID)) ds.categories.push(Defaults.categories().find(c => c.id === INTEREST_CAT_ID));
    return ds;
  }
};

/* --------------------------- Kiểm tra hợp lệ --------------------------- */
const Validation = {
  amt(v, allowZero = false) { return typeof v === 'number' && Number.isSafeInteger(v) && (allowZero ? v >= 0 : v > 0) && v <= MAX_AMOUNT; },
  ctx(st) { return { acc: Util.byId(st.accounts), cat: Util.byId(st.categories), debt: Util.byId(st.debts), goal: Util.byId(st.goals), rec: Util.byId(st.recurring) }; },
  first(e) { const k = Object.keys(e); return k.length ? e[k[0]] : null; },

  transaction(t, st, o = {}) {
    const e = {}; const ctx = o.ctx || this.ctx(st); const orig = o.original || null;
    const set = (k, msg) => { if (!e[k]) e[k] = msg; };
    if (!t || !TXN_TYPES[t.type]) { set('type', 'Loại giao dịch không hợp lệ.'); return e; }
    if (typeof t.id !== 'string' || !t.id) set('id', 'Thiếu mã giao dịch.');
    const dateOk = DateUtil.isISO(t.date);
    if (!dateOk) set('date', 'Ngày không hợp lệ (định dạng DD/MM/YYYY).');
    const acct = (field, id, label) => {
      if (!id) { set(field, `Vui lòng chọn ${label}.`); return null; }
      const a = ctx.acc.get(id); if (!a) { set(field, 'Tài khoản không tồn tại.'); return null; }
      if (!a.active && !(orig && (orig.accountId === id || orig.toAccountId === id))) set(field, `Tài khoản "${a.name}" đã ngừng hoạt động.`);
      if (dateOk && DateUtil.isISO(a.startDate) && t.date < a.startDate) set('date', `Ngày giao dịch trước ngày bắt đầu theo dõi tài khoản "${a.name}" (${DateUtil.toVN(a.startDate)}).`);
      return a;
    };
    const debt = (field, id) => {
      if (!id) { set(field, 'Vui lòng chọn khoản nợ.'); return null; }
      const d = ctx.debt.get(id); if (!d) { set(field, 'Khoản nợ không tồn tại.'); return null; }
      if (!d.active && !(orig && orig.debtId === id)) set(field, `Khoản nợ "${d.name}" đã đóng.`);
      if (dateOk && DateUtil.isISO(d.startDate) && t.date < d.startDate) set('date', `Ngày giao dịch trước ngày bắt đầu khoản nợ "${d.name}" (${DateUtil.toVN(d.startDate)}).`);
      return d;
    };
    const cat = kind => {
      const c = ctx.cat.get(t.categoryId);
      if (!t.categoryId || !c) { set('categoryId', 'Vui lòng chọn danh mục.'); return; }
      if (c.kind !== kind) set('categoryId', 'Danh mục không đúng loại giao dịch.');
      else if (!c.active && !(orig && orig.categoryId === c.id)) set('categoryId', `Danh mục "${c.name}" đã ngừng sử dụng.`);
    };
    const amount = (k = 'amount', allowZero = false) => { if (!this.amt(t[k], allowZero)) set(k, allowZero ? 'Số tiền không hợp lệ.' : 'Số tiền phải là số nguyên dương hợp lệ.'); };
    switch (t.type) {
      case 'income': amount(); acct('accountId', t.accountId, 'tài khoản nhận'); cat('income'); break;
      case 'expense':
        amount();
        if (t.accountId && t.debtId) set('accountId', 'Chỉ chọn một nguồn thanh toán.');
        else if (t.debtId) debt('accountId', t.debtId);
        else acct('accountId', t.accountId, 'nguồn thanh toán');
        cat('expense'); break;
      case 'transfer':
        amount(); acct('accountId', t.accountId, 'tài khoản chuyển'); acct('toAccountId', t.toAccountId, 'tài khoản nhận');
        if (t.accountId && t.accountId === t.toAccountId) set('toAccountId', 'Tài khoản nhận phải khác tài khoản chuyển.');
        if (t.goalId && !ctx.goal.has(t.goalId)) set('goalId', 'Mục tiêu không tồn tại.');
        break;
      case 'debt_payment': {
        amount('principal', true); amount('interest', true);
        if (this.amt(t.principal, true) && this.amt(t.interest, true)) {
          if (t.principal + t.interest <= 0) set('principal', 'Tổng tiền trả (gốc + lãi) phải lớn hơn 0.');
          else if (t.amount !== t.principal + t.interest) set('principal', 'Tổng tiền không khớp gốc + lãi.');
        }
        acct('accountId', t.accountId, 'tài khoản thanh toán');
        const d = debt('debtId', t.debtId);
        if (d && o.checkDebtLimit !== false && this.amt(t.principal, true)) {
          const bal = Ledger.debtBalanceExcluding(st, d.id, o.editingId || null);
          if (t.principal > bal) set('principal', `Tiền gốc vượt dư nợ hiện còn (${Money.format(bal)}).`);
        }
        break;
      }
      case 'borrow': amount(); debt('debtId', t.debtId); acct('accountId', t.accountId, 'tài khoản nhận tiền'); break;
      case 'adjustment': amount(); acct('accountId', t.accountId, 'tài khoản'); if (t.direction !== 'in' && t.direction !== 'out') set('direction', 'Chọn hướng điều chỉnh.'); break;
    }
    if (typeof t.note === 'string' && t.note.length > 500) set('note', 'Ghi chú tối đa 500 ký tự.');
    return e;
  },

  account(a, st, o = {}) {
    const e = {};
    if (!a.name) e.name = 'Vui lòng nhập tên tài khoản.';
    else if (!o.skipUnique && st.accounts.some(x => x.id !== a.id && Util.norm(x.name) === Util.norm(a.name))) e.name = 'Tên tài khoản đã tồn tại.';
    if (!ACCOUNT_TYPES[a.type]) e.type = 'Loại tài khoản không hợp lệ.';
    if (!this.amt(a.openingBalance, true)) e.openingBalance = 'Số dư ban đầu phải là số nguyên ≥ 0.';
    if (!DateUtil.isISO(a.startDate)) e.startDate = 'Ngày bắt đầu không hợp lệ.';
    else if (!o.skipTxnCheck) {
      let first = null;
      for (const t of st.transactions) if ((t.accountId === a.id || t.toAccountId === a.id) && (!first || t.date < first)) first = t.date;
      if (first && first < a.startDate) e.startDate = `Đã có giao dịch từ ${DateUtil.toVN(first)}; ngày bắt đầu phải từ ngày đó trở về trước.`;
    }
    return e;
  },
  category(c, st, o = {}) {
    const e = {};
    if (!c.name) e.name = 'Vui lòng nhập tên danh mục.';
    else if (!o.skipUnique && st.categories.some(x => x.id !== c.id && x.kind === c.kind && Util.norm(x.name) === Util.norm(c.name))) e.name = 'Tên danh mục đã tồn tại.';
    if (c.kind !== 'income' && c.kind !== 'expense') e.kind = 'Loại danh mục không hợp lệ.';
    return e;
  },
  budget(b, st, o = {}) {
    const e = {}; const ctx = o.ctx || this.ctx(st);
    if (!DateUtil.isMonthKey(b.month)) e.month = 'Tháng áp dụng không hợp lệ.';
    const c = ctx.cat.get(b.categoryId);
    if (!c) e.categoryId = 'Vui lòng chọn danh mục chi tiêu.';
    else if (c.kind !== 'expense') e.categoryId = 'Ngân sách chỉ áp dụng cho danh mục chi tiêu.';
    if (!this.amt(b.limit)) e.limit = 'Hạn mức phải là số nguyên dương.';
    if (!o.skipUnique && !e.month && !e.categoryId && st.budgets.some(x => x.id !== b.id && x.month === b.month && x.categoryId === b.categoryId)) e.categoryId = 'Danh mục này đã có ngân sách trong tháng.';
    return e;
  },
  asset(a, o = {}) {
    const e = {};
    if (!a.name) e.name = 'Vui lòng nhập tên tài sản.';
    if (!ASSET_GROUPS[a.group]) e.group = 'Nhóm tài sản không hợp lệ.';
    if (a.purchaseValue !== null && !this.amt(a.purchaseValue, true)) e.purchaseValue = 'Giá mua không hợp lệ.';
    if (a.purchaseDate && !DateUtil.isISO(a.purchaseDate)) e.purchaseDate = 'Ngày mua không hợp lệ.';
    if (!Array.isArray(a.history) || !a.history.length) e.value = 'Cần ít nhất một giá trị ước tính.';
    else for (const x of a.history) {
      if (!DateUtil.isISO(x.date)) { e.valueDate = 'Ngày định giá không hợp lệ.'; break; }
      if (o.today && x.date > o.today) { e.valueDate = 'Ngày định giá không được ở tương lai.'; break; }
      if (!this.amt(x.value, true)) { e.value = 'Giá trị ước tính không hợp lệ.'; break; }
    }
    return e;
  },
  debt(d) {
    const e = {};
    if (!d.name) e.name = 'Vui lòng nhập tên khoản nợ.';
    if (!DEBT_TYPES[d.type]) e.type = 'Loại nợ không hợp lệ.';
    if (!this.amt(d.initialBalance, true)) e.initialBalance = 'Dư nợ ban đầu phải là số nguyên ≥ 0.';
    if (d.interestRate !== null && !(typeof d.interestRate === 'number' && Number.isFinite(d.interestRate) && d.interestRate >= 0 && d.interestRate <= 100)) e.interestRate = 'Lãi suất phải từ 0 đến 100%/năm.';
    if (!DateUtil.isISO(d.startDate)) e.startDate = 'Ngày vay không hợp lệ.';
    if (d.dueDate && !DateUtil.isISO(d.dueDate)) e.dueDate = 'Ngày đến hạn không hợp lệ.';
    else if (d.dueDate && DateUtil.isISO(d.startDate) && d.dueDate < d.startDate) e.dueDate = 'Ngày đến hạn phải sau ngày vay.';
    if (d.termMonths !== null && !(Number.isInteger(d.termMonths) && d.termMonths >= 1 && d.termMonths <= 1200)) e.termMonths = 'Kỳ hạn (tháng) không hợp lệ.';
    for (const x of d.adjustments || []) {
      if (!x.id || !DateUtil.isISO(x.date) || (x.direction !== 'increase' && x.direction !== 'decrease') || !this.amt(x.amount)) { e.adjustments = 'Có bản ghi điều chỉnh dư nợ không hợp lệ.'; break; }
    }
    return e;
  },
  goal(g, st, o = {}) {
    const e = {}; const ctx = o.ctx || this.ctx(st);
    if (!g.name) e.name = 'Vui lòng nhập tên mục tiêu.';
    if (!GOAL_TYPES[g.type]) e.type = 'Loại mục tiêu không hợp lệ.';
    if (!this.amt(g.target)) e.target = 'Số tiền mục tiêu phải là số nguyên dương.';
    if (!DateUtil.isISO(g.startDate)) e.startDate = 'Ngày bắt đầu không hợp lệ.';
    if (g.deadline && !DateUtil.isISO(g.deadline)) e.deadline = 'Hạn hoàn thành không hợp lệ.';
    else if (g.deadline && DateUtil.isISO(g.startDate) && g.deadline < g.startDate) e.deadline = 'Hạn hoàn thành phải sau ngày bắt đầu.';
    if (!PRIORITIES[g.priority]) e.priority = 'Mức ưu tiên không hợp lệ.';
    if (!GOAL_STATUS[g.status]) e.status = 'Trạng thái không hợp lệ.';
    if (!GOAL_MODES[g.mode]) e.mode = 'Cách theo dõi không hợp lệ.';
    if (g.mode === 'account' && !ctx.acc.has(g.accountId)) e.accountId = 'Vui lòng chọn tài khoản liên kết.';
    let saved = 0;
    for (const x of g.contributions || []) {
      if (!x.id || !DateUtil.isISO(x.date) || !this.amt(x.amount)) { e.contributions = 'Có khoản tích lũy không hợp lệ.'; break; }
      saved += x.direction === 'out' ? -x.amount : x.amount;
    }
    if (!e.contributions && saved < 0) e.contributions = 'Tổng số đã tích lũy không được âm.';
    return e;
  },
  recurring(r, st, o = {}) {
    const e = {}; const ctx = o.ctx || this.ctx(st); const t = r.template || {};
    if (!r.name) e.name = 'Vui lòng nhập tên.';
    if (!FREQUENCIES[r.frequency]) e.frequency = 'Chu kỳ không hợp lệ.';
    if (!(Number.isInteger(r.interval) && r.interval >= 1 && r.interval <= 99)) e.interval = 'Khoảng lặp phải từ 1 đến 99.';
    if (!DateUtil.isISO(r.startDate)) e.startDate = 'Ngày bắt đầu không hợp lệ.';
    if (r.endDate && !DateUtil.isISO(r.endDate)) e.endDate = 'Ngày kết thúc không hợp lệ.';
    else if (r.endDate && DateUtil.isISO(r.startDate) && r.endDate < r.startDate) e.endDate = 'Ngày kết thúc phải sau ngày bắt đầu.';
    if (!['income', 'expense', 'transfer', 'debt_payment'].includes(t.type)) { e.type = 'Loại giao dịch định kỳ không hợp lệ.'; return e; }
    if (t.type === 'debt_payment') {
      if (!this.amt(t.principal, true) || !this.amt(t.interest, true) || t.principal + t.interest <= 0) e.principal = 'Tiền gốc/lãi không hợp lệ.';
    } else if (!this.amt(t.amount)) e.amount = 'Số tiền phải là số nguyên dương.';
    const needAcc = (k, id) => { if (!id || !ctx.acc.has(id)) e[k] = 'Vui lòng chọn tài khoản.'; };
    if (t.type === 'expense' && t.debtId) { if (!ctx.debt.has(t.debtId)) e.accountId = 'Khoản nợ không tồn tại.'; }
    else needAcc('accountId', t.accountId);
    if (t.type === 'transfer') { needAcc('toAccountId', t.toAccountId); if (t.accountId && t.accountId === t.toAccountId) e.toAccountId = 'Tài khoản nhận phải khác tài khoản chuyển.'; }
    if (t.type === 'income' || t.type === 'expense') { const c = ctx.cat.get(t.categoryId); if (!c || c.kind !== t.type) e.categoryId = 'Vui lòng chọn danh mục phù hợp.'; }
    if (t.type === 'debt_payment' && !ctx.debt.has(t.debtId)) e.debtId = 'Vui lòng chọn khoản nợ.';
    return e;
  },
  snapshot(s) {
    const okN = v => typeof v === 'number' && Number.isSafeInteger(v);
    if (!DateUtil.isISO(s.date)) return 'ngày không hợp lệ';
    if (![s.cash, s.otherAssets, s.totalAssets, s.liabilities, s.netWorth].every(okN)) return 'số liệu không hợp lệ';
    return null;
  },

  /** Kiểm tra toàn vẹn toàn bộ dữ liệu. Trả về {errors, warnings}. */
  integrity(st) {
    const errors = [], warnings = [];
    const add = (arr, m) => { if (arr.length < 300) arr.push(m); };
    if (!Util.isObj(st.settings)) add(errors, 'Thiếu phần cài đặt.');
    for (const c of COLLECTIONS) {
      if (!Array.isArray(st[c])) { add(errors, `Thiếu danh sách ${COLL_LABELS[c]}.`); return { errors, warnings }; }
      const seen = new Set();
      for (const x of st[c]) {
        if (!Util.isObj(x) || typeof x.id !== 'string' || !x.id) { add(errors, `${COLL_LABELS[c]}: có bản ghi thiếu mã định danh.`); continue; }
        if (seen.has(x.id)) add(errors, `${COLL_LABELS[c]}: trùng mã ${x.id}.`);
        seen.add(x.id);
      }
    }
    const ctx = this.ctx(st);
    for (const c of st.categories) { const e = this.category(c, st, { skipUnique: true }); if (Object.keys(e).length) add(errors, `Danh mục "${c.name || c.id}": ${this.first(e)}`); }
    const ic = ctx.cat.get(INTEREST_CAT_ID);
    if (!ic || ic.kind !== 'expense') add(errors, 'Thiếu danh mục hệ thống "Trả lãi vay".');
    for (const a of st.accounts) { const e = this.account(a, st, { skipUnique: true, skipTxnCheck: true }); if (Object.keys(e).length) add(errors, `Tài khoản "${a.name || a.id}": ${this.first(e)}`); }
    for (const d of st.debts) { const e = this.debt(d); if (Object.keys(e).length) add(errors, `Khoản nợ "${d.name || d.id}": ${this.first(e)}`); }
    for (const t of st.transactions) {
      const e = this.transaction(t, st, { original: t, checkDebtLimit: false, ctx });
      if (Object.keys(e).length) add(errors, `Giao dịch ${DateUtil.isISO(t.date) ? DateUtil.toVN(t.date) : ''} (mã ${t.id}): ${this.first(e)}`);
    }
    const bkeys = new Set();
    for (const b of st.budgets) {
      const e = this.budget(b, st, { ctx, skipUnique: true }); if (Object.keys(e).length) add(errors, `Ngân sách (${b.month}): ${this.first(e)}`);
      const k = b.month + '|' + b.categoryId; if (bkeys.has(k)) add(errors, `Ngân sách trùng danh mục trong tháng ${b.month}.`); bkeys.add(k);
    }
    for (const a of st.assets) { const e = this.asset(a); if (Object.keys(e).length) add(errors, `Tài sản "${a.name || a.id}": ${this.first(e)}`); }
    const goalAcc = new Map();
    for (const g of st.goals) {
      const e = this.goal(g, st, { ctx }); if (Object.keys(e).length) add(errors, `Mục tiêu "${g.name || g.id}": ${this.first(e)}`);
      if (g.mode === 'account' && g.status !== 'done') { if (goalAcc.has(g.accountId)) add(warnings, `Hai mục tiêu cùng liên kết một tài khoản ("${goalAcc.get(g.accountId)}" và "${g.name}") — số dư bị tính cho cả hai.`); goalAcc.set(g.accountId, g.name); }
    }
    for (const r of st.recurring) { const e = this.recurring(r, st, { ctx }); if (Object.keys(e).length) add(errors, `Giao dịch định kỳ "${r.name || r.id}": ${this.first(e)}`); }
    const sdates = new Set();
    for (const s of st.snapshots) { const m = this.snapshot(s); if (m) add(errors, `Bản chụp tài sản ròng: ${m}.`); if (sdates.has(s.date)) add(errors, `Bản chụp trùng ngày ${s.date}.`); sdates.add(s.date); }
    if (!errors.length) {
      const db = Ledger.debtBalances(st, null);
      for (const d of st.debts) { const b = db.get(d.id) || 0; if (b < 0) add(errors, `Dư nợ "${d.name}" bị âm (${Money.format(b)}) — số tiền trả gốc vượt quá dư nợ.`); }
    }
    return { errors, warnings };
  }
};

/* --------------------------- Sổ cái & tính toán --------------------------- */
const Ledger = {
  sortedTxns(st) {
    return memo(st, 'sorted', () => st.transactions.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : 0)));
  },
  /** Số dư từng tài khoản tính đến ngày asOf (bao gồm). asOf=null: toàn bộ. */
  accountBalances(st, asOf) {
    return memo(st, 'ab:' + (asOf || '*'), () => {
      const m = new Map();
      for (const a of st.accounts) m.set(a.id, (!asOf || a.startDate <= asOf) ? a.openingBalance : 0);
      const add = (id, v) => { if (m.has(id)) m.set(id, m.get(id) + v); };
      for (const t of st.transactions) {
        if (asOf && t.date > asOf) continue;
        switch (t.type) {
          case 'income': add(t.accountId, t.amount); break;
          case 'expense': if (t.accountId) add(t.accountId, -t.amount); break;
          case 'transfer': add(t.accountId, -t.amount); add(t.toAccountId, t.amount); break;
          case 'debt_payment': add(t.accountId, -t.amount); break;
          case 'borrow': add(t.accountId, t.amount); break;
          case 'adjustment': add(t.accountId, t.direction === 'in' ? t.amount : -t.amount); break;
        }
      }
      return m;
    });
  },
  debtBalances(st, asOf) {
    return memo(st, 'db:' + (asOf || '*'), () => {
      const m = new Map();
      for (const d of st.debts) {
        let b = (!asOf || d.startDate <= asOf) ? d.initialBalance : 0;
        for (const x of d.adjustments || []) if (!asOf || x.date <= asOf) b += x.direction === 'increase' ? x.amount : -x.amount;
        m.set(d.id, b);
      }
      const add = (id, v) => { if (m.has(id)) m.set(id, m.get(id) + v); };
      for (const t of st.transactions) {
        if (asOf && t.date > asOf) continue;
        if (t.type === 'borrow') add(t.debtId, t.amount);
        else if (t.type === 'expense' && t.debtId) add(t.debtId, t.amount);
        else if (t.type === 'debt_payment') add(t.debtId, -t.principal);
      }
      return m;
    });
  },
  debtBalanceExcluding(st, debtId, txnId) {
    const d = st.debts.find(x => x.id === debtId); if (!d) return 0;
    let b = d.initialBalance;
    for (const x of d.adjustments || []) b += x.direction === 'increase' ? x.amount : -x.amount;
    for (const t of st.transactions) {
      if (t.id === txnId || t.debtId !== debtId) continue;
      if (t.type === 'borrow') b += t.amount;
      else if (t.type === 'expense') b += t.amount;
      else if (t.type === 'debt_payment') b -= t.principal;
    }
    return b;
  },
  debtStats(st) {
    return memo(st, 'dstats', () => {
      const m = new Map();
      for (const d of st.debts) m.set(d.id, { principalPaid: 0, interestPaid: 0, borrowed: 0, charged: 0, count: 0, lastPayment: '' });
      for (const t of st.transactions) {
        const s = m.get(t.debtId); if (!s) continue;
        if (t.type === 'debt_payment') { s.principalPaid += t.principal; s.interestPaid += t.interest; s.count++; if (t.date > s.lastPayment) s.lastPayment = t.date; }
        else if (t.type === 'borrow') s.borrowed += t.amount;
        else if (t.type === 'expense') s.charged += t.amount;
      }
      return m;
    });
  },
  /** Bút toán chi phí: giao dịch chi tiêu + phần LÃI của giao dịch trả nợ (gốc không phải chi phí). */
  expenseEntries(st) {
    return memo(st, 'expE', () => {
      const out = [];
      for (const t of this.sortedTxns(st)) {
        if (t.type === 'expense') out.push({ date: t.date, categoryId: t.categoryId, amount: t.amount, txn: t });
        else if (t.type === 'debt_payment' && t.interest > 0) out.push({ date: t.date, categoryId: INTEREST_CAT_ID, amount: t.interest, txn: t });
      }
      return out;
    });
  },
  incomeEntries(st) {
    return memo(st, 'incE', () => this.sortedTxns(st).filter(t => t.type === 'income').map(t => ({ date: t.date, categoryId: t.categoryId, amount: t.amount, txn: t })));
  },
  totals(st, from, to) {
    return memo(st, `tot:${from}:${to}`, () => {
      const inc = sliceRange(this.incomeEntries(st), from, to), exp = sliceRange(this.expenseEntries(st), from, to);
      const income = Util.sum(inc, x => x.amount), expense = Util.sum(exp, x => x.amount);
      const net = income - expense;
      return { income, expense, net, savingsRate: income > 0 ? net / income * 100 : null, incomeCount: inc.length, expenseCount: exp.length };
    });
  },
  byCategory(st, kind, from, to) {
    return memo(st, `bycat:${kind}:${from}:${to}`, () => {
      const arr = sliceRange(kind === 'income' ? this.incomeEntries(st) : this.expenseEntries(st), from, to);
      const m = new Map();
      for (const x of arr) { const o = m.get(x.categoryId) || { amount: 0, count: 0 }; o.amount += x.amount; o.count++; m.set(x.categoryId, o); }
      return m;
    });
  },
  txnsInRange(st, from, to) { return sliceRange(this.sortedTxns(st), from, to); },
  assetValue(a, asOf) { let v = null; for (const x of a.history) if (x.date <= asOf) v = x; return v ? v.value : 0; },
  assetLatest(a) { return a.history.length ? a.history[a.history.length - 1] : null; },
  current(st) {
    const asOf = DateUtil.today();
    return memo(st, 'cur:' + asOf, () => {
      const ab = this.accountBalances(st, asOf);
      let cash = 0, liquid = 0; const byType = {};
      for (const a of st.accounts) { const b = ab.get(a.id) || 0; cash += b; if (LIQUID_TYPES.includes(a.type)) liquid += b; byType[a.type] = (byType[a.type] || 0) + b; }
      let otherAssets = 0; const byGroup = {};
      for (const as of st.assets) { const v = this.assetValue(as, asOf); otherAssets += v; byGroup[as.group] = (byGroup[as.group] || 0) + v; }
      const db = this.debtBalances(st, asOf);
      let liabilities = 0; const byDebtType = {};
      for (const d of st.debts) { const b = db.get(d.id) || 0; liabilities += b; byDebtType[d.type] = (byDebtType[d.type] || 0) + b; }
      return { asOf, cash, liquid, byType, otherAssets, byGroup, totalAssets: cash + otherAssets, liabilities, byDebtType, netWorth: cash + otherAssets - liabilities, balances: ab, debtBalances: db };
    });
  },
  bounds(st) {
    return memo(st, 'bounds', () => {
      let min = null, max = null;
      const s = this.sortedTxns(st);
      if (s.length) { min = s[0].date; max = s[s.length - 1].date; }
      for (const a of st.accounts) if (!min || a.startDate < min) min = a.startDate;
      return { min, max };
    });
  },
  monthly(st, fromKey, toKey) {
    const out = []; let k = fromKey, g = 0;
    while (k <= toKey && g++ < 1300) { out.push({ month: k, ...this.totals(st, DateUtil.monthStart(k), DateUtil.monthEnd(k)) }); k = DateUtil.addMonthKey(k, 1); }
    return out;
  },
  buckets(st, from, to) {
    const days = DateUtil.diffDays(from, to) + 1;
    const mode = days <= 31 ? 'day' : days <= 120 ? 'week' : days <= 1100 ? 'month' : 'year';
    const ranges = [];
    if (mode === 'day') { for (let d = from; d <= to; d = DateUtil.addDays(d, 1)) ranges.push({ from: d, to: d, label: DateUtil.shortVN(d) }); }
    else if (mode === 'week') {
      let s = from;
      while (s <= to) { let e = DateUtil.addDays(DateUtil.startOfWeek(s), 6); if (e > to) e = to; ranges.push({ from: s, to: e, label: DateUtil.shortVN(s) }); s = DateUtil.addDays(e, 1); }
    } else if (mode === 'month') {
      for (const k of DateUtil.monthsInRange(from, to)) ranges.push({ from: k === DateUtil.monthKey(from) ? from : DateUtil.monthStart(k), to: k === DateUtil.monthKey(to) ? to : DateUtil.monthEnd(k), label: DateUtil.monthShort(k) });
    } else {
      for (let y = Number(from.slice(0, 4)); y <= Number(to.slice(0, 4)); y++) ranges.push({ from: y === Number(from.slice(0, 4)) ? from : `${y}-01-01`, to: y === Number(to.slice(0, 4)) ? to : `${y}-12-31`, label: String(y) });
    }
    return { mode, items: ranges.map(r => ({ ...r, ...this.totals(st, r.from, r.to) })) };
  },
  /** Báo cáo dòng tiền tài khoản + đối chiếu với biến động số dư thực tế. */
  cashflow(st, from, to) {
    const r = { income: 0, expenseCash: 0, expenseDebt: 0, interest: 0, principal: 0, debtPay: 0, borrowed: 0, adjIn: 0, adjOut: 0, transfers: 0, transferCount: 0, openingNew: 0 };
    for (const t of this.txnsInRange(st, from, to)) {
      switch (t.type) {
        case 'income': r.income += t.amount; break;
        case 'expense': if (t.debtId) r.expenseDebt += t.amount; else r.expenseCash += t.amount; break;
        case 'debt_payment': r.debtPay += t.amount; r.principal += t.principal; r.interest += t.interest; break;
        case 'borrow': r.borrowed += t.amount; break;
        case 'adjustment': if (t.direction === 'in') r.adjIn += t.amount; else r.adjOut += t.amount; break;
        case 'transfer': r.transfers += t.amount; r.transferCount++; break;
      }
    }
    for (const a of st.accounts) if (a.startDate >= from && a.startDate <= to) r.openingNew += a.openingBalance;
    r.inflow = r.income + r.borrowed + r.adjIn + r.openingNew;
    r.outflow = r.expenseCash + r.debtPay + r.adjOut;
    r.computedChange = r.inflow - r.outflow;
    const sumMap = m => { let s = 0; for (const v of m.values()) s += v; return s; };
    r.balanceStart = sumMap(this.accountBalances(st, DateUtil.addDays(from, -1)));
    r.balanceEnd = sumMap(this.accountBalances(st, to));
    r.actualChange = r.balanceEnd - r.balanceStart;
    r.matches = r.actualChange === r.computedChange;
    return r;
  }
};

/* --------------------------- Ngân sách --------------------------- */
const Budget = {
  id(month, categoryId) { return `bud_${month}_${categoryId}`; },
  status(pct) { if (pct === null) return 'ok'; if (pct > 100) return 'over'; if (pct >= 100) return 'full'; if (pct >= 80) return 'warn'; return 'ok'; },
  STATUS: { ok: { label: 'Trong hạn mức', tone: 'green' }, warn: { label: 'Đã dùng ≥ 80%', tone: 'amber' }, full: { label: 'Đã dùng hết', tone: 'amber' }, over: { label: 'Vượt hạn mức', tone: 'red' } },
  usage(st, month) {
    return memo(st, 'bud:' + month, () => {
      const spent = Ledger.byCategory(st, 'expense', DateUtil.monthStart(month), DateUtil.monthEnd(month));
      const cats = Util.byId(st.categories);
      const rows = st.budgets.filter(b => b.month === month).map(b => {
        const s = (spent.get(b.categoryId) || { amount: 0 }).amount;
        const pct = b.limit > 0 ? s / b.limit * 100 : null;
        return { budget: b, cat: cats.get(b.categoryId), limit: b.limit, spent: s, remaining: b.limit - s, pct, status: this.status(pct) };
      }).sort((a, b) => (b.pct || 0) - (a.pct || 0));
      const budgeted = new Set(rows.map(r => r.budget.categoryId));
      const unbudgeted = [];
      for (const [cid, v] of spent) if (!budgeted.has(cid)) unbudgeted.push({ cat: cats.get(cid), categoryId: cid, spent: v.amount, count: v.count });
      unbudgeted.sort((a, b) => b.spent - a.spent);
      const limit = Util.sum(rows, r => r.limit), used = Util.sum(rows, r => r.spent);
      return { month, rows, unbudgeted, limit, spent: used, remaining: limit - used, pct: limit > 0 ? used / limit * 100 : null, overCount: rows.filter(r => r.status === 'over').length };
    });
  }
};

/* --------------------------- Giao dịch định kỳ --------------------------- */
const Recurring = {
  occurrences(rule, until, limit = 4000) {
    const out = [];
    if (!DateUtil.isISO(rule.startDate) || !FREQUENCIES[rule.frequency]) return out;
    const iv = rule.interval || 1; const anchor = Number(rule.startDate.slice(8, 10));
    for (let i = 0; i < limit; i++) {
      let d;
      switch (rule.frequency) {
        case 'daily': d = DateUtil.addDays(rule.startDate, i * iv); break;
        case 'weekly': d = DateUtil.addDays(rule.startDate, 7 * i * iv); break;
        case 'monthly': d = DateUtil.addMonths(rule.startDate, i * iv, anchor); break;
        case 'yearly': d = DateUtil.addMonths(rule.startDate, 12 * i * iv, anchor); break;
      }
      if (d > until || (rule.endDate && d > rule.endDate)) break;
      out.push(d);
    }
    return out;
  },
  txnId(ruleId, date) { return `txn_rec_${ruleId}_${date}`; },
  created(st) {
    return memo(st, 'recCreated', () => {
      const m = new Map();
      for (const t of st.transactions) if (t.recurringId) { if (!m.has(t.recurringId)) m.set(t.recurringId, new Set()); m.get(t.recurringId).add(t.recurringDate); }
      return m;
    });
  },
  handled(st, rule) { const s = new Set(this.created(st).get(rule.id) || []); for (const d of rule.skipped || []) s.add(d); return s; },
  due(st, today = DateUtil.today()) {
    return memo(st, 'due:' + today, () => {
      const out = [];
      for (const r of st.recurring) {
        if (!r.active) continue;
        const handled = this.handled(st, r);
        for (const d of this.occurrences(r, today)) if (!handled.has(d)) out.push({ rule: r, date: d });
      }
      return out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    });
  },
  next(st, rule, today = DateUtil.today()) {
    const horizon = DateUtil.addDays(today, 800);
    const handled = this.handled(st, rule);
    for (const d of this.occurrences(rule, horizon)) if (d >= today && !handled.has(d)) return d;
    return null;
  },
  amount(t) { return t.type === 'debt_payment' ? (t.principal || 0) + (t.interest || 0) : t.amount; },
  buildTxn(rule, date) {
    const t = rule.template; const now = Util.nowISO();
    return Model.transaction({
      id: this.txnId(rule.id, date), type: t.type, date, amount: this.amount(t),
      accountId: t.accountId, toAccountId: t.toAccountId, categoryId: t.categoryId, debtId: t.debtId,
      principal: t.principal, interest: t.interest, goalId: t.goalId,
      payee: t.payee, note: t.note || rule.name, tags: t.tags, reconciled: false,
      recurringId: rule.id, recurringDate: date, createdAt: now, updatedAt: now
    });
  },
  describe(rule) { const iv = rule.interval || 1; return `Mỗi ${iv > 1 ? iv + ' ' : ''}${FREQUENCIES[rule.frequency] || ''}`; }
};

/* --------------------------- Mục tiêu --------------------------- */
const Goals = {
  progress(st, g, today = DateUtil.today()) {
    let saved = 0;
    if (g.mode === 'account') saved = Math.max(0, Ledger.current(st).balances.get(g.accountId) || 0);
    else if (g.mode === 'transfer') { for (const t of st.transactions) if (t.type === 'transfer' && t.goalId === g.id && t.date <= today) saved += t.amount; }
    else for (const c of g.contributions) saved += c.direction === 'out' ? -c.amount : c.amount;
    const target = g.target;
    const pct = target > 0 ? Math.min(saved / target * 100, 999) : 0;
    const remaining = Math.max(0, target - saved);
    let monthsLeft = null, requiredMonthly = null, overdue = false;
    if (g.deadline) {
      if (g.deadline < today) overdue = remaining > 0;
      else { monthsLeft = Math.max(1, DateUtil.monthsUntil(today, g.deadline)); requiredMonthly = Math.ceil(remaining / monthsLeft); }
    }
    return { saved, target, pct, remaining, monthsLeft, requiredMonthly, overdue, reached: saved >= target };
  }
};

/* --------------------------- Bản chụp tài sản ròng --------------------------- */
const Snapshots = {
  compute(st, source = 'auto') {
    const c = Ledger.current(st);
    return { id: 'snap_' + c.asOf, date: c.asOf, cash: c.cash, otherAssets: c.otherAssets, totalAssets: c.totalAssets, liabilities: c.liabilities, netWorth: c.netWorth, source, updatedAt: '' };
  },
  /** Cập nhật bản chụp của ngày hôm nay nếu số liệu thay đổi. Trả về true nếu có thay đổi. */
  upsertToday(st, source = 'auto') {
    if (!st.accounts.length && !st.assets.length && !st.debts.length) return false;
    const snap = this.compute(st, source);
    const i = st.snapshots.findIndex(s => s.date === snap.date);
    if (i >= 0) {
      const o = st.snapshots[i];
      if (o.cash === snap.cash && o.otherAssets === snap.otherAssets && o.liabilities === snap.liabilities && (source === 'auto' || o.source === 'manual')) return false;
      st.snapshots[i] = { ...o, ...snap, id: o.id, source: o.source === 'manual' ? 'manual' : source };
    } else st.snapshots.push(snap);
    st.snapshots.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    return true;
  }
};

/* --------------------------- Góc nhìn tài chính (dựa trên quy tắc) --------------------------- */
const Insights = {
  /** Chi tiêu bình quân tháng của tối đa 3 tháng trọn vẹn gần nhất có dữ liệu. */
  avgMonthlyExpense(st) {
    const today = DateUtil.today(); const b = Ledger.bounds(st);
    if (!b.min) return null;
    const firstMonth = DateUtil.monthKey(b.min);
    const months = [];
    for (let i = 1; i <= 3; i++) { const k = DateUtil.addMonthKey(DateUtil.monthKey(today), -i); if (k >= firstMonth) months.push(k); }
    if (!months.length) return null;
    const total = Util.sum(months, k => Ledger.totals(st, DateUtil.monthStart(k), DateUtil.monthEnd(k)).expense);
    if (total <= 0) return null;
    return { avg: Math.round(total / months.length), months: months.slice().reverse() };
  },
  runway(st) {
    const a = this.avgMonthlyExpense(st); if (!a) return null;
    const liquid = Ledger.current(st).liquid;
    return { months: liquid / a.avg, liquid, avg: a.avg, basis: a.months };
  },
  debtPace(st) {
    const today = DateUtil.today(); const months = [1, 2, 3].map(i => DateUtil.addMonthKey(DateUtil.monthKey(today), -i));
    const from = DateUtil.monthStart(months[2]), to = DateUtil.monthEnd(months[0]);
    let principal = 0; for (const t of Ledger.txnsInRange(st, from, to)) if (t.type === 'debt_payment') principal += t.principal;
    return { avg: Math.round(principal / 3), from, to };
  },
  generate(st, period, prefs) {
    const out = []; const p = period;
    const basis = `Kỳ ${p.range}`;
    const tot = Ledger.totals(st, p.from, p.to);
    const cats = Util.byId(st.categories);
    const cname = id => (cats.get(id) || { name: 'Không rõ' }).name;
    const exp = Ledger.byCategory(st, 'expense', p.from, p.to);
    if (tot.expense > 0) {
      let top = null; for (const [k, v] of exp) if (!top || v.amount > top[1].amount) top = [k, v];
      out.push({ level: 'info', icon: 'pie', title: `Chi nhiều nhất: ${cname(top[0])}`, text: `${Money.format(top[1].amount)} — chiếm ${Util.fmtPct(top[1].amount / tot.expense * 100)} tổng chi tiêu (${top[1].count} khoản).`, basis });
    }
    const prev = Period.previous(p);
    if (prev && tot.expense > 0) {
      const pt = Ledger.totals(st, prev.from, prev.to);
      if (pt.expense > 0) {
        const pexp = Ledger.byCategory(st, 'expense', prev.from, prev.to);
        let best = null;
        for (const [k, v] of exp) { const before = (pexp.get(k) || { amount: 0 }).amount; const diff = v.amount - before; if (diff > 0 && (!best || diff > best.diff)) best = { k, diff, before, now: v.amount }; }
        const cmp = `So sánh ${p.range} với ${Period.rangeText(prev.from, prev.to)}`;
        if (best) out.push({ level: 'warn', icon: 'trendUp', title: `Tăng mạnh nhất: ${cname(best.k)}`, text: best.before > 0 ? `Tăng ${Money.format(best.diff)} (+${Util.fmtPct(best.diff / best.before * 100)}) so với kỳ trước.` : `Phát sinh mới ${Money.format(best.diff)} (kỳ trước không có).`, basis: cmp });
        const change = (tot.expense - pt.expense) / pt.expense * 100;
        out.push({ level: change > 0 ? 'warn' : 'good', icon: change > 0 ? 'trendUp' : 'trendDown', title: `Tổng chi ${change > 0 ? 'tăng' : 'giảm'} ${Util.fmtPct(Math.abs(change))}`, text: `${Money.format(tot.expense)} so với ${Money.format(pt.expense)} kỳ trước.`, basis: cmp });
      }
    }
    if (tot.income > 0) {
      const target = st.settings.savingsRateTarget;
      const r = tot.savingsRate;
      out.push({ level: r >= target ? 'good' : r >= 0 ? 'warn' : 'bad', icon: 'coins', title: `Tỷ lệ tiết kiệm ${Util.fmtPct(r)}`, text: r >= target ? `Đạt mục tiêu ${target}% (dòng tiền ròng ${Money.format(tot.net)}).` : `Thấp hơn mục tiêu ${target}% — cần thêm ${Money.format(Math.max(0, Math.ceil(tot.income * target / 100) - tot.net))} để đạt.`, basis: basis + ' · Tỷ lệ = (Thu − Chi) / Thu' });
    }
    const today = DateUtil.today();
    const bm = DateUtil.monthKey(p.to < today ? p.to : (p.from > today ? p.from : today));
    const bu = Budget.usage(st, bm);
    const over = bu.rows.filter(r => r.status === 'over');
    if (over.length) out.push({ level: 'bad', icon: 'alert', title: `${over.length} ngân sách vượt hạn mức`, text: over.slice(0, 3).map(r => `${r.cat ? r.cat.name : '?'} (${Util.fmtPct(r.pct, 0)})`).join(', ') + (over.length > 3 ? '…' : ''), basis: DateUtil.monthLabel(bm) });
    else if (bu.rows.length) { const warn = bu.rows.filter(r => r.status === 'warn' || r.status === 'full'); if (warn.length) out.push({ level: 'warn', icon: 'pie', title: `${warn.length} ngân sách sắp chạm hạn mức`, text: warn.slice(0, 3).map(r => `${r.cat ? r.cat.name : '?'} (${Util.fmtPct(r.pct, 0)})`).join(', '), basis: DateUtil.monthLabel(bm) }); }
    const cur = Ledger.current(st);
    if (cur.liabilities > 0) {
      const dp = this.debtPace(st);
      if (dp.avg > 0) out.push({ level: 'info', icon: 'trendDown', title: `Giảm nợ ~${Money.format(dp.avg)}/tháng`, text: `Với tốc độ trả gốc này, dư nợ ${Money.format(cur.liabilities)} cần khoảng ${Math.ceil(cur.liabilities / dp.avg)} tháng để tất toán.`, basis: `Trả gốc bình quân ${Period.rangeText(dp.from, dp.to)}` });
      else out.push({ level: 'warn', icon: 'alert', title: 'Chưa ghi nhận trả gốc gần đây', text: `Dư nợ hiện tại ${Money.format(cur.liabilities)}; 3 tháng gần nhất chưa có khoản trả gốc nào.`, basis: `${Period.rangeText(dp.from, dp.to)}` });
    }
    const rw = this.runway(st);
    if (rw) {
      const target = st.settings.emergencyTargetMonths;
      out.push({ level: rw.months >= target ? 'good' : rw.months >= 3 ? 'warn' : 'bad', icon: 'shield', title: `Quỹ thanh khoản đủ ~${rw.months.toLocaleString('vi-VN', { maximumFractionDigits: 1 })} tháng`, text: `Tiền mặt + ngân hàng + ví + tiết kiệm ${Money.format(rw.liquid)} so với chi bình quân ${Money.format(rw.avg)}/tháng (mục tiêu ${target} tháng).`, basis: `Chi bình quân ${rw.basis.map(DateUtil.monthShort).join(', ')}` });
    }
    const due = Recurring.due(st).length;
    if (due) out.push({ level: 'warn', icon: 'repeat', title: `${due} giao dịch định kỳ chờ xác nhận`, text: 'Mở mục Giao dịch định kỳ để tạo hoặc bỏ qua.', basis: 'Tính đến hôm nay' });
    if (prefs && st.transactions.length >= 5) {
      const lb = prefs.lastBackupAt; const days = lb ? Math.floor((Date.now() - new Date(lb).getTime()) / 86400000) : null;
      if (days === null || days >= 7) out.push({ level: 'warn', icon: 'download', title: days === null ? 'Chưa từng sao lưu ra file' : `Đã ${days} ngày chưa sao lưu ra file`, text: 'Hãy xuất file JSON để phòng mất dữ liệu trình duyệt.', basis: 'Thiết bị này' });
    }
    return out;
  }
};

/* --------------------------- Theo dõi thay đổi (dấu thời gian + bản ghi xóa) cho đồng bộ --------------------------- */
const _keyCache = new WeakMap();
const Changes = {
  key(rec) {
    if (_keyCache.has(rec)) return _keyCache.get(rec);
    const { updatedAt, ...rest } = rec; void updatedAt;
    const k = JSON.stringify(rest); _keyCache.set(rec, k); return k;
  },
  /** Đóng dấu updatedAt cho bản ghi mới/sửa; tạo tombstone cho bản ghi bị xóa. */
  stamp(before, draft, now = Util.nowISO()) {
    const tomb = new Map((draft.tombstones || []).map(t => [t.c + '|' + t.id, t]));
    let changed = 0;
    for (const c of COLLECTIONS) {
      const prev = new Map(before[c].map(r => [r.id, r]));
      const ids = new Set();
      for (const r of draft[c]) {
        ids.add(r.id);
        const p = prev.get(r.id);
        if (!p || this.key(p) !== this.key(r)) { r.updatedAt = now; changed++; }
        else r.updatedAt = p.updatedAt;
        const tk = c + '|' + r.id;
        if (tomb.has(tk) && tomb.get(tk).at < r.updatedAt) tomb.delete(tk);
      }
      for (const id of prev.keys()) if (!ids.has(id)) { tomb.set(c + '|' + id, { c, id, at: now }); changed++; }
    }
    const sKey = s => { const { updatedAt, ...rest } = s; void updatedAt; return JSON.stringify(rest); };
    if (sKey(before.settings) !== sKey(draft.settings)) draft.settings.updatedAt = now;
    const cutoff = new Date(Date.now() - TOMBSTONE_TTL_DAYS * 86400000).toISOString();
    draft.tombstones = Array.from(tomb.values()).filter(t => t.at >= cutoff);
    return changed;
  }
};

/* --------------------------- Hợp nhất 2 bộ dữ liệu (đồng bộ / nhập file) --------------------------- */
const MergeService = {
  /** Hợp nhất theo từng bản ghi: bản sửa sau cùng (updatedAt) thắng; xóa (tombstone) thắng nếu mới hơn. */
  merge(local, remote) {
    const tomb = new Map();
    const addT = t => { const k = t.c + '|' + t.id; if (!tomb.has(k) || tomb.get(k).at < t.at) tomb.set(k, { ...t }); };
    (local.tombstones || []).forEach(addT); (remote.tombstones || []).forEach(addT);
    const out = { tombstones: [] }; let localChanged = false, remoteChanged = false;
    const stats = { added: 0, updated: 0, deleted: 0 };
    const ts = r => (r && r.updatedAt) || '';
    for (const c of COLLECTIONS) {
      const lm = new Map((local[c] || []).map(r => [r.id, r])), rm = new Map((remote[c] || []).map(r => [r.id, r]));
      const ids = new Set([...lm.keys(), ...rm.keys()]);
      const res = [];
      for (const id of ids) {
        const l = lm.get(id), r = rm.get(id);
        let cand = !l ? r : !r ? l : (ts(r) > ts(l) ? r : l);
        const t = tomb.get(c + '|' + id);
        if (t && t.at >= ts(cand)) cand = null;
        if (cand && c === 'recurring' && l && r) {
          const sk = Array.from(new Set([...(l.skipped || []), ...(r.skipped || [])])).sort();
          if (sk.length !== (cand.skipped || []).length) cand = { ...cand, skipped: sk };
          if (sk.length !== (l.skipped || []).length) localChanged = true;
          if (sk.length !== (r.skipped || []).length) remoteChanged = true;
        }
        if (cand) res.push(cand);
        const same = (a, b) => (!a && !b) || (a && b && ts(a) === ts(b));
        if (!same(cand, l)) { localChanged = true; if (!l) stats.added++; else if (!cand) stats.deleted++; else stats.updated++; }
        if (!same(cand, r)) remoteChanged = true;
      }
      out[c] = res;
    }
    const cutoff = new Date(Date.now() - TOMBSTONE_TTL_DAYS * 86400000).toISOString();
    out.tombstones = Array.from(tomb.values()).filter(t => t.at >= cutoff);
    const tk = arr => new Set((arr || []).map(t => t.c + '|' + t.id + '|' + t.at));
    const ot = tk(out.tombstones), ltk = tk(local.tombstones), rtk = tk(remote.tombstones);
    const eqSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
    if (!eqSet(ot, ltk)) localChanged = true;
    if (!eqSet(ot, rtk)) remoteChanged = true;
    const ls = local.settings || {}, rs = remote.settings || {};
    if ((rs.updatedAt || '') > (ls.updatedAt || '')) { out.settings = rs; localChanged = true; }
    else { out.settings = ls; if ((ls.updatedAt || '') !== (rs.updatedAt || '')) remoteChanged = true; }
    return { data: out, localChanged, remoteChanged, stats };
  }
};

/* --------------------------- Sao lưu / khôi phục / CSV --------------------------- */
const ImportExport = {
  buildBackup(st) {
    const data = { settings: st.settings, tombstones: st.tombstones || [] };
    const counts = {};
    for (const c of COLLECTIONS) { data[c] = st[c]; counts[c] = st[c].length; }
    return { app: APP_NAME, format: 'finpilot-backup', appVersion: APP_VERSION, schemaVersion: SCHEMA_VERSION, exportedAt: Util.nowISO(), timezone: TZ, counts, data: Util.clone(data) };
  },
  filename() { return `FinPilot_Backup_${DateUtil.today()}.json`; },
  /** Kiểm tra file sao lưu. Không ghi gì vào dữ liệu hiện tại. */
  parse(text) {
    const fail = (...msgs) => ({ ok: false, errors: msgs, warnings: [] });
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return fail('File không phải JSON hợp lệ (' + e.message + ').'); }
    if (!Util.isObj(obj)) return fail('Cấu trúc file không hợp lệ.');
    if (obj.format !== 'finpilot-backup' && obj.format !== 'finpilot-sync' && obj.app !== APP_NAME) return fail('Đây không phải file sao lưu của FinPilot Offline.');
    const v = obj.schemaVersion;
    if (!Number.isInteger(v)) return fail('Thiếu phiên bản cấu trúc dữ liệu (schemaVersion).');
    if (v > SCHEMA_VERSION) return fail(`File dùng cấu trúc dữ liệu phiên bản ${v}, mới hơn phiên bản ứng dụng hỗ trợ (${SCHEMA_VERSION}). Hãy dùng FinPilot mới hơn để mở.`);
    if (v < 1) return fail('Phiên bản cấu trúc dữ liệu không hợp lệ.');
    const d = obj.data;
    if (!Util.isObj(d)) return fail('Thiếu phần dữ liệu (data).');
    const errors = [], warnings = [];
    for (const c of COLLECTIONS) {
      if (!Array.isArray(d[c])) errors.push(`Thiếu hoặc sai kiểu danh sách "${COLL_LABELS[c]}".`);
      else if (d[c].some(x => !Util.isObj(x))) errors.push(`Danh sách "${COLL_LABELS[c]}" có phần tử không hợp lệ.`);
    }
    if (errors.length) return { ok: false, errors, warnings };
    if (!Util.isObj(d.settings)) warnings.push('File không có phần cài đặt — sẽ dùng cài đặt mặc định.');
    if (Util.isObj(obj.counts)) for (const c of COLLECTIONS) if (Number.isInteger(obj.counts[c]) && obj.counts[c] !== d[c].length) errors.push(`Số lượng ${COLL_LABELS[c]} (${d[c].length}) không khớp thông tin trong file (${obj.counts[c]}) — file có thể bị cắt hoặc chỉnh sửa.`);
    const ds = Model.dataset(d);
    const integ = Validation.integrity(ds);
    errors.push(...integ.errors); warnings.push(...integ.warnings);
    const counts = {}; for (const c of COLLECTIONS) counts[c] = ds[c].length;
    return { ok: errors.length === 0, errors, warnings, dataset: ds, counts, exportedAt: obj.exportedAt, appVersion: obj.appVersion };
  },
  csv(st, txns, sep = ',') {
    const acc = Util.byId(st.accounts), cat = Util.byId(st.categories), debt = Util.byId(st.debts);
    const esc = v => {
      let s = String(v === null || v === undefined ? '' : v);
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return (s.includes(sep) || /["\r\n]/.test(s)) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const header = ['Ngày', 'Loại', 'Số tiền (VND)', 'Ảnh hưởng thu/chi (VND)', 'Tài khoản / Nguồn', 'Tài khoản nhận', 'Danh mục', 'Khoản nợ', 'Tiền gốc', 'Tiền lãi', 'Người nhận / Nguồn thu', 'Thẻ', 'Ghi chú', 'Đã đối soát', 'Mã giao dịch'];
    const lines = [header.map(esc).join(sep)];
    for (const t of txns) {
      const pnl = t.type === 'income' ? t.amount : t.type === 'expense' ? -t.amount : t.type === 'debt_payment' ? -t.interest : 0;
      lines.push([
        DateUtil.toVN(t.date), TXN_TYPES[t.type].label, t.amount, pnl,
        t.accountId ? (acc.get(t.accountId) || {}).name : (t.debtId && t.type === 'expense' ? 'Nợ: ' + (debt.get(t.debtId) || {}).name : ''),
        t.toAccountId ? (acc.get(t.toAccountId) || {}).name : '',
        t.type === 'debt_payment' ? (t.interest > 0 ? (cat.get(INTEREST_CAT_ID) || {}).name : '') : (cat.get(t.categoryId) || {}).name || '',
        t.debtId ? (debt.get(t.debtId) || {}).name : '',
        t.type === 'debt_payment' ? t.principal : '', t.type === 'debt_payment' ? t.interest : '',
        t.payee, (t.tags || []).join(' | '), t.note, t.reconciled ? 'Có' : '', t.id
      ].map(esc).join(sep));
    }
    return '﻿' + lines.join('\r\n');
  }
};

  function parseRemote(text) {
    let obj; try { obj = JSON.parse(text); } catch (e) { throw err('REMOTE', 'Tệp đồng bộ trên Drive bị hỏng (không phải JSON hợp lệ).'); }
    if (!Util.isObj(obj) || obj.format !== 'finpilot-sync' || !Util.isObj(obj.data)) throw err('REMOTE', 'Tệp đồng bộ trên Drive không đúng định dạng FinPilot.');
    if (!Number.isInteger(obj.schemaVersion) || obj.schemaVersion > SCHEMA_VERSION) throw err('VERSION', `Dữ liệu trên Drive dùng cấu trúc phiên bản ${obj.schemaVersion} mới hơn ứng dụng này. Hãy cập nhật FinPilot trên thiết bị này.`);
    for (const c of COLLECTIONS) if (!Array.isArray(obj.data[c])) throw err('REMOTE', `Tệp đồng bộ thiếu danh sách ${COLL_LABELS[c]}.`);
    return Model.dataset(obj.data);
  }

  /* ---------- Quy trình đồng bộ ---------- */
  async function run(reason) {
    await ensureIdentity();
    const dirty = App.state.meta.revision !== cfg.syncedRevision;
    let syncedRev = App.state.meta.revision;
    const upload = async id => {
      syncedRev = App.state.meta.revision;
      const content = payload(App.state);
      const r = id ? await updateFile(id, content) : await createFile(content);
      cfg.fileId = r.id || id; cfg.lastRemoteModified = r.modifiedTime;
    };
    let files = null, fileId = cfg.fileId || null, remoteMod = null;
    if (fileId) {
      const meta = await getMeta(fileId);
      if (!meta) { fileId = null; cfg.fileId = null; cfg.lastRemoteModified = null; }
      else remoteMod = meta.modifiedTime;
    }
    if (!fileId) {
      files = await listFiles();
      if (files.length) { fileId = files[0].id; remoteMod = files[0].modifiedTime; }
    }
    let uploaded = false, merged = null;
    if (!fileId) {
      await upload(null); uploaded = true;
    } else if (fileId === cfg.fileId && remoteMod === cfg.lastRemoteModified && !(files && files.length > 1)) {
      if (dirty) { await upload(fileId); uploaded = true; }
    } else {
      let remote = parseRemote(await download(fileId));
      if (files && files.length > 1) { // hai thiết bị cùng tạo tệp lần đầu → gộp và dọn tệp thừa
        for (const f of files.slice(1)) { try { const other = parseRemote(await download(f.id)); remote = MergeService.merge(remote, other).data; } catch (e) {} }
      }
      merged = await App.applyRemote(remote);
      syncedRev = App.state.meta.revision;
      cfg.fileId = fileId;
      if (merged.remoteNeedsUpdate || (files && files.length > 1)) {
        await upload(fileId); uploaded = true;
        if (files && files.length > 1) for (const f of files.slice(1)) { try { await deleteFile(f.id); } catch (e) {} }
      } else cfg.lastRemoteModified = remoteMod;
    }
    cfg.syncedRevision = syncedRev;
    cfg.lastSyncAt = Util.nowISO(); cfg.lastError = null;
    writeCfg();
    return { uploaded, merged, reason };
  }

  async function syncNow(reason = 'manual') {
    if (!cfg.enabled || !cfg.clientId) return null;
    if (!supported()) { setStatus('error', 'Cần mở ứng dụng qua địa chỉ https để đồng bộ'); return null; }
    if (!navigator.onLine) { setStatus('offline', 'Ngoại tuyến — sẽ đồng bộ khi có mạng'); return null; }
    if (!tokenValid()) { setStatus('auth', 'Cần đăng nhập lại Google'); return null; }
    if (!App.canSync()) { setStatus('error', 'Tạm dừng đồng bộ vì dữ liệu cục bộ đang bị khóa ghi'); return null; }
    if (syncing) { pending = true; return null; }
    syncing = true; setStatus('busy', 'Đang đồng bộ…');
    let result = null;
    try {
      result = await run(reason);
      const m = result.merged;
      setStatus('ok', 'Đã đồng bộ ' + DateUtil.timeVN());
      if (m && m.localChanged && reason !== 'poll') Toast.show(`Đã nhận dữ liệu từ thiết bị khác: ${m.stats.added} mới, ${m.stats.updated} cập nhật, ${m.stats.deleted} xóa.`, { type: 'info' });
      else if (m && m.localChanged) Toast.show('Đã cập nhật dữ liệu mới từ thiết bị khác.', { type: 'info' });
    } catch (e) {
      cfg.lastError = e.message; writeCfg();
      if (e.code === 'AUTH') setStatus('auth', 'Cần đăng nhập lại Google');
      else if (e.code === 'ACCOUNT') { setStatus('auth', 'Sai tài khoản Google — đã chặn đồng bộ'); Modal.alert({ title: 'Đăng nhập sai tài khoản Google', message: e.message, tone: 'danger' }); return null; }
      else if (e.code === 'NETWORK') setStatus('offline', 'Mất kết nối — sẽ thử lại');
      else setStatus('error', 'Lỗi đồng bộ: ' + e.message);
      if (reason === 'manual' || reason === 'connect') Toast.show(e.message, { type: 'error' });
    } finally {
      syncing = false;
      if (pending) { pending = false; schedule(1500); }
    }
    return result;
  }
  function schedule(ms = 2500) {
    if (!cfg.enabled) return;
    clearTimeout(timer); timer = setTimeout(() => syncNow('auto'), ms);
  }

  return {
    status, FILE_NAME, SCOPE,
    get cfg() { return cfg; },
    supported, redirectUri, tokenValid, isStandaloneIOS, handleRedirect, loadGis,
    onStatus(fn) { listeners.push(fn); },
    isEnabled() { return !!cfg.enabled && !!cfg.clientId; },
    isSyncing() { return syncing; },
    setClientId(id) {
      const v = String(id || '').trim();
      if (!/^[0-9]+-[a-z0-9_]+\.apps\.googleusercontent\.com$/i.test(v)) throw new AppError('Client ID không đúng định dạng (dạng 1234…-abc….apps.googleusercontent.com).');
      if (v !== cfg.clientId) { cfg.clientId = v; cfg.token = null; cfg.expiresAt = null; cfg.fileId = null; cfg.lastRemoteModified = null; }
      writeCfg();
    },
    setAuthMode(m) { cfg.authMode = m === 'popup' ? 'popup' : 'redirect'; writeCfg(); },
    authMode() { return cfg.authMode === 'popup' ? 'popup' : 'redirect'; },
    async connect() {
      if (!cfg.clientId) throw new AppError('Vui lòng nhập OAuth Client ID trước.');
      if (!supported()) throw new AppError('Đăng nhập Google chỉ hoạt động khi ứng dụng được mở qua địa chỉ https (ví dụ GitHub Pages).');
      if (!navigator.onLine) throw new AppError('Thiết bị đang ngoại tuyến.');
      const st = App.state;
      if (!boundEmail() && st && (st.transactions.length || st.accounts.length)) {
        const ok = await Modal.confirm({ title: 'Gắn hồ sơ với tài khoản Google', message: `Hồ sơ "${Profiles.active().name}" đang có ${st.accounts.length} tài khoản và ${st.transactions.length} giao dịch.\n\nKhi kết nối, toàn bộ dữ liệu này sẽ được đưa lên Google Drive của tài khoản bạn sắp đăng nhập, và hồ sơ sẽ gắn cố định với tài khoản đó.\n\nNếu dữ liệu này KHÔNG phải của bạn, hãy bấm Hủy và tạo hồ sơ mới (Cài đặt → Hồ sơ trên thiết bị này).`, confirmText: 'Đây là dữ liệu của tôi — kết nối' });
        if (!ok) return;
      }
      cfg.enabled = true; writeCfg();
      if (this.authMode() === 'popup') { await popupAuth(); await syncNow('connect'); startPolling(); }
      else { await App.flush(); startRedirectAuth({ silent: false }); }
    },
    async reconnect() { return this.connect(); },
    /** Khi mở app: nếu token hết hạn và dùng chế độ chuyển trang → thử gia hạn im lặng (không hỏi lại). */
    async autoStart() {
      if (!cfg.enabled || !cfg.clientId) { setStatus('off', 'Chưa bật đồng bộ'); return; }
      startPolling();
      if (!supported()) { setStatus('error', 'Cần mở qua https để đồng bộ'); return; }
      if (tokenValid()) { syncNow('open'); return; }
      if (this.authMode() === 'redirect' && navigator.onLine && (boundEmail() || cfg.email)) {
        let tried = 0; try { tried = Number(sessionStorage.getItem(SS_SILENT) || 0); } catch (e) {}
        if (Date.now() - tried > 5 * 60000) {
          try { sessionStorage.setItem(SS_SILENT, String(Date.now())); } catch (e) {}
          await App.flush(); startRedirectAuth({ silent: true }); return;
        }
      }
      setStatus('auth', 'Cần đăng nhập lại Google');
    },
    afterRedirect(res) {
      if (!res || res.reload) return;
      if (res.ok) { setStatus('idle', 'Đã đăng nhập Google'); }
      else if (res.silent) setStatus('auth', 'Cần đăng nhập lại Google');
      else { setStatus('error', 'Đăng nhập thất bại'); Toast.show('Đăng nhập Google thất bại: ' + res.error, { type: 'error', timeout: 8000 }); }
    },
    syncNow, schedule, boundEmail,
    disconnect({ keepConfig = true } = {}) {
      const id = cfg.clientId, mode = cfg.authMode, dev = cfg.deviceId, be = cfg.boundEmail;
      cfg = keepConfig ? { clientId: id, authMode: mode, deviceId: dev, boundEmail: be } : { deviceId: dev, boundEmail: be };
      verifiedToken = null;
      writeCfg(); stopPolling(); setStatus('off', 'Chưa bật đồng bộ');
    },
    async deleteRemote() {
      const files = cfg.fileId ? [{ id: cfg.fileId }] : await listFiles();
      for (const f of files) await deleteFile(f.id);
      cfg.fileId = null; cfg.lastRemoteModified = null; writeCfg();
    }
  };
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(() => { if (document.visibilityState === 'visible' && cfg.enabled && !syncing && tokenValid()) syncNow('poll'); }, 90000);
  }
  function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
})();

const Toast = {
  show(msg, { type = 'info', action = null, timeout = 4200 } = {}) {
    const root = document.getElementById('toast-root'); if (!root) return () => {};
    let t;
    const remove = () => { clearTimeout(t); el.classList.add('out'); setTimeout(() => el.remove(), 200); };
    const el = h('div', { class: 'toast toast-' + type, role: type === 'error' ? 'alert' : 'status' },
      h('span', { class: 'toast-msg', text: msg }),
      action ? h('button', { class: 'toast-action', type: 'button', onclick: () => { remove(); action.fn(); } }, action.label) : null,
      h('button', { class: 'toast-close', type: 'button', 'aria-label': 'Đóng thông báo', onclick: remove }, Icon('x', 14)));
    root.append(el);
    while (root.children.length > 4) root.firstChild.remove();
    t = setTimeout(remove, action ? Math.max(timeout, 8000) : (type === 'error' ? Math.max(timeout, 7000) : timeout));
    return remove;
  }
};

const Modal = {
  stack: [],
  open({ title, body, footer = null, size = 'md', onClose = null, dismissible = true }) {
    const root = document.getElementById('modal-root');
    const prevFocus = document.activeElement;
    let closed = false;
    const entry = { dismissible, close: () => close() };
    const backdrop = h('div', { class: 'modal-backdrop' });
    const dialog = h('div', { class: 'modal modal-' + size, role: 'dialog', 'aria-modal': 'true', 'aria-label': title, tabindex: '-1' });
    const bodyEl = h('div', { class: 'modal-body' }, body);
    dialog.append(h('div', { class: 'modal-head' }, h('h2', { text: title }), h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Đóng', onclick: () => { if (dismissible) close(); } }, Icon('x'))), bodyEl);
    if (footer) dialog.append(h('div', { class: 'modal-foot' }, footer));
    backdrop.append(dialog);
    backdrop.addEventListener('mousedown', e => { if (e.target === backdrop && dismissible) close(); });
    root.append(backdrop);
    this.stack.push(entry);
    document.body.classList.add('modal-open');
    setTimeout(() => {
      if (dialog.contains(document.activeElement) && document.activeElement !== dialog) return;
      const f = dialog.querySelector('[autofocus]') || (window.matchMedia('(pointer:fine)').matches ? dialog.querySelector('input:not([type=hidden]):not([type=checkbox]):not([disabled]):not(.date-picker-native),select,textarea') : null);
      (f || dialog).focus({ preventScroll: true });
    }, 30);
    function close() {
      if (closed) return; closed = true;
      backdrop.remove();
      const i = Modal.stack.indexOf(entry); if (i >= 0) Modal.stack.splice(i, 1);
      if (!Modal.stack.length) document.body.classList.remove('modal-open');
      if (onClose) onClose();
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
    }
    return { close, dialog, body: bodyEl };
  },
  closeTop() { const t = this.stack[this.stack.length - 1]; if (t && t.dismissible) t.close(); },
  closeAll() { while (this.stack.length) this.stack[this.stack.length - 1].close(); },
  confirm({ title = 'Xác nhận', message, confirmText = 'Đồng ý', cancelText = 'Hủy', danger = false, details = null }) {
    return new Promise(resolve => {
      let done = false, m;
      const finish = v => { if (done) return; done = true; m.close(); resolve(v); };
      const body = h('div', {}, typeof message === 'string' ? h('p', { text: message, style: { whiteSpace: 'pre-line', margin: 0 } }) : message, details);
      m = this.open({ title, body, size: 'sm', footer: [h('button', { class: 'btn', type: 'button', onclick: () => finish(false) }, cancelText), h('button', { class: 'btn ' + (danger ? 'btn-danger' : 'btn-primary'), type: 'button', autofocus: true, onclick: () => finish(true) }, confirmText)], onClose: () => { if (!done) { done = true; resolve(false); } } });
    });
  },
  alert({ title, message, tone = 'info' }) {
    return new Promise(resolve => {
      const m = this.open({ title, size: 'sm', body: h('div', { class: 'callout ' + (tone === 'danger' ? 'danger' : tone === 'warn' ? 'warn' : '') }, Icon(tone === 'info' ? 'info' : 'alert'), h('div', { style: { whiteSpace: 'pre-line' } }, message)), footer: [h('button', { class: 'btn btn-primary', type: 'button', autofocus: true, onclick: () => m.close() }, 'Đã hiểu')], onClose: resolve });
    });
  }
};

/* --------------------------- Biểu mẫu --------------------------- */
let _fid = 0;
const F = {
  field(label, control, { hint = null, name = '', full = false, required = false } = {}) {
    const target = control.matches && control.matches('input,select,textarea') ? control : control.querySelector('input:not(.date-picker-native),select,textarea');
    if (target && !target.id) target.id = 'f' + (++_fid);
    const wrap = h('div', { class: 'field' + (full ? ' full' : ''), dataset: { field: name || (target && target.name) || '' } },
      h('label', { for: target ? target.id : null }, label, required ? h('span', { class: 'req', text: ' *' }) : null),
      control,
      hint ? h('div', { class: 'field-hint' }, hint) : null,
      h('div', { class: 'field-error', 'aria-live': 'polite' }));
    if (target && target.classList.contains('money-input')) {
      const prev = h('div', { class: 'money-preview' });
      wrap.insertBefore(prev, wrap.querySelector('.field-error'));
      const upd = () => {
        const r = Money.parse(target.value, { allowZero: true, allowEmpty: true });
        prev.textContent = r.ok && r.value !== null && /[a-zà-ỹ,]/i.test(target.value) ? '= ' + Money.format(r.value) : '';
      };
      target.addEventListener('input', upd); upd();
    }
    return wrap;
  },
  input(name, value = '', attrs = {}) { return h('input', { type: 'text', name, autocomplete: 'off', ...attrs, value: value === null || value === undefined ? '' : String(value) }); },
  textarea(name, value = '', attrs = {}) { return h('textarea', { name, rows: 2, ...attrs, value: value || '' }); },
  select(name, options, value, attrs = {}) {
    const sel = h('select', { name, ...attrs });
    const mk = o => h('option', { value: o.value, disabled: !!o.disabled }, o.label);
    for (const o of options) {
      if (o.group) { if (o.options.length) sel.append(h('optgroup', { label: o.group }, o.options.map(mk))); }
      else sel.append(mk(o));
    }
    if (value !== undefined && value !== null) sel.value = value;
    return sel;
  },
  money(name, value, attrs = {}) {
    const v = Object.prototype.hasOwnProperty.call(attrs, 'value') ? (attrs.value || '') : (value === null || value === undefined || value === '' ? '' : Money.num(value));
    const inp = h('input', { type: 'text', name, inputmode: 'decimal', autocomplete: 'off', class: 'money-input', placeholder: 'VD: 1.500.000 hoặc 1,5tr', ...attrs, value: v });
    inp.addEventListener('blur', () => { const r = Money.parse(inp.value, { allowZero: true }); if (r.ok && r.value !== null) inp.value = Money.num(r.value); });
    return inp;
  },
  date(name, iso, attrs = {}) {
    const text = h('input', { type: 'text', name, class: 'date-text', inputmode: 'numeric', placeholder: 'DD/MM/YYYY', autocomplete: 'off', maxlength: '10', ...attrs, value: iso ? DateUtil.toVN(iso) : '' });
    const picker = h('input', { type: 'date', class: 'date-picker-native', tabindex: '-1', 'aria-hidden': 'true' });
    const btn = h('button', { type: 'button', class: 'date-btn', 'aria-label': 'Chọn ngày từ lịch', title: 'Chọn ngày' }, Icon('calendar', 16));
    btn.addEventListener('click', () => {
      picker.value = DateUtil.parseVN(text.value) || DateUtil.today();
      try { if (picker.showPicker) picker.showPicker(); else { picker.style.pointerEvents = 'auto'; picker.focus(); picker.click(); } } catch (e) { text.focus(); }
    });
    picker.addEventListener('change', () => { if (DateUtil.isISO(picker.value)) { text.value = DateUtil.toVN(picker.value); text.dispatchEvent(new Event('change', { bubbles: true })); } });
    text.addEventListener('blur', () => { const v = DateUtil.parseVN(text.value); if (v) text.value = DateUtil.toVN(v); });
    return h('div', { class: 'date-input' }, text, btn, picker);
  },
  check(name, checked, label) { return h('label', { class: 'check' }, h('input', { type: 'checkbox', name, checked: !!checked }), label); },
  val(form, name) { const el = form.elements[name]; return el ? el.value : ''; },
  moneyVal(form, name, opts) { return Money.parse(this.val(form, name), opts); },
  dateVal(form, name) { return DateUtil.parseVN(this.val(form, name)); },
  clearErrors(form) {
    form.querySelectorAll('.field.has-error').forEach(f => { f.classList.remove('has-error'); const e = f.querySelector('.field-error'); if (e) e.textContent = ''; });
    form.querySelectorAll('[aria-invalid]').forEach(x => x.removeAttribute('aria-invalid'));
    const fe = form.querySelector('.form-error'); if (fe) fe.textContent = '';
  },
  showErrors(form, errors, fallbackMap = {}) {
    let first = null; const general = [];
    for (const [k, msg] of Object.entries(errors)) {
      const key = fallbackMap[k] || k;
      const f = form.querySelector(`.field[data-field="${CSS.escape(key)}"]`);
      if (f) {
        f.classList.add('has-error'); f.querySelector('.field-error').textContent = msg;

      } else general.push(msg);
    }
    const fe = form.querySelector('.form-error'); if (fe && general.length) fe.textContent = general.join('\n');
    if (first) first.focus({ preventScroll: false });
  },
  formError() { return h('div', { class: 'form-error', role: 'alert' }); }
};

const Charts = {

    if (min === max) { if (max === 0) return { min: 0, max: 1, ticks: [0, 1] }; if (max > 0) min = 0; else max = 0; }

  },
  width(container) { return Math.max(container.clientWidth || (container.parentElement && container.parentElement.clientWidth) || 600, 260); },
  empty(container, text) { container.replaceChildren(h('div', { class: 'chart-empty' }, Icon('chart', 26), h('p', { text: text || 'Chưa có dữ liệu cho kỳ này' }))); },

    catch (e) { console.error('Chart error', e); container.replaceChildren(h('div', { class: 'chart-empty chart-error' }, Icon('alert', 22), h('p', { text: 'Không thể vẽ biểu đồ này: ' + (e && e.message) }))); }

  fmtAxis(v) { return Money.compact(v); },
  /** Định dạng nhãn trục đủ chữ số thập phân để không trùng nhãn. */
  axisFormatter(ticks) {
    const maxAbs = Math.max(...ticks.map(Math.abs)); const step = ticks.length > 1 ? Math.abs(ticks[1] - ticks[0]) : maxAbs || 1;
    const [unit, suf] = maxAbs >= 1e9 ? [1e9, ' tỷ'] : maxAbs >= 1e6 ? [1e6, ' tr'] : maxAbs >= 1e3 ? [1e3, 'k'] : [1, ''];
    const dec = Math.min(3, Math.max(0, Math.ceil(-Math.log10(step / unit) - 1e-9)));

  },
  bars(container, { labels, series, height = 240, stacked = false, emptyText = null, tipLabels = null }) {
    const total = series.reduce((s, se) => s + se.values.reduce((a, v) => a + Math.abs(v || 0), 0), 0);

    const W = this.width(container), H = height, padL = 56, padR = 8, padT = 10, padB = 26;
    const iw = W - padL - padR, ih = H - padT - padB;
    let vmin = 0, vmax = 0;
    labels.forEach((_, i) => {
      if (stacked) { let p = 0, n = 0; for (const se of series) { const v = se.values[i] || 0; if (v >= 0) p += v; else n += v; } vmax = Math.max(vmax, p); vmin = Math.min(vmin, n); }
      else for (const se of series) { const v = se.values[i] || 0; vmax = Math.max(vmax, v); vmin = Math.min(vmin, v); }
    });
    const sc = this.niceScale(vmin, vmax, 4);
    const y = v => padT + ih - (v - sc.min) / (sc.max - sc.min) * ih;
    const svg = hs('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: 'chart-svg', role: 'img' });
    const fa = this.axisFormatter(sc.ticks);
    for (const t of sc.ticks) svg.append(hs('line', { x1: padL, x2: W - padR, y1: y(t), y2: y(t), class: 'grid-line' + (t === 0 ? ' zero' : '') }), hs('text', { x: padL - 7, y: y(t) + 4, 'text-anchor': 'end', class: 'axis-label money' }, fa(t)));
    const n = labels.length, band = iw / n, groupW = Math.min(band * 0.74, 64), barW = stacked ? groupW : groupW / series.length;
    const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw / 52))));
    labels.forEach((lab, i) => {

  line(container, { labels, series, height = 240, emptyText = null, minPoints = 2, tipLabels = null, area = true }) {

    const n = labels.length;

    const fa = this.axisFormatter(sc.ticks);
    for (const t of sc.ticks) svg.append(hs('line', { x1: padL, x2: W - padR, y1: y(t), y2: y(t), class: 'grid-line' + (t === 0 ? ' zero' : '') }), hs('text', { x: padL - 7, y: y(t) + 4, 'text-anchor': 'end', class: 'axis-label money' }, fa(t)));

Pages.filterTxns = function (st, f) {
  const L = lookups(st);
  const q = Util.norm(f.q);
  let list = Ledger.sortedTxns(st);
  list = list.filter(t => {
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (f.type && t.type !== f.type) return false;
    if (f.accountId && t.accountId !== f.accountId && t.toAccountId !== f.accountId) return false;
    if (f.categoryId && !(t.categoryId === f.categoryId || (f.categoryId === INTEREST_CAT_ID && t.type === 'debt_payment' && t.interest > 0))) return false;
    if (q) {
      const hay = Util.norm([t.payee, t.note, (t.tags || []).join(' '), (L.cat.get(t.categoryId) || {}).name, (L.acc.get(t.accountId) || {}).name, (L.acc.get(t.toAccountId) || {}).name, (L.debt.get(t.debtId) || {}).name, TXN_TYPES[t.type].label, String(t.amount), Money.num(t.amount)].join(' '));
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const s = f.sort || 'date_desc';
  list = list.slice();
  if (s === 'date_desc') list.reverse();
  else if (s === 'amount_desc') list.sort((a, b) => b.amount - a.amount || (a.date < b.date ? 1 : -1));
  else if (s === 'amount_asc') list.sort((a, b) => a.amount - b.amount || (a.date < b.date ? 1 : -1));
  return list;
};

Pages.exportBackup = async function (picker) {

    try {
      const handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'FinPilot backup', accept: { 'application/json': ['.json'] } }] });
      const w = await handle.createWritable(); await w.write(json); await w.close();

    } catch (e) { if (e && e.name === 'AbortError') return; Toast.show('Không ghi trực tiếp được, chuyển sang tải file thông thường.', { type: 'warn' }); }

  Util.download(json, name, 'application/json');
  App.setPref('lastBackupAt', Util.nowISO());

Pages.importFile = function (file) {

  const reader = new FileReader();
  reader.onerror = () => Modal.alert({ title: 'Không đọc được file', message: String(reader.error), tone: 'danger' });
  reader.onload = () => {
    const res = ImportExport.parse(String(reader.result));
    if (!res.ok) return Modal.alert({ title: 'File không hợp lệ — đã từ chối nhập', message: res.errors.slice(0, 12).join('\n') + (res.errors.length > 12 ? `\n… và ${res.errors.length - 12} lỗi khác` : '') + '\n\nDữ liệu hiện tại được giữ nguyên.', tone: 'danger' });
    Pages.importPreview(res, file.name);
  };
  reader.readAsText(file, 'utf-8');
};
