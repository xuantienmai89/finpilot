    if (mode === 'day') { for (let d = from; d <= to; d = DateUtil.addDays(d, 1)) ranges.push({ from: d, to: d, label: DateUtil.shortVN(d) }); }
    else if (mode === 'week') {
      let s = from;
      while (s <= to) { let e = DateUtil.addDays(DateUtil.startOfWeek(s), 6); if (e > to) e = to; ranges.push({ from: s, to: e, label: DateUtil.shortVN(s) }); s = DateUtil.addDays(e, 1); }
    } else if (mode === 'month') {
      for (const k of DateUtil.monthsInRange(from, to)) ranges.push({ from: k === DateUtil.monthKey(from) ? from : DateUtil.monthStart(k), to: k === DateUtil.monthKey(to) ? to : DateUtil.monthEnd(k), label: DateUtil.monthShort(k) });
    } else {
      for (let y = Number(from.slice(0, 4)); y <= Number(to.slice(0, 4)); y++) ranges.push({ from: y === Number(from.slice(0, 4)) ? from : `${y}-01-01`, to: y === Number(to.slice(0, 4)) ? to : `${y}-12-31`, label: String(y) });
    }
    return { mode, items: ranges.map(r => ({ ...r, ...this.totals(st, r.from, r.to) })) };
  },
  /** Báo cáo dòng tiền tài khoản + đối chiếu với biến động số dư thực tế. */
  cashflow(st, from, to) {
    const r = { income: 0, expenseCash: 0, expenseDebt: 0, interest: 0, principal: 0, debtPay: 0, borrowed: 0, adjIn: 0, adjOut: 0, transfers: 0, transferCount: 0, openingNew: 0 };
    for (const t of this.txnsInRange(st, from, to)) {
      switch (t.type) {
        case 'income': r.income += t.amount; break;
        case 'expense': if (t.debtId) r.expenseDebt += t.amount; else r.expenseCash += t.amount; break;
        case 'debt_payment': r.debtPay += t.amount; r.principal += t.principal; r.interest += t.interest; break;
        case 'borrow': r.borrowed += t.amount; break;
        case 'adjustment': if (t.direction === 'in') r.adjIn += t.amount; else r.adjOut += t.amount; break;
        case 'transfer': r.transfers += t.amount; r.transferCount++; break;
      }
    }
    for (const a of st.accounts) if (a.startDate >= from && a.startDate <= to) r.openingNew += a.openingBalance;
    r.inflow = r.income + r.borrowed + r.adjIn + r.openingNew;
    r.outflow = r.expenseCash + r.debtPay + r.adjOut;
    r.computedChange = r.inflow - r.outflow;
    const sumMap = m => { let s = 0; for (const v of m.values()) s += v; return s; };
    r.balanceStart = sumMap(this.accountBalances(st, DateUtil.addDays(from, -1)));
    r.balanceEnd = sumMap(this.accountBalances(st, to));
    r.actualChange = r.balanceEnd - r.balanceStart;
    r.matches = r.actualChange === r.computedChange;
    return r;
  }
};

/* --------------------------- Ngân sách --------------------------- */
const Budget = {
  id(month, categoryId) { return `bud_${month}_${categoryId}`; },
  status(pct) { if (pct === null) return 'ok'; if (pct > 100) return 'over'; if (pct >= 100) return 'full'; if (pct >= 80) return 'warn'; return 'ok'; },
  STATUS: { ok: { label: 'Trong hạn mức', tone: 'green' }, warn: { label: 'Đã dùng ≥ 80%', tone: 'amber' }, full: { label: 'Đã dùng hết', tone: 'amber' }, over: { label: 'Vượt hạn mức', tone: 'red' } },
  usage(st, month) {
    return memo(st, 'bud:' + month, () => {
      const spent = Ledger.byCategory(st, 'expense', DateUtil.monthStart(month), DateUtil.monthEnd(month));
      const cats = Util.byId(st.categories);
      const allB = st.budgets.find(b => b.month === month && b.categoryId === BUDGET_ALL) || null;
      const rows = st.budgets.filter(b => b.month === month && b.categoryId !== BUDGET_ALL).map(b => {
        const s = (spent.get(b.categoryId) || { amount: 0 }).amount;
        const pct = b.limit > 0 ? s / b.limit * 100 : null;
        return { budget: b, cat: cats.get(b.categoryId), limit: b.limit, spent: s, remaining: b.limit - s, pct, status: this.status(pct) };
      }).sort((a, b) => (b.pct || 0) - (a.pct || 0));
      const budgeted = new Set(rows.map(r => r.budget.categoryId));
      const unbudgeted = [];
      for (const [cid, v] of spent) if (!budgeted.has(cid)) unbudgeted.push({ cat: cats.get(cid), categoryId: cid, spent: v.amount, count: v.count });
      unbudgeted.sort((a, b) => b.spent - a.spent);
      const limit = Util.sum(rows, r => r.limit), used = Util.sum(rows, r => r.spent);
      // Ngân sách "Tất cả chi tiêu": đã chi = mọi khoản chi trong tháng, kể cả danh mục không có ngân sách riêng.
      let totalSpent = 0; for (const v of spent.values()) totalSpent += v.amount;
      const mk = (lim, s) => { const p = lim > 0 ? s / lim * 100 : null; return { limit: lim, spent: s, remaining: lim - s, pct: p, status: this.status(p) }; };
      const all = allB ? { budget: allB, ...mk(allB.limit, totalSpent) } : null;
      const catPart = rows.length ? mk(limit, used) : null;
      // Số "đầu bảng" dùng ở Tổng quan / Báo cáo: ưu tiên ngân sách tổng nếu có.
      const headline = all ? { ...mk(all.limit, totalSpent), scope: 'all' } : catPart ? { ...catPart, scope: 'categories' } : null;
      return { month, rows, unbudgeted, all, headline, totalSpent, limit, spent: used, remaining: limit - used, pct: limit > 0 ? used / limit * 100 : null, overCount: rows.filter(r => r.status === 'over').length, allOver: !!(all && all.status === 'over') };
    });
  }
};

/* --------------------------- Giao dịch định kỳ --------------------------- */
const Recurring = {
  occurrences(rule, until, limit = 4000) {
    const out = [];
    if (!DateUtil.isISO(rule.startDate) || !FREQUENCIES[rule.frequency]) return out;
    const iv = rule.interval || 1; const anchor = Number(rule.startDate.slice(8, 10));
    for (let i = 0; i < limit; i++) {
      let d;
      switch (rule.frequency) {
        case 'daily': d = DateUtil.addDays(rule.startDate, i * iv); break;
        case 'weekly': d = DateUtil.addDays(rule.startDate, 7 * i * iv); break;
        case 'monthly': d = DateUtil.addMonths(rule.startDate, i * iv, anchor); break;
        case 'yearly': d = DateUtil.addMonths(rule.startDate, 12 * i * iv, anchor); break;
      }
      if (d > until || (rule.endDate && d > rule.endDate)) break;
      out.push(d);
    }
    return out;
  },
  txnId(ruleId, date) { return `txn_rec_${ruleId}_${date}`; },
  created(st) {
    return memo(st, 'recCreated', () => {
      const m = new Map();
      for (const t of st.transactions) if (t.recurringId) { if (!m.has(t.recurringId)) m.set(t.recurringId, new Set()); m.get(t.recurringId).add(t.recurringDate); }
      return m;
    });
  },
  handled(st, rule) { const s = new Set(this.created(st).get(rule.id) || []); for (const d of rule.skipped || []) s.add(d); return s; },
  due(st, today = DateUtil.today()) {
    return memo(st, 'due:' + today, () => {
      const out = [];
      for (const r of st.recurring) {
        if (!r.active) continue;
        const handled = this.handled(st, r);
        for (const d of this.occurrences(r, today)) if (!handled.has(d)) out.push({ rule: r, date: d });
      }
      return out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    });
  },
  next(st, rule, today = DateUtil.today()) {
    const horizon = DateUtil.addDays(today, 800);
    const handled = this.handled(st, rule);
    for (const d of this.occurrences(rule, horizon)) if (d >= today && !handled.has(d)) return d;
    return null;
  },
  amount(t) { return t.type === 'debt_payment' ? (t.principal || 0) + (t.interest || 0) : t.amount; },
  buildTxn(rule, date) {
    const t = rule.template; const now = Util.nowISO();
    return Model.transaction({
      id: this.txnId(rule.id, date), type: t.type, date, amount: this.amount(t),
      accountId: t.accountId, toAccountId: t.toAccountId, categoryId: t.categoryId, debtId: t.debtId,
      principal: t.principal, interest: t.interest, goalId: t.goalId,
      payee: t.payee, note: t.note || rule.name, tags: t.tags, reconciled: false,
      recurringId: rule.id, recurringDate: date, createdAt: now, updatedAt: now
    });
  },
  describe(rule) { const iv = rule.interval || 1; return `Mỗi ${iv > 1 ? iv + ' ' : ''}${FREQUENCIES[rule.frequency] || ''}`; }
};

/* --------------------------- Mục tiêu --------------------------- */
const Goals = {
  progress(st, g, today = DateUtil.today()) {
    let saved = 0;
    if (g.mode === 'account') saved = Math.max(0, Ledger.current(st).balances.get(g.accountId) || 0);
    else if (g.mode === 'transfer') { for (const t of st.transactions) if (t.type === 'transfer' && t.goalId === g.id && t.date <= today) saved += t.goalDir === 'out' ? -t.amount : t.amount; saved = Math.max(0, saved); }
    else for (const c of g.contributions) saved += c.direction === 'out' ? -c.amount : c.amount;
    const target = g.target;
    const pct = target > 0 ? Math.min(saved / target * 100, 999) : 0;
    const remaining = Math.max(0, target - saved);
    let monthsLeft = null, requiredMonthly = null, overdue = false;
    if (g.deadline) {
      if (g.deadline < today) overdue = remaining > 0;
      else { monthsLeft = Math.max(1, DateUtil.monthsUntil(today, g.deadline)); requiredMonthly = Math.ceil(remaining / monthsLeft); }
    }
    return { saved, target, pct, remaining, monthsLeft, requiredMonthly, overdue, reached: saved >= target };
  }
};

/* --------------------------- Bản chụp tài sản ròng --------------------------- */
const Snapshots = {
  compute(st, source = 'auto') {
    const c = Ledger.current(st);
    return { id: 'snap_' + c.asOf, date: c.asOf, cash: c.cash, otherAssets: c.otherAssets, totalAssets: c.totalAssets, liabilities: c.liabilities, netWorth: c.netWorth, source, updatedAt: '' };
  },
  /** Cập nhật bản chụp của ngày hôm nay nếu số liệu thay đổi. Trả về true nếu có thay đổi. */
  upsertToday(st, source = 'auto') {
    if (!st.accounts.length && !st.assets.length && !st.debts.length) return false;
    const snap = this.compute(st, source);
    const i = st.snapshots.findIndex(s => s.date === snap.date);
    if (i >= 0) {
      const o = st.snapshots[i];
      if (o.cash === snap.cash && o.otherAssets === snap.otherAssets && o.liabilities === snap.liabilities && (source === 'auto' || o.source === 'manual')) return false;
      st.snapshots[i] = { ...o, ...snap, id: o.id, source: o.source === 'manual' ? 'manual' : source };
    } else st.snapshots.push(snap);
    st.snapshots.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    return true;
  }
};

/* --------------------------- Góc nhìn tài chính (dựa trên quy tắc) --------------------------- */
const Insights = {
  /** Chi tiêu bình quân tháng của tối đa 3 tháng trọn vẹn gần nhất có dữ liệu. */
  avgMonthlyExpense(st) {
    const today = DateUtil.today(); const b = Ledger.bounds(st);
    if (!b.min) return null;
    const firstMonth = DateUtil.monthKey(b.min);
    const months = [];
    for (let i = 1; i <= 3; i++) { const k = DateUtil.addMonthKey(DateUtil.monthKey(today), -i); if (k >= firstMonth) months.push(k); }
    if (!months.length) return null;
    const total = Util.sum(months, k => Ledger.totals(st, DateUtil.monthStart(k), DateUtil.monthEnd(k)).expense);
    if (total <= 0) return null;
    return { avg: Math.round(total / months.length), months: months.slice().reverse() };
  },
  runway(st) {
    const a = this.avgMonthlyExpense(st); if (!a) return null;
    const liquid = Ledger.current(st).liquid;
    return { months: liquid / a.avg, liquid, avg: a.avg, basis: a.months };
  },
  debtPace(st) {
    const today = DateUtil.today(); const months = [1, 2, 3].map(i => DateUtil.addMonthKey(DateUtil.monthKey(today), -i));
    const from = DateUtil.monthStart(months[2]), to = DateUtil.monthEnd(months[0]);
    let principal = 0; for (const t of Ledger.txnsInRange(st, from, to)) if (t.type === 'debt_payment') principal += t.principal;
    return { avg: Math.round(principal / 3), from, to };
  },
  generate(st, period, prefs) {
    const out = []; const p = period;
    const basis = `Kỳ ${p.range}`;
    const tot = Ledger.totals(st, p.from, p.to);
    const cats = Util.byId(st.categories);
    const cname = id => (cats.get(id) || { name: 'Không rõ' }).name;
    const exp = Ledger.byCategory(st, 'expense', p.from, p.to);
    if (tot.expense > 0) {
      let top = null; for (const [k, v] of exp) if (!top || v.amount > top[1].amount) top = [k, v];
      out.push({ level: 'info', icon: 'pie', title: `Chi nhiều nhất: ${cname(top[0])}`, text: `${Money.format(top[1].amount)} — chiếm ${Util.fmtPct(top[1].amount / tot.expense * 100)} tổng chi tiêu (${top[1].count} khoản).`, basis });
    }
    const prev = Period.previous(p);
    if (prev && tot.expense > 0) {
      const pt = Ledger.totals(st, prev.from, prev.to);
      if (pt.expense > 0) {
        const pexp = Ledger.byCategory(st, 'expense', prev.from, prev.to);
        let best = null;
        for (const [k, v] of exp) { const before = (pexp.get(k) || { amount: 0 }).amount; const diff = v.amount - before; if (diff > 0 && (!best || diff > best.diff)) best = { k, diff, before, now: v.amount }; }
        const cmp = `So sánh ${p.range} với ${Period.rangeText(prev.from, prev.to)}`;
        if (best) out.push({ level: 'warn', icon: 'trendUp', title: `Tăng mạnh nhất: ${cname(best.k)}`, text: best.before > 0 ? `Tăng ${Money.format(best.diff)} (+${Util.fmtPct(best.diff / best.before * 100)}) so với kỳ trước.` : `Phát sinh mới ${Money.format(best.diff)} (kỳ trước không có).`, basis: cmp });
        const change = (tot.expense - pt.expense) / pt.expense * 100;
        out.push({ level: change > 0 ? 'warn' : 'good', icon: change > 0 ? 'trendUp' : 'trendDown', title: `Tổng chi ${change > 0 ? 'tăng' : 'giảm'} ${Util.fmtPct(Math.abs(change))}`, text: `${Money.format(tot.expense)} so với ${Money.format(pt.expense)} kỳ trước.`, basis: cmp });
      }
    }
    if (tot.income > 0) {
      const target = st.settings.savingsRateTarget;
      const r = tot.savingsRate;
      out.push({ level: r >= target ? 'good' : r >= 0 ? 'warn' : 'bad', icon: 'coins', title: `Tỷ lệ tiết kiệm ${Util.fmtPct(r)}`, text: r >= target ? `Đạt mục tiêu ${target}% (dòng tiền ròng ${Money.format(tot.net)}).` : `Thấp hơn mục tiêu ${target}% — cần thêm ${Money.format(Math.max(0, Math.ceil(tot.income * target / 100) - tot.net))} để đạt.`, basis: basis + ' · Tỷ lệ = (Thu − Chi) / Thu' });
    }
    const today = DateUtil.today();
    const bm = DateUtil.monthKey(p.to < today ? p.to : (p.from > today ? p.from : today));
    const bu = Budget.usage(st, bm);
    if (bu.all && (bu.all.status === 'over' || bu.all.status === 'full' || bu.all.status === 'warn')) out.push({ level: bu.all.status === 'over' ? 'bad' : 'warn', icon: 'alert', title: bu.all.status === 'over' ? `Tổng chi tiêu vượt hạn mức tháng (${Util.fmtPct(bu.all.pct, 0)})` : `Tổng chi tiêu đã dùng ${Util.fmtPct(bu.all.pct, 0)} hạn mức tháng`, text: `${Money.format(bu.all.spent)} / ${Money.format(bu.all.limit)} cho tất cả chi tiêu.`, basis: DateUtil.monthLabel(bm) });
    const over = bu.rows.filter(r => r.status === 'over');
    if (over.length) out.push({ level: 'bad', icon: 'alert', title: `${over.length} ngân sách vượt hạn mức`, text: over.slice(0, 3).map(r => `${r.cat ? r.cat.name : '?'} (${Util.fmtPct(r.pct, 0)})`).join(', ') + (over.length > 3 ? '…' : ''), basis: DateUtil.monthLabel(bm) });
    else if (bu.rows.length) { const warn = bu.rows.filter(r => r.status === 'warn' || r.status === 'full'); if (warn.length) out.push({ level: 'warn', icon: 'pie', title: `${warn.length} ngân sách sắp chạm hạn mức`, text: warn.slice(0, 3).map(r => `${r.cat ? r.cat.name : '?'} (${Util.fmtPct(r.pct, 0)})`).join(', '), basis: DateUtil.monthLabel(bm) }); }
    const cur = Ledger.current(st);
    if (cur.liabilities > 0) {
      const dp = this.debtPace(st);
      if (dp.avg > 0) out.push({ level: 'info', icon: 'trendDown', title: `Giảm nợ ~${Money.format(dp.avg)}/tháng`, text: `Với tốc độ trả gốc này, dư nợ ${Money.format(cur.liabilities)} cần khoảng ${Math.ceil(cur.liabilities / dp.avg)} tháng để tất toán.`, basis: `Trả gốc bình quân ${Period.rangeText(dp.from, dp.to)}` });
      else out.push({ level: 'warn', icon: 'alert', title: 'Chưa ghi nhận trả gốc gần đây', text: `Dư nợ hiện tại ${Money.format(cur.liabilities)}; 3 tháng gần nhất chưa có khoản trả gốc nào.`, basis: `${Period.rangeText(dp.from, dp.to)}` });
    }
    const rw = this.runway(st);
    if (rw) {
      const target = st.settings.emergencyTargetMonths;
      out.push({ level: rw.months >= target ? 'good' : rw.months >= 3 ? 'warn' : 'bad', icon: 'shield', title: `Quỹ thanh khoản đủ ~${rw.months.toLocaleString('vi-VN', { maximumFractionDigits: 1 })} tháng`, text: `Tiền mặt + ngân hàng + ví + tiết kiệm ${Money.format(rw.liquid)} so với chi bình quân ${Money.format(rw.avg)}/tháng (mục tiêu ${target} tháng).`, basis: `Chi bình quân ${rw.basis.map(DateUtil.monthShort).join(', ')}` });
    }
    const due = Recurring.due(st).length;
    if (due) out.push({ level: 'warn', icon: 'repeat', title: `${due} giao dịch định kỳ chờ xác nhận`, text: 'Mở mục Giao dịch định kỳ để tạo hoặc bỏ qua.', basis: 'Tính đến hôm nay' });
    if (prefs && st.transactions.length >= 5) {
      const lb = prefs.lastBackupAt; const days = lb ? Math.floor((Date.now() - new Date(lb).getTime()) / 86400000) : null;
      if (days === null || days >= 7) out.push({ level: 'warn', icon: 'download', title: days === null ? 'Chưa từng sao lưu ra file' : `Đã ${days} ngày chưa sao lưu ra file`, text: 'Hãy xuất file JSON để phòng mất dữ liệu trình duyệt.', basis: 'Thiết bị này' });
    }
    return out;
  }
};

/* --------------------------- Theo dõi thay đổi (dấu thời gian + bản ghi xóa) cho đồng bộ --------------------------- */
const _keyCache = new WeakMap();
const Changes = {
  key(rec) {
    if (_keyCache.has(rec)) return _keyCache.get(rec);
    const { updatedAt, ...rest } = rec; void updatedAt;
    const k = JSON.stringify(rest); _keyCache.set(rec, k); return k;
  },
  /** Đóng dấu updatedAt cho bản ghi mới/sửa; tạo tombstone cho bản ghi bị xóa. */
  stamp(before, draft, now = Util.nowISO()) {
    const tomb = new Map((draft.tombstones || []).map(t => [t.c + '|' + t.id, t]));
    let changed = 0;
    for (const c of COLLECTIONS) {
      const prev = new Map(before[c].map(r => [r.id, r]));
      const ids = new Set();
      for (const r of draft[c]) {
        ids.add(r.id);
        const p = prev.get(r.id);
        if (!p || this.key(p) !== this.key(r)) { r.updatedAt = now; changed++; }
        else r.updatedAt = p.updatedAt;
        const tk = c + '|' + r.id;
        if (tomb.has(tk) && tomb.get(tk).at < r.updatedAt) tomb.delete(tk);
      }
      for (const id of prev.keys()) if (!ids.has(id)) { if (c !== 'commitLog') tomb.set(c + '|' + id, { c, id, at: now }); changed++; }
    }
    const sKey = s => { const { updatedAt, ...rest } = s; void updatedAt; return JSON.stringify(rest); };
    if (sKey(before.settings) !== sKey(draft.settings)) draft.settings.updatedAt = now;
    const cutoff = new Date(Date.now() - TOMBSTONE_TTL_DAYS * 86400000).toISOString();
    draft.tombstones = Array.from(tomb.values()).filter(t => t.at >= cutoff);
    return changed;
  }
};

/* --------------------------- Hợp nhất 2 bộ dữ liệu (đồng bộ / nhập file) --------------------------- */
const MergeService = {
  /** Hợp nhất theo từng bản ghi: bản sửa sau cùng (updatedAt) thắng; xóa (tombstone) thắng nếu mới hơn. */
  merge(local, remote) {
    const tomb = new Map();
    const addT = t => { const k = t.c + '|' + t.id; if (!tomb.has(k) || tomb.get(k).at < t.at) tomb.set(k, { ...t }); };
    (local.tombstones || []).forEach(addT); (remote.tombstones || []).forEach(addT);
    const out = { tombstones: [] }; let localChanged = false, remoteChanged = false;
    const stats = { added: 0, updated: 0, deleted: 0 };
    const ts = r => (r && r.updatedAt) || '';
    const ls0 = local.settings || {}, rs0 = remote.settings || {};
    const epoch = Math.max(ls0.disciplineEpoch || 0, rs0.disciplineEpoch || 0);
    for (const c of COLLECTIONS) {
      if (c === 'commitLog') {
        const res = CommitLog.merge(local[c], remote[c], epoch);
        const ids = arr => new Set((arr || []).filter(e => (e.epoch || 0) >= epoch).map(e => e.id));
        const lIds = ids(local[c]), rIds = ids(remote[c]);
        if (res.length !== lIds.size || res.length !== (local[c] || []).length) { localChanged = true; stats.added += Math.max(0, res.length - lIds.size); }
        if (res.length !== rIds.size || res.length !== (remote[c] || []).length) remoteChanged = true;
        out[c] = res; continue;
      }
      const lm = new Map((local[c] || []).map(r => [r.id, r])), rm = new Map((remote[c] || []).map(r => [r.id, r]));
      const ids = new Set([...lm.keys(), ...rm.keys()]);
      const res = [];
      for (const id of ids) {
        const l = lm.get(id), r = rm.get(id);
        let cand = !l ? r : !r ? l : (ts(r) > ts(l) ? r : l);
        const t = tomb.get(c + '|' + id);
        if (t && t.at >= ts(cand)) cand = null;
        if (cand && c === 'recurring' && l && r) {
          const sk = Array.from(new Set([...(l.skipped || []), ...(r.skipped || [])])).sort();
          if (sk.length !== (cand.skipped || []).length) cand = { ...cand, skipped: sk };
          if (sk.length !== (l.skipped || []).length) localChanged = true;
          if (sk.length !== (r.skipped || []).length) remoteChanged = true;
        }
        if (cand) res.push(cand);
        const same = (a, b) => (!a && !b) || (a && b && ts(a) === ts(b));
        if (!same(cand, l)) { localChanged = true; if (!l) stats.added++; else if (!cand) stats.deleted++; else stats.updated++; }
        if (!same(cand, r)) remoteChanged = true;
      }
      out[c] = res;
    }
    const cutoff = new Date(Date.now() - TOMBSTONE_TTL_DAYS * 86400000).toISOString();
    out.tombstones = Array.from(tomb.values()).filter(t => t.at >= cutoff);
    const tk = arr => new Set((arr || []).map(t => t.c + '|' + t.id + '|' + t.at));
    const ot = tk(out.tombstones), ltk = tk(local.tombstones), rtk = tk(remote.tombstones);
    const eqSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
    if (!eqSet(ot, ltk)) localChanged = true;
    if (!eqSet(ot, rtk)) remoteChanged = true;
    const ls = local.settings || {}, rs = remote.settings || {};
    if ((rs.updatedAt || '') > (ls.updatedAt || '')) { out.settings = rs; localChanged = true; }
    else { out.settings = ls; if ((ls.updatedAt || '') !== (rs.updatedAt || '')) remoteChanged = true; }
    if ((out.settings.disciplineEpoch || 0) !== epoch) { out.settings = { ...out.settings, disciplineEpoch: epoch }; if ((ls.disciplineEpoch || 0) !== epoch) localChanged = true; if ((rs.disciplineEpoch || 0) !== epoch) remoteChanged = true; }
    return { data: out, localChanged, remoteChanged, stats };
  }
};

/* --------------------------- Sao lưu / khôi phục / CSV --------------------------- */
const ImportExport = {
  buildBackup(st) {
    const data = { settings: st.settings, tombstones: st.tombstones || [] };
    const counts = {};
    for (const c of COLLECTIONS) { data[c] = st[c]; counts[c] = st[c].length; }
    return { app: APP_NAME, format: 'finpilot-backup', appVersion: APP_VERSION, schemaVersion: SCHEMA_VERSION, exportedAt: Util.nowISO(), timezone: TZ, counts, data: Util.clone(data) };
  },
  filename() { return `FinPilot_Backup_${DateUtil.today()}.json`; },
  /** Kiểm tra file sao lưu. Không ghi gì vào dữ liệu hiện tại. */
  parse(text) {
    const fail = (...msgs) => ({ ok: false, errors: msgs, warnings: [] });
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return fail('File không phải JSON hợp lệ (' + e.message + ').'); }
    if (!Util.isObj(obj)) return fail('Cấu trúc file không hợp lệ.');
    if (obj.format !== 'finpilot-backup' && obj.format !== 'finpilot-sync' && obj.app !== APP_NAME) return fail('Đây không phải file sao lưu của FinPilot Offline.');
    const v = obj.schemaVersion;
    if (!Number.isInteger(v)) return fail('Thiếu phiên bản cấu trúc dữ liệu (schemaVersion).');
    if (v > SCHEMA_VERSION) return fail(`File dùng cấu trúc dữ liệu phiên bản ${v}, mới hơn phiên bản ứng dụng hỗ trợ (${SCHEMA_VERSION}). Hãy dùng FinPilot mới hơn để mở.`);
    if (v < 1) return fail('Phiên bản cấu trúc dữ liệu không hợp lệ.');
    const d = obj.data;
    if (!Util.isObj(d)) return fail('Thiếu phần dữ liệu (data).');
    const errors = [], warnings = [];
    for (const c of COLLECTIONS) {
      if (d[c] === undefined && v < (COLL_SINCE[c] || 1)) { d[c] = []; continue; }
      if (!Array.isArray(d[c])) errors.push(`Thiếu hoặc sai kiểu danh sách "${COLL_LABELS[c]}".`);
      else if (d[c].some(x => !Util.isObj(x))) errors.push(`Danh sách "${COLL_LABELS[c]}" có phần tử không hợp lệ.`);
    }
    if (errors.length) return { ok: false, errors, warnings };
    if (!Util.isObj(d.settings)) warnings.push('File không có phần cài đặt — sẽ dùng cài đặt mặc định.');
    if (Util.isObj(obj.counts)) for (const c of COLLECTIONS) if (c !== 'commitLog' && Number.isInteger(obj.counts[c]) && obj.counts[c] !== d[c].length) errors.push(`Số lượng ${COLL_LABELS[c]} (${d[c].length}) không khớp thông tin trong file (${obj.counts[c]}) — file có thể bị cắt hoặc chỉnh sửa.`);
    const ds = Model.dataset(d);
    const integ = Validation.integrity(ds);
    errors.push(...integ.errors); warnings.push(...integ.warnings);
    const counts = {}; for (const c of COLLECTIONS) counts[c] = ds[c].length;
    return { ok: errors.length === 0, errors, warnings, dataset: ds, counts, exportedAt: obj.exportedAt, appVersion: obj.appVersion };
  },
  csv(st, txns, sep = ',') {
    const acc = Util.byId(st.accounts), cat = Util.byId(st.categories), debt = Util.byId(st.debts);
    const esc = v => {
      let s = String(v === null || v === undefined ? '' : v);
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return (s.includes(sep) || /["\r\n]/.test(s)) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const header = ['Ngày', 'Loại', 'Số tiền (VND)', 'Ảnh hưởng thu/chi (VND)', 'Tài khoản / Nguồn', 'Tài khoản nhận', 'Danh mục', 'Khoản nợ', 'Tiền gốc', 'Tiền lãi', 'Người nhận / Nguồn thu', 'Thẻ', 'Ghi chú', 'Đã đối soát', 'Mã giao dịch'];
    const lines = [header.map(esc).join(sep)];
    for (const t of txns) {
      const pnl = t.type === 'income' ? t.amount : t.type === 'expense' ? -t.amount : t.type === 'debt_payment' ? -t.interest : 0;
      lines.push([
        DateUtil.toVN(t.date), TXN_TYPES[t.type].label, t.amount, pnl,
        t.accountId ? (acc.get(t.accountId) || {}).name : (t.debtId && t.type === 'expense' ? 'Nợ: ' + (debt.get(t.debtId) || {}).name : ''),
        t.toAccountId ? (acc.get(t.toAccountId) || {}).name : '',
        t.type === 'debt_payment' ? (t.interest > 0 ? (cat.get(INTEREST_CAT_ID) || {}).name : '') : (cat.get(t.categoryId) || {}).name || '',
        t.debtId ? (debt.get(t.debtId) || {}).name : '',
        t.type === 'debt_payment' ? t.principal : '', t.type === 'debt_payment' ? t.interest : '',
        t.payee, (t.tags || []).join(' | '), t.note, t.reconciled ? 'Có' : '', t.id
      ].map(esc).join(sep));
    }
    return '﻿' + lines.join('\r\n');
  }
};

/* ==========================================================================
   ENGINE — lõi thuần của tính năng Kỷ luật & Danh mục
   Quy ước bắt buộc (build.py kiểm tra): không DOM, không mạng, không lưu trữ,
   không tự đọc đồng hồ. Mọi thời điểm được truyền vào qua tham số (ms hoặc ISO).
   Tiền luôn là số nguyên VND; tỷ lệ dùng basis point (1% = 100 bp).
   ========================================================================== */
const DISC = Object.freeze({
  COOLDOWN_MS: 72 * 3600000,     // chờ 72 giờ khi nới lỏng cam kết
  GRACE_MS: 24 * 3600000,        // 24 giờ đầu sửa giao dịch vào quỹ tự do
  TRIAL_MS: 7 * 86400000,        // 7 ngày chạy thử
  REQUEST_TTL_MS: 7 * 86400000,  // yêu cầu hết hạn nếu không xác nhận trong 7 ngày sau khi chín
  NOTE_TTL_MS: 365 * 86400000,   // ghi chú lý do tự xóa sau 12 tháng
  SKEW_MAX_MS: 10 * 60000,       // lệch giờ tối đa so với máy chủ Google
  BP_FULL: 10000
});

const _ms = v => (typeof v === 'number' ? v : (typeof v === 'string' && v ? Date.parse(v) : NaN));
const _byAtId = (a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : a.id < b.id ? -1 : a.id > b.id ? 1 : 0);

/* --------------------------- Thác nước phân bổ --------------------------- */
const Alloc = {
  /** Phần của một bậc tính trên toàn bộ khoản thu (chưa áp trần). An toàn số học tới 100 nghìn tỷ. */
  share(amount, step) {
    if (Number.isSafeInteger(step.fixed) && step.fixed > 0) return step.fixed;
    if (Number.isInteger(step.bp) && step.bp > 0) {
      const q = Math.floor(amount / DISC.BP_FULL), r = amount % DISC.BP_FULL;
      return q * step.bp + Math.floor(r * step.bp / DISC.BP_FULL);
    }
    return 0;
  },
  /**
   * Chia khoản thu theo thứ tự bậc. Bậc chạm trần (mục tiêu sắp đầy) thì phần dư tràn xuống bậc kế.
   * caps: { [stepKey]: số tiền còn được nhận | null (không trần) }.
   * Bất biến: Σ lines.amount + spend === amount (đúng từng đồng).
   */
  plan(amount, steps, caps = {}) {
    if (!Number.isSafeInteger(amount) || amount <= 0) return { lines: [], spend: Math.max(0, amount | 0), overflow: 0 };
    let left = amount, carry = 0; const lines = [];
    for (const s of steps || []) {
      const want = this.share(amount, s) + carry;
      let take = Math.min(want, left);
      const cap = caps ? caps[s.key] : null;
      if (Number.isSafeInteger(cap)) take = Math.min(take, Math.max(0, cap));
      carry = left > take ? want - take : 0;
      if (take > 0) lines.push({ key: s.key, amount: take });
      left -= take;
    }
    return { lines, spend: left, overflow: carry };
  },
  /** Kiểm tra danh sách bậc. Trả về thông báo lỗi đầu tiên hoặc null. */
  validateSteps(steps) {
    if (!Array.isArray(steps)) return 'Danh sách bậc không hợp lệ.';
    const keys = new Set(); let bp = 0;
    for (const s of steps) {
      if (!s || typeof s.key !== 'string' || !s.key) return 'Bậc thiếu mã.';
      if (keys.has(s.key)) return 'Trùng mã bậc.';
      keys.add(s.key);
      const hasFixed = Number.isSafeInteger(s.fixed) && s.fixed > 0, hasBp = Number.isInteger(s.bp) && s.bp > 0;
      if (hasFixed === hasBp) return 'Mỗi bậc cần đúng một trong hai: tỷ lệ % hoặc số tiền cố định.';
      if (hasBp) { if (s.bp > DISC.BP_FULL) return 'Tỷ lệ một bậc không vượt quá 100%.'; bp += s.bp; }
      if (!s.toAccountId) return 'Mỗi bậc cần tài khoản nhận.';
    }
    if (bp > DISC.BP_FULL) return 'Tổng tỷ lệ các bậc vượt quá 100%.';
    return null;
  }
};

/* --------------------------- So sánh quy tắc: siết hay nới --------------------------- */
const RuleDiff = {
  _cmpShare(o, n) {
    const of = Number.isSafeInteger(o.fixed) && o.fixed > 0, nf = Number.isSafeInteger(n.fixed) && n.fixed > 0;
    if (of !== nf) return 'đổi cách tính một bậc (% ↔ số cố định)';
    if (of) return n.fixed < o.fixed ? 'giảm số tiền một bậc' : null;
    return (n.bp || 0) < (o.bp || 0) ? 'giảm tỷ lệ một bậc' : null;
  },
  /** Trả về danh sách lý do "nới lỏng". Rỗng = chỉ siết chặt hoặc giữ nguyên (áp dụng ngay). */
  loosening(oldCfg, newCfg) {
    const out = [];
    if (!oldCfg) return out;
    if (oldCfg.enabled && !newCfg.enabled) out.push('tắt chế độ kỷ luật');
    const nRules = new Map((newCfg.rules || []).map(r => [r.id, r]));
    for (const o of oldCfg.rules || []) {
      const n = nRules.get(o.id);
      if (!n) { if ((o.steps || []).length) out.push(`xóa quy tắc "${o.name}"`); continue; }
      const nc = new Set(n.categoryIds || []);
      if ((o.categoryIds || []).some(c => !nc.has(c))) out.push(`bớt danh mục kích hoạt của "${o.name}"`);
      const nSteps = new Map((n.steps || []).map((s, i) => [s.key, { s, i }]));
      let lastIdx = -1;
      for (const os of o.steps || []) {
        const hit = nSteps.get(os.key);
        if (!hit) { out.push(`bỏ một bậc của "${o.name}"`); continue; }
        if ((hit.s.goalId || '') !== (os.goalId || '') || hit.s.toAccountId !== os.toAccountId) out.push(`đổi đích một bậc của "${o.name}"`);
        const c = this._cmpShare(os, hit.s); if (c) out.push(`${c} của "${o.name}"`);
        if (hit.i < lastIdx) out.push(`hạ thứ tự ưu tiên trong "${o.name}"`);
        lastIdx = Math.max(lastIdx, hit.i);
      }
    }
    // Mô phỏng: thêm/chèn bậc không được làm phần của bậc cũ (cùng đích) giảm ở bất kỳ mức thu nhập mẫu nào.
    for (const o of oldCfg.rules || []) {
      const n = nRules.get(o.id); if (!n || !(o.steps || []).length) continue;
      const same = new Map((n.steps || []).map(s => [s.key, s]));
      const keys = (o.steps || []).filter(s => { const x = same.get(s.key); return x && (x.goalId || '') === (s.goalId || '') && x.toAccountId === s.toAccountId; }).map(s => s.key);
      for (const amt of [5e6, 2e7, 5e7, 1e8, 3e8]) {
        const a = Alloc.plan(amt, o.steps, {}), b = Alloc.plan(amt, n.steps, {});
        const get = (p, k) => (p.lines.find(l => l.key === k) || { amount: 0 }).amount;
        if (keys.some(k => get(b, k) < get(a, k))) { out.push(`bậc mới làm giảm phần của bậc cũ trong "${o.name}"`); break; }
      }
    }
    return Array.from(new Set(out));
  }
};

/* --------------------------- Nhật ký cam kết (chỉ ghi thêm, hợp tập) --------------------------- */
const CommitLog = {
  sort(arr) { return arr.slice().sort(_byAtId); },
  /** Hợp nhất hai nhật ký: hợp tập theo id, bỏ sự kiện thuộc epoch cũ (sau "xóa toàn bộ mọi thiết bị"). */
  merge(a, b, epoch = 0) {
    const m = new Map();
    for (const e of a || []) if (e && e.id) m.set(e.id, e);
    for (const e of b || []) if (e && e.id && !m.has(e.id)) m.set(e.id, e);
    return this.sort(Array.from(m.values()).filter(e => (e.epoch || 0) >= epoch));
  },
  /**
   * Gấp nhật ký thành trạng thái hiệu lực. Giao hoán & lũy đẳng: cùng tập sự kiện → cùng kết quả,
   * bất kể thứ tự đồng bộ. Hủy luôn thắng xác nhận của cùng một yêu cầu.
   * opts: { epoch, nowMs, skewMs, facts: Set(id giao dịch đang tồn tại) }
   */
  fold(events, { epoch = 0, nowMs = 0, skewMs = null, facts = null } = {}) {
    const evs = this.sort((events || []).filter(e => e && (e.epoch || 0) >= epoch));
    const cancelled = new Set(); const confirms = new Map();
    for (const e of evs) {
      if (e.kind === 'cancel') cancelled.add(e.refId);
      else if (e.kind === 'confirm' && !confirms.has(e.refId)) confirms.set(e.refId, e);
    }
    const st = { config: null, version: '', armedAt: null, requests: [], released: new Set(), counts: {}, overrides: [], events: evs };
    const reqs = new Map();
    const bump = k => { st.counts[k] = (st.counts[k] || 0) + 1; };
    const applyPayload = (p, ev) => {
      if (!p) return;
      if (p.type === 'config' && p.config) { st.config = p.config; st.version = ev.id; }
      else if (p.type === 'exit' && st.config) { st.config = { ...st.config, enabled: false }; st.version = ev.id; }
      else if (p.type === 'release' && p.alc && p.key) st.released.add(p.alc + '|' + p.key);
    };
    for (const e of evs) {
      switch (e.kind) {
        case 'set': {
          if (!(e.payload && e.payload.config)) break;
          const base = e.payload.baseVersion;
          // Hai thiết bị cùng "siết" trên nền cũ: bản đến sau không được âm thầm nới bản kia.
          if (base !== undefined && base !== st.version && st.config && RuleDiff.loosening(st.config, e.payload.config).length) { bump('set:conflict'); st.conflicts = (st.conflicts || 0) + 1; break; }
          st.config = e.payload.config; st.version = e.id; bump('set:' + (e.cls || '')); break;
        }
        case 'arm': if (!st.armedAt) st.armedAt = e.at; bump('arm'); break;
        case 'release': if (e.payload) st.released.add(e.payload.alc + '|' + e.payload.key); bump('release:' + (e.cls || '')); st.overrides.push(e); break;
        case 'request': { const r = { ev: e, status: 'pending', confirm: null }; reqs.set(e.id, r); st.requests.push(r); bump('request'); break; }
        case 'confirm': {
          const r = reqs.get(e.refId); if (!r || r.status !== 'pending') break;
          if (cancelled.has(r.ev.id)) break;
          const eff = _ms(r.ev.effectiveAt), at = _ms(e.at);
          if (!(at >= eff) || at > eff + DISC.REQUEST_TTL_MS) break;
          const p = r.ev.payload || {};
          if (p.type === 'config' && p.baseVersion !== undefined && p.baseVersion !== st.version) { r.status = 'stale'; r.confirm = e; break; }
          r.status = 'confirmed'; r.confirm = e; applyPayload(p, e); bump('confirm'); break;
        }
        case 'override': bump('override:' + (e.cls || '')); st.overrides.push(e); break;
        default: if (e.kind) bump(e.kind);
      }
    }
    for (const r of st.requests) {
      const fact = facts && facts.has('txn_req_' + r.ev.id);
      if (cancelled.has(r.ev.id)) { r.status = fact ? 'done-elsewhere' : 'cancelled'; continue; }
      if (r.status !== 'pending') continue;
      if (fact) { r.status = 'confirmed'; continue; }
      const eff = _ms(r.ev.effectiveAt);
      if (nowMs > eff + DISC.REQUEST_TTL_MS) r.status = 'expired';
      else if (Clock.ripe(eff, nowMs, skewMs)) r.status = 'ripe';
    }
    return st;
  }
};

/* --------------------------- Đồng hồ tin cậy (phần thuần) --------------------------- */
const Clock = {
  /** Mốc thời gian lớn nhất trong dữ liệu; bỏ qua mốc vượt capMs (giờ máy chủ + 10 phút) khi biết giờ máy chủ. */
  floorOf(values, capMs = null) {
    let m = 0;
    for (const v of values) { const t = _ms(v); if (!Number.isFinite(t)) continue; if (capMs !== null && t > capMs) continue; if (t > m) m = t; }
    return m;
  },
  effectiveAt(nowMs, floorMs, waitMs = DISC.COOLDOWN_MS) { return Math.max(nowMs, floorMs || 0) + waitMs; },
  /** "Chín" khi đã tới hạn và đồng hồ máy không lệch quá 10 phút so với Google (nếu đã đo được). */
  ripe(effMs, nowMs, skewMs = null) {
    if (skewMs !== null && Math.abs(skewMs) > DISC.SKEW_MAX_MS) return false;
    return nowMs >= effMs;
  }
};

/* --------------------------- Danh mục chứng khoán (phần thuần) --------------------------- */
const Portfolio = {
  SYM_RE: /^[A-Z0-9]{3,10}$/,
  BANDS: { HOSE: 0.07, HSX: 0.07, HNX: 0.10, UPCOM: 0.15 },
  /** Giá người dùng gõ: "95.5" / "95,5" / số < 1000 = nghìn đồng; số nguyên ≥ 1000 = đồng. */
  parsePrice(raw) {
    let s = String(raw == null ? '' : raw).trim().replace(/\s/g, '');
    if (!s) return null;
    if (/^\d{1,3}(\.\d{3})+$/.test(s)) return Number(s.replace(/\./g, ''));
    if (/^\d+([.,]\d+)?$/.test(s)) {
      const v = Number(s.replace(',', '.'));
      if (!Number.isFinite(v) || v <= 0) return null;
      if (/[.,]/.test(s) || v < 1000) return Math.round(v * 1000);
      return Math.round(v);
    }
    return null;
  },
  parseQty(raw) {
    const s = String(raw == null ? '' : raw).trim().replace(/\s/g, '');
    if (/^\d+$/.test(s)) return Number(s);
    if (/^\d{1,3}([.,]\d{3})+$/.test(s)) return Number(s.replace(/[.,]/g, ''));
    return null;
  },
  /** Phân tích văn bản dán: mỗi dòng "MÃ KHỐI_LƯỢNG [GIÁ_VỐN]". */
  parseLines(text) {
    const items = [], errors = [];
    const lines = String(text || '').split(/\r?\n/);
    lines.forEach((ln, i) => {
      const raw = ln.trim(); if (!raw) return;
      const tok = raw.split(/[\s;|\t]+/).filter(Boolean);
      const sym = (tok[0] || '').toUpperCase();
      if (!this.SYM_RE.test(sym)) { errors.push({ line: i + 1, text: raw, msg: 'Mã chứng khoán không hợp lệ' }); return; }
      const qty = this.parseQty(tok[1]);
      if (!Number.isSafeInteger(qty) || qty <= 0) { errors.push({ line: i + 1, text: raw, msg: 'Khối lượng phải là số nguyên dương' }); return; }
      let avgCost = null;
      if (tok[2] !== undefined) { avgCost = this.parsePrice(tok[2]); if (!Number.isSafeInteger(avgCost) || avgCost <= 0) { errors.push({ line: i + 1, text: raw, msg: 'Giá vốn không hợp lệ' }); return; } }
      items.push({ symbol: sym, qty, avgCost, line: i + 1 });
    });
    return { items, errors };
  },
  /** Chuẩn hóa phản hồi VPS (giá theo nghìn đồng) về VND nguyên. Mã thiếu bị bỏ qua, không bao giờ thành 0. */
  parseVps(json) {
    if (!Array.isArray(json)) throw new Error('VPS_SHAPE');
    const out = new Map();
    const k = v => { const n = typeof v === 'string' ? Number(v) : v; return typeof n === 'number' && Number.isFinite(n) && n > 0 ? Math.round(n * 1000) : null; };
    for (const it of json) {
      if (!it || typeof it.sym !== 'string') continue;
      const sym = it.sym.toUpperCase();
      const ref = k(it.r), ceil = k(it.c), floor = k(it.f);
      let price = k(it.lastPrice); let basis = 'last';
      if (price === null) { price = ref; basis = 'ref'; }
      if (price === null) continue;
      if (ceil !== null && floor !== null && (price > ceil || price < floor)) continue;
      out.set(sym, { price, ref, ceil, floor, basis, market: typeof it.marketId === 'string' ? it.marketId.toUpperCase() : '' });
    }
    return out;
  },
  /** Chuẩn hóa phản hồi VNDirect dchart (TradingView, nghìn đồng). */
  parseVnd(json) {
    if (!json || json.s !== 'ok' || !Array.isArray(json.c) || !Array.isArray(json.t) || !json.c.length) throw new Error('VND_SHAPE');
    const i = json.c.length - 1; const c = json.c[i];
    if (typeof c !== 'number' || !Number.isFinite(c) || c <= 0) throw new Error('VND_SHAPE');
    return { price: Math.round(c * 1000), tMs: json.t[i] * 1000, prevClose: i > 0 && json.c[i - 1] > 0 ? Math.round(json.c[i - 1] * 1000) : null };
  },
  /** Giá dùng để định giá: nguồn → giá nhập tay → giá vốn. */
  priceFor(holding, quote) {
    if (quote && Number.isSafeInteger(quote.price) && quote.price > 0) return { price: quote.price, source: quote.source || 'quote' };
    if (Number.isSafeInteger(holding.manualPrice) && holding.manualPrice > 0) return { price: holding.manualPrice, source: 'manual' };
    if (Number.isSafeInteger(holding.avgCost) && holding.avgCost > 0) return { price: holding.avgCost, source: 'cost' };
    return { price: null, source: 'none' };
  },
  value(qty, price) { if (!Number.isSafeInteger(qty) || !Number.isSafeInteger(price)) return 0; const v = qty * price; return Number.isSafeInteger(v) ? v : 0; },
  /** Nghi sự kiện quyền: giá tham chiếu hôm nay thấp hơn đóng cửa phiên trước vượt biên độ sàn của sàn niêm yết. */
  rightsFlag(ref, prevClose, market) {
    if (!Number.isSafeInteger(ref) || !Number.isSafeInteger(prevClose) || prevClose <= 0) return false;
    const band = this.BANDS[market] || this.BANDS.HOSE;
    return ref < prevClose * (1 - band) - 1;
  },
  /* ---------- Định giá của chính người dùng (FinPilot không tự định giá, không khuyến nghị) ---------- */
  VAL_METHODS: { pe: 'P/E', pb: 'P/B', ddm: 'Chiết khấu cổ tức (DDM)', dcf: 'Chiết khấu dòng tiền (DCF)', sotp: 'Tổng các phần (SOTP/RNAV)', bank: 'Ngân hàng kết hợp (P/B-ROE · P/E · DDM)', blend: 'Kết hợp nhiều phương pháp', other: 'Khác' },
  VAL_MAX_AGE: 180,
  /** Hạn công bố BCTC quý gần nhất đã qua tính tới `today`: cuối quý + 45 ngày (hạn BCTC hợp nhất). */
  latestReportDue(today) {
    if (!DateUtil.isISO(today)) return '';
    const [y] = DateUtil.ymd(today); let best = '';
    for (const yy of [y - 1, y]) for (const [m, d] of [[3, 31], [6, 30], [9, 30], [12, 31]]) {
      const due = DateUtil.addDays(DateUtil.make(yy, m, d), 45);
      if (due <= today && due > best) best = due;
    }
    return best;
  },
  /** Tóm tắt định giá: biên an toàn = (giá trị hợp lý − giá) / giá trị hợp lý. null khi chưa nhập. */
  valuation(h, price, today) {
    if (!h || !Number.isSafeInteger(h.fairValue) || h.fairValue <= 0) return null;
    const fair = h.fairValue; const buy = Number.isSafeInteger(h.buyBelow) && h.buyBelow > 0 ? h.buyBelow : null;
    const p = Number.isSafeInteger(price) && price > 0 ? price : null;
    const mos = p === null ? null : (fair - p) / fair;
    const zone = p === null ? 'none' : buy !== null && p <= buy ? 'buy' : p <= fair ? 'below' : 'above';
    const okDate = DateUtil.isISO(h.valDate) && DateUtil.isISO(today) && h.valDate <= today;
    const ageDays = okDate ? DateUtil.diffDays(h.valDate, today) : null;
    const due = this.latestReportDue(today);
    const newerReport = okDate && !!due && h.valDate < due;
    const stale = !okDate || ageDays > this.VAL_MAX_AGE || newerReport;
    const reason = !okDate ? 'chưa có ngày định giá' : ageDays > this.VAL_MAX_AGE ? `đã ${ageDays} ngày (quá ${this.VAL_MAX_AGE})` : newerReport ? `có BCTC quý mới từ ${DateUtil.toVN(due)}` : '';
    return { fair, buyBelow: buy, price: p, mos, zone, ageDays, stale, reason, method: this.VAL_METHODS[h.valMethod] ? h.valMethod : '' };
  },
  /** Tổng hợp: giá trị thị trường và giá trị theo định giá của bạn (chỉ các mã đã nhập định giá và có giá). */
  valuationTotals(items) {
    let market = 0, fair = 0, n = 0, stale = 0;
    for (const it of items || []) {
      const v = it && it.val; if (!v || v.price === null || !Number.isSafeInteger(it.qty) || it.qty <= 0) continue;
      market += it.qty * v.price; fair += it.qty * v.fair; n++; if (v.stale) stale++;
    }
    return { n, stale, market, fair, ratio: fair > 0 ? market / fair : null };
  },
  /** Dán định giá: mỗi dòng "MÃ GIÁ_TRỊ_HỢP_LÝ [VÙNG_MUA] [YYYY-MM-DD|DD/MM/YYYY] [PHƯƠNG_PHÁP] [https://…]". */
  parseValLines(text, today) {
    const items = [], errors = [];
    const toISO = s => { let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if (m && DateUtil.isISO(s)) return s; m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s); if (m) { const iso = DateUtil.make(+m[3], +m[2], +m[1]); return DateUtil.isISO(iso) ? iso : null; } return null; };
    String(text || '').split(/\r?\n/).forEach((ln, i) => {
      const raw = ln.trim(); if (!raw || raw.startsWith('#')) return;
      const tok = raw.split(/[\s;|\t]+/).filter(Boolean);
      const err = msg => errors.push({ line: i + 1, text: raw, msg });
      const sym = (tok[0] || '').toUpperCase();
      if (!this.SYM_RE.test(sym)) return err('Mã chứng khoán không hợp lệ');
      const fair = this.parsePrice(tok[1]);
      if (!Number.isSafeInteger(fair) || fair <= 0) return err('Giá trị hợp lý không hợp lệ');
      const it = { symbol: sym, fairValue: fair, buyBelow: null, valDate: today, valMethod: '', valLink: '', line: i + 1 };
      for (const t of tok.slice(2)) {
        const iso = toISO(t);
        if (iso) { if (iso > today) return err('Ngày định giá ở tương lai'); it.valDate = iso; continue; }
        if (/^https:\/\/\S+$/i.test(t)) { it.valLink = t.slice(0, 300); continue; }
        if (this.VAL_METHODS[t.toLowerCase()]) { it.valMethod = t.toLowerCase(); continue; }
        const p = this.parsePrice(t);
        if (Number.isSafeInteger(p) && p > 0 && it.buyBelow === null) { it.buyBelow = p; continue; }
        return err(`Không hiểu "${t}"`);
      }
      if (it.buyBelow !== null && it.buyBelow > it.fairValue) return err('Vùng mua phải ≤ giá trị hợp lý');
      items.push(it);
    });
    return { items, errors };
  },
  /** Lệch tỷ trọng theo quy tắc 5/25: ngưỡng = min(5 điểm %, 25% của tỷ trọng mục tiêu). */
  drift(rows) {
    const total = rows.reduce((s, r) => s + (r.value > 0 ? r.value : 0), 0);
    return rows.map(r => {
      const actual = total > 0 ? r.value / total * 100 : 0;
      const target = typeof r.targetPct === 'number' && r.targetPct >= 0 ? r.targetPct : null;
      if (target === null) return { ...r, actual, target: null, diff: null, band: null, flag: false };
      const band = Math.min(5, target * 0.25 || 5);
      const diff = actual - target;
      return { ...r, actual, target, diff, band, flag: Math.abs(diff) > band };
    });
  }
};

/* ==========================================================================
   LỚP TÀI SẢN ("các quỹ") — thuần, không DOM/không đồng hồ.
   Nguyên tắc: mỗi đồng tiền nằm ở đúng MỘT lớp, gán tại nơi giữ tiền thật
   (tài khoản · tài sản nhập tay · từng mã cổ phiếu). Mục tiêu chỉ là nhãn,
   không bao giờ cộng vào lớp. Bất biến: Σ lớp + Chưa phân lớp = Tổng tài sản.
   ========================================================================== */
const Layers = {
  KEYS: ['reserve', 'defensive', 'income', 'growth', 'risk', 'use'],
  LABELS: { reserve: 'Quỹ dự phòng', defensive: 'Phòng thủ', income: 'Thu nhập cố định', growth: 'Tăng trưởng', risk: 'Rủi ro', use: 'Tài sản sử dụng', none: 'Chưa phân lớp' },
  HINTS: {
    reserve: 'Tiền để dành cho việc bất ngờ — rút được ngay.',
    defensive: 'Giữ giá trị: tiền gửi không kỳ hạn, vàng, ngoại tệ, tiền mặt chờ đầu tư.',
    income: 'Sinh lãi đều: tiết kiệm có kỳ hạn, trái phiếu.',
    growth: 'Kỳ vọng tăng giá dài hạn: cổ phiếu, chứng chỉ quỹ.',
    risk: 'Có thể mất phần lớn: crypto, cho vay cá nhân, đầu cơ.',
    use: 'Tài sản để dùng: nhà đang ở, xe. Tính vào tổng tài sản nhưng mặc định không tính tỷ trọng.',
    none: 'Chưa gán lớp — tỷ trọng các lớp khác sẽ thiếu chính xác cho tới khi bạn gán.'
  },
  /** Ngưỡng "số cũ" theo nhóm tài sản (ngày). */
  STALE_DAYS: { gold: 7, foreign: 7, securities: 30, realestate: 90, vehicle: 90, other: 90 },
  valid(k) { return this.KEYS.includes(k); },
  /** Lớp mặc định theo loại (dùng khi người dùng chưa tự gán). ctx.reserveAccounts: Set id tài khoản gắn mục tiêu quỹ dự phòng. */
  defaultFor(kind, rec, ctx = {}) {
    if (kind === 'account') {
      if (ctx.reserveAccounts && ctx.reserveAccounts.has(rec.id)) return 'reserve';
      return { savings: 'income', cash: 'defensive', bank: 'defensive', ewallet: 'defensive', investment: 'defensive' }[rec.type] || 'none';
    }
    if (kind === 'asset') return { gold: 'defensive', foreign: 'defensive', realestate: 'use', vehicle: 'use', securities: 'growth' }[rec.group] || 'none';
    if (kind === 'holding') return 'growth';
    return 'none';
  },
  resolve(kind, rec, ctx) {
    if (rec && this.valid(rec.layer)) return { layer: rec.layer, explicit: true };
    return { layer: this.defaultFor(kind, rec || {}, ctx), explicit: false };
  },
  /**
   * Gom các khoản theo lớp. items: [{ key, kind, name, layer, explicit, value(int), stale(bool), staleNote, valuedAt, fxGold(bool) }]
   * opts.includeUse: tính cả "Tài sản sử dụng" vào nền tỷ trọng.
   */
  aggregate(items, opts = {}) {
    const includeUse = !!opts.includeUse;
    const by = {}; for (const k of this.KEYS.concat('none')) by[k] = { key: k, value: 0, positive: 0, n: 0, stale: 0, items: [], oldest: '' };
    let gross = 0, positiveTotal = 0, assignedFresh = 0, assignedVal = 0, explicitVal = 0, fxGold = 0;
    const negatives = [];
    for (const it of items || []) {
      const k = this.valid(it.layer) ? it.layer : 'none';
      const v = Number.isSafeInteger(it.value) ? it.value : 0;
      const b = by[k]; b.value += v; b.n++; b.items.push(it);
      const inBase = includeUse || k !== 'use'; // độ tin cậy đo trên đúng phần tài sản dùng để tính tỷ trọng
      if (v > 0) b.positive += v;
      if (v > 0 && inBase) positiveTotal += v;
      if (v < 0) negatives.push(it);
      if (it.stale) b.stale++;
      if (it.valuedAt && (!b.oldest || it.valuedAt < b.oldest)) b.oldest = it.valuedAt;
      gross += v;
      if (v > 0 && inBase && k !== 'none') { assignedVal += v; if (!it.stale) assignedFresh += v; if (it.explicit) explicitVal += v; }
      if (v > 0 && it.fxGold) fxGold += v;
    }
    for (const k in by) by[k].items.sort((a, b) => b.value - a.value);
    // Nền tỷ trọng: tài sản dương, bỏ "Tài sản sử dụng" nếu không chọn tính.
    const base = this.KEYS.concat('none').filter(k => includeUse || k !== 'use').reduce((s, k) => s + Math.max(0, by[k].value), 0);
    const weights = {}; for (const k in by) weights[k] = base > 0 && (includeUse || k !== 'use') ? Math.max(0, by[k].value) / base : null;
    const pct = x => (positiveTotal > 0 ? x / positiveTotal : null);
    return {
      gross, base, includeUse, by, weights, negatives, fxGold,
      coverage: { assigned: pct(assignedVal), reliable: pct(assignedFresh), explicit: pct(explicitVal), unassignedValue: Math.max(0, by.none.value) },
      invariantOk: this.KEYS.concat('none').reduce((s, k) => s + by[k].value, 0) === gross
    };
  },
  /** Chi tiêu bình quân/tháng từ danh sách {month, expense} — chỉ các tháng đã kết thúc, tối đa n tháng gần nhất có dữ liệu. */
  avgMonthlySpend(months, n = 3) {
    const xs = (months || []).filter(m => Number.isFinite(m.expense) && m.expense > 0).slice(-n);
    if (!xs.length) return null;
    return Math.round(xs.reduce((s, m) => s + m.expense, 0) / xs.length);
  },
  /**
   * Đối chiếu với nguyên tắc DO NGƯỜI DÙNG ĐẶT. Không có nguyên tắc nào mặc định.
   * plan: { targets: {layer: pct|null}, band, reserveMonths, fxGoldMin, fxGoldMax, noFloatingDebt }
   * ctx: { monthlySpend, debts: [{name, balance, rateType}] }
   * → [{ id, label, status: 'ok'|'out'|'nodata', detail }]
   */
  checkRules(agg, plan, ctx = {}) {
    const out = []; plan = plan || {};
    const pct = x => (Math.round(x * 1000) / 10).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + '%';
    const pts = x => (x > 0 ? '+' : '') + (Math.round(x * 10) / 10).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' điểm %';
    const weak = !(agg.coverage.reliable >= 0.5);
    const band = Number.isFinite(plan.band) && plan.band > 0 ? plan.band : 5;
    for (const k of this.KEYS) {
      const t = plan.targets && plan.targets[k];
      if (!(Number.isFinite(t) && t >= 0 && t <= 100)) continue;
      const label = `${this.LABELS[k]}: mục tiêu ${t}% (± ${band})`;
      if (k === 'use' && !agg.includeUse) { out.push({ id: 't_' + k, label, status: 'nodata', detail: 'Đang không tính "Tài sản sử dụng" vào tỷ trọng.' }); continue; }
      const w = agg.weights[k];
      if (w === null || agg.base <= 0 || weak) { out.push({ id: 't_' + k, label, status: 'nodata', detail: weak ? 'Dưới 50% tài sản có lớp và số liệu còn mới.' : 'Chưa có tài sản.' }); continue; }
      const diff = w * 100 - t;
      const staleNote = agg.by[k].stale ? ` · ${agg.by[k].stale} khoản số cũ` : '';
      out.push({ id: 't_' + k, label, status: Math.abs(diff) > band ? 'out' : 'ok', detail: `Hiện ${pct(w)} — lệch ${pts(diff)} so với mục tiêu bạn đặt${staleNote}` });
    }
    if (Number.isFinite(plan.reserveMonths) && plan.reserveMonths > 0) {
      const label = `Quỹ dự phòng ≥ ${plan.reserveMonths} tháng chi tiêu`;
      const spend = ctx.monthlySpend;
      if (!(spend > 0)) out.push({ id: 'reserve_m', label, status: 'nodata', detail: 'Chưa có chi tiêu của các tháng đã qua để tính.' });
      else {
        const m = Math.max(0, agg.by.reserve.value) / spend;
        out.push({ id: 'reserve_m', label, status: m + 1e-9 >= plan.reserveMonths ? 'ok' : 'out', detail: `Đủ ${(Math.floor(m * 10) / 10).toLocaleString('vi-VN')} tháng (chi bình quân ${(Math.round(spend / 1e5) / 10).toLocaleString('vi-VN')} tr/tháng)` });
      }
    }
    const hasMin = Number.isFinite(plan.fxGoldMin), hasMax = Number.isFinite(plan.fxGoldMax);
    if (hasMin || hasMax) {
      const lo = hasMin ? plan.fxGoldMin : 0, hi = hasMax ? plan.fxGoldMax : 100;
      const label = `Vàng + ngoại tệ trong khoảng ${lo}–${hi}%`;
      if (agg.base <= 0 || weak) out.push({ id: 'fxgold', label, status: 'nodata', detail: weak ? 'Dưới 50% tài sản có lớp và số liệu còn mới.' : 'Chưa có tài sản.' });
      else { const w = agg.fxGold / agg.base * 100; out.push({ id: 'fxgold', label, status: w + 1e-9 < lo || w - 1e-9 > hi ? 'out' : 'ok', detail: `Hiện ${pct(w / 100)} tổng tài sản tính tỷ trọng` }); }
    }
    if (plan.noFloatingDebt) {
      const label = 'Không có khoản nợ lãi thả nổi';
      const live = (ctx.debts || []).filter(d => d.balance > 0);
      const fl = live.filter(d => d.rateType === 'floating'); const unk = live.filter(d => d.rateType !== 'fixed' && d.rateType !== 'floating');
      if (fl.length) out.push({ id: 'nofloat', label, status: 'out', detail: `Đang có: ${fl.map(d => d.name).join(', ')}` });
      else if (unk.length) out.push({ id: 'nofloat', label, status: 'nodata', detail: `Chưa ghi loại lãi suất cho: ${unk.map(d => d.name).join(', ')}` });
      else out.push({ id: 'nofloat', label, status: 'ok', detail: live.length ? 'Các khoản nợ đều lãi cố định.' : 'Không có khoản nợ.' });
    }
    return out;
  },
  /** Cổ tức tiền thực nhận ước tính: KL × cổ tức/cp × (1 − thuế 5%), làm tròn đồng. */
  netDividend(qty, dps, taxRate = 0.05) {
    if (!Number.isSafeInteger(qty) || qty <= 0 || !Number.isFinite(dps) || dps <= 0) return null;
    return Math.round(qty * dps * (1 - taxRate));
  }
};

/* ==========================================================================
   DISCIPLINE — kỷ luật tài chính: phân bổ khi tiền về, khóa ảo, "Được phép chi",
   nhật ký cam kết, khóa 72 giờ. Nguyên tắc: chặn ý định, không chặn sự thật.
   ========================================================================== */

/* --------------------------- Đồng hồ tin cậy (riêng từng hồ sơ trên thiết bị) --------------------------- */
const TrustedClock = (() => {
  const KEY = 'finpilot.clock.v1' + Profiles.suffix();
  let s = { floor: 0, skew: null, skewAt: '' };
  try { const r = JSON.parse(localStorage.getItem(KEY) || 'null'); if (r && typeof r.floor === 'number') s = { floor: r.floor, skew: typeof r.skew === 'number' ? r.skew : null, skewAt: typeof r.skewAt === 'string' ? r.skewAt : '' }; } catch (e) {}
  let lastSave = 0;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
  return {
    skew() { return s.skew; },
    /** Giờ dùng cho khóa 72h: hiệu chỉnh theo Google khi đã đo; không bao giờ lùi so với mốc đã thấy. */
    now() {
      const raw = Date.now(); const base = s.skew === null ? raw : raw - s.skew;
      if (s.skew !== null && s.floor > base + DISC.SKEW_MAX_MS) { s.floor = base; save(); }
      const t = Math.max(base, s.floor);
      if (t > s.floor) { s.floor = t; if (raw - lastSave > 30000 || raw < lastSave) { lastSave = raw; save(); } }
      return t;
    },
    iso() { return new Date(this.now()).toISOString(); },
    /** Gọi với modifiedTime do máy chủ Google Drive đóng dấu khi tải lên. */
    observeServer(iso) {
      const t = Date.parse(iso); if (!Number.isFinite(t)) return;
      s.skew = Date.now() - t; s.skewAt = new Date().toISOString();
      if (s.floor > t + DISC.SKEW_MAX_MS) s.floor = t;
      save();
    },
    skewTooLarge() { return s.skew !== null && Math.abs(s.skew) > DISC.SKEW_MAX_MS; },
    _reset() { s = { floor: 0, skew: null, skewAt: '' }; save(); }
  };
})();

const Discipline = (() => {
  const DEV_KEY = 'finpilot.dev.v1' + Profiles.suffix();
  let dev = ''; try { dev = localStorage.getItem(DEV_KEY) || ''; } catch (e) {}
  if (!/^[a-z0-9]{4,16}$/.test(dev)) { dev = Util.uid('d').replace(/[^a-z0-9]/gi, '').slice(-10).toLowerCase(); try { localStorage.setItem(DEV_KEY, dev); } catch (e) {} }
  let hlc = 0;

  const EMG_CODES = [['emg_unspecified', 'Khẩn cấp (không ghi rõ)'], ['health', 'Sức khỏe'], ['income_loss', 'Mất/giảm thu nhập'], ['repair', 'Sửa nhà/xe'], ['family', 'Gia đình'], ['other', 'Khác']];
  const HF_CODES = [['invest', 'Cơ hội đầu tư'], ['big_spend', 'Chi lớn ngoài kế hoạch'], ['reprioritize', 'Đổi ưu tiên'], ['other', 'Khác']];
  const CLS_LABEL = { fix: 'Sửa lỗi nhập', withdrawn: 'Ghi nhận đã rút', emg: 'Khẩn cấp', hf: 'Lý do muốn chi', trial: 'Chạy thử', import: 'Nhập/khôi phục dữ liệu', request: 'Yêu cầu đã chín', tighten: 'Siết chặt', setup: 'Thiết lập', goal_account_out: 'Chi từ tài khoản mục tiêu' };

  const D = {
    EMG_CODES, HF_CODES, CLS_LABEL,
    device() { return dev; },
    epoch(st) { return (st.settings && st.settings.disciplineEpoch) || 0; },
    newEvent(kind, f = {}, st = App.state) {
      const nowMs = TrustedClock.now();
      hlc = Math.max(nowMs, hlc + 1);
      return Model.cev({ id: `cev_${dev}_${hlc.toString(36)}_${Util.uid('r').slice(-4)}`, kind, at: new Date(nowMs).toISOString(), epoch: this.epoch(st), device: dev, ...f });
    },
    facts(st) { return memo(st, 'txnIds', () => new Set(st.transactions.map(t => t.id))); },
    txnById(st) { return memo(st, 'txnById', () => Util.byId(st.transactions)); },

    /** Trạng thái hiệu lực (gấp từ nhật ký) — tính lại mỗi 15 giây vì phụ thuộc thời gian. */
    view(st) {
      const now = TrustedClock.now();
      return memo(st, 'disc:' + Math.floor(now / 15000), () => {
        const f = CommitLog.fold(st.commitLog || [], { epoch: this.epoch(st), nowMs: now, skewMs: TrustedClock.skew(), facts: this.facts(st) });
        const cfg = f.config;
        const armedMs = f.armedAt ? Date.parse(f.armedAt) : null;
        const trialEnd = armedMs !== null ? armedMs + DISC.TRIAL_MS : null;
        const active = !!(cfg && cfg.enabled);
        return { ...f, cfg, active, armedMs, trialEnd, inTrial: active && trialEnd !== null && now < trialEnd, enforce: active && trialEnd !== null && now >= trialEnd, now, skewBad: TrustedClock.skewTooLarge() };
      });
    },
    ruleFor(cfg, categoryId) { return cfg && cfg.enabled ? (cfg.rules || []).find(r => (r.categoryIds || []).includes(categoryId) && (r.steps || []).length) || null : null; },
    referencedGoals(cfg) { const s = new Set(); for (const r of (cfg && cfg.rules) || []) for (const x of r.steps || []) if (x.goalId) s.add(x.goalId); return s; },

    /* ---------- Phân bổ & khóa ảo ---------- */
    lines(st, alc) {
      const v = this.view(st); const tx = this.txnById(st);
      const plan = Alloc.plan(alc.incomeAmount, alc.steps, alc.caps);
      const steps = new Map(alc.steps.map(s => [s.key, s]));
      const today = DateUtil.today(); const reserved = this.reservedAccounts(st, v.cfg);
      return { spend: plan.spend, lines: plan.lines.map(l => {
        const txnId = `txn_alc_${alc.incomeTxnId}_${l.key}`; const t = tx.get(txnId); const step = steps.get(l.key);
        // Chỉ tính "đã chuyển" khi đúng là tiền đã rời tài khoản tự do sang đúng tài khoản đích, không đề ngày tương lai.
        const valid = !!t && t.type === 'transfer' && step && t.toAccountId === step.toAccountId && t.date <= today && !reserved.has(t.accountId);
        const doneAmt = valid ? t.amount : 0;
        const released = v.released.has(alc.id + '|' + l.key);
        const open = released ? 0 : Math.max(0, l.amount - doneAmt);
        return { ...l, step: steps.get(l.key), txnId, txn: t || null, doneAmt, released, open, status: released ? 'released' : open === 0 ? 'done' : doneAmt > 0 ? 'partial' : 'open' };
      }) };
    },
    allocInfo(st, alc) {
      const inc = this.txnById(st).get(alc.incomeTxnId);
      const L = this.lines(st, alc);
      return { alc, income: inc || null, orphan: !inc, revised: !!inc && inc.amount !== alc.incomeAmount, ...L, open: inc ? Util.sum(L.lines, l => l.open) : 0, locked: Util.sum(L.lines, l => l.amount) };
    },
    allAllocs(st) { return memo(st, 'allocInfo', () => (st.allocations || []).map(a => this.allocInfo(st, a)).sort((a, b) => a.alc.date < b.alc.date ? 1 : a.alc.date > b.alc.date ? -1 : 0)); },
    openLines(st) {
      return memo(st, 'openLines:' + Math.floor(TrustedClock.now() / 15000), () => {
        const out = [];
        for (const a of this.allAllocs(st)) { if (a.orphan) continue; for (const l of a.lines) if (l.open > 0) out.push({ info: a, line: l }); }
        return out;
      });
    },
    openReservedForGoal(st, goalId, excludeAlcId = null) { let s = 0; for (const o of this.openLines(st)) if (o.info.alc.id !== excludeAlcId && o.line.step && o.line.step.goalId === goalId) s += o.line.open; return s; },
    goalCap(st, goalId, excludeAlcId) {
      const g = st.goals.find(x => x.id === goalId);
      if (!g || g.status !== 'active') return 0;
      return Math.max(0, Goals.progress(st, g).remaining - this.openReservedForGoal(st, goalId, excludeAlcId));
    },
    /** Tạo bản phân bổ trong CÙNG lần ghi với khoản thu (gọi bên trong commit). */
    createAllocation(draft, txn, v) {
      const rule = this.ruleFor(v.cfg, txn.categoryId); if (!rule) return null;
      const id = 'alc_' + txn.id;
      if ((draft.allocations || []).some(a => a.id === id)) return null;
      const caps = {};
      for (const s of rule.steps) caps[s.key] = s.goalId ? this.goalCap(draft, s.goalId, id) : null;
      const alc = Model.allocation({ id, incomeTxnId: txn.id, ruleId: rule.id, ruleName: rule.name, ruleVersion: v.version, date: txn.date, incomeAmount: txn.amount, steps: Util.clone(rule.steps), caps, createdAt: Util.nowISO() });
      draft.allocations.push(alc); clearMemo(draft);
      return alc;
    },

    /* ---------- "Được phép chi" ---------- */
    reservedAccounts(st, cfg) {
      const s = new Set();
      for (const g of st.goals) if (g.mode === 'account' && g.status !== 'done' && g.accountId) s.add(g.accountId);
      for (const r of (cfg && cfg.rules) || []) for (const x of r.steps || []) if (x.toAccountId) s.add(x.toAccountId);
      return s;
    },
    payday(st, today, cfg) {
      const cats = new Set(); for (const r of (cfg && cfg.rules) || []) if (r.id === 'salary') (r.categoryIds || []).forEach(c => cats.add(c));
      if (!cats.size) cats.add('cat_inc_salary');
      let best = null;
      for (const r of st.recurring) {
        if (!r.active || r.template.type !== 'income' || !cats.has(r.template.categoryId)) continue;
        const occ = Recurring.occurrences(r, DateUtil.addDays(today, 400)).find(d => d > today);
        if (occ && (!best || occ < best)) best = occ;
      }
      return best ? { date: best, source: 'recurring' } : { date: DateUtil.addDays(DateUtil.monthEnd(DateUtil.monthKey(today)), 1), source: 'month' };
    },
    spendable(st, today = DateUtil.today()) {
      return memo(st, 'spend:' + today + ':' + Math.floor(TrustedClock.now() / 15000), () => {
        const v = this.view(st); const cfg = v.cfg;
        const reserved = this.reservedAccounts(st, cfg);
        const bal = Ledger.accountBalances(st, today);
        let free = 0; const freeAccs = [];
        for (const a of st.accounts) if (a.active && LIQUID_TYPES.includes(a.type) && !reserved.has(a.id)) { const b = bal.get(a.id) || 0; free += b; freeAccs.push({ acc: a, balance: b }); }
        const freeIds = new Set(freeAccs.map(x => x.acc.id));
        const open = Util.sum(this.openLines(st), o => o.line.open);
        const pd = this.payday(st, today, cfg);
        let fixed = 0; const fixedItems = [];
        for (const r of st.recurring) {
          const t = r.template;
          if (!r.active || !(t.type === 'expense' || t.type === 'debt_payment') || t.debtId && t.type === 'expense' || !freeIds.has(t.accountId)) continue;
          const handled = Recurring.handled(st, r);
          for (const d of Recurring.occurrences(r, DateUtil.addDays(pd.date, -1))) if (d >= today && !handled.has(d)) { const amt = Recurring.amount(t); fixed += amt; fixedItems.push({ rule: r, date: d, amount: amt }); }
        }
        const value = free - open - fixed;
        const daysLeft = Math.max(1, DateUtil.diffDays(today, pd.date));
        return { value, free, open, fixed, fixedItems, freeAccs, reserved, payday: pd, daysLeft, perDay: value > 0 ? Math.floor(value / daysLeft) : 0 };
      });
    },

    /* ---------- Guard: chặn ý định, không chặn sự thật ---------- */
    age(rec, now) { const t = Date.parse(rec.createdAt || rec.updatedAt || ''); return Number.isFinite(t) ? now - t : Infinity; },
    guard(before, draft) {
      const v = this.view(before);
      if (!v.active) return { viol: [], warns: [], v };
      const now = v.now; const viol = [], warns = []; const today = DateUtil.today();
      const bt = this.txnById(before), dt = new Map(draft.transactions.map(t => [t.id, t]));
      const dAlc = new Set((draft.allocations || []).map(a => a.id));
      const dGoalIds = new Set(draft.goals.map(g => g.id));
      const inGoal = t => t && t.type === 'transfer' && t.goalId && (t.goalDir || 'in') === 'in';
      const outGoal = t => t && t.type === 'transfer' && t.goalId && t.goalDir === 'out';
      for (const [id, t] of bt) {
        if (!inGoal(t)) continue;
        if (t.allocationId && dAlc.has(t.allocationId)) continue; // gỡ xác nhận → khóa ảo mở lại, tiền vẫn được giữ
        if (!dGoalIds.has(t.goalId)) continue; // thuộc thao tác xóa mục tiêu (xét riêng bên dưới)
        if (this.age(t, now) < DISC.GRACE_MS) continue;
        const n = dt.get(id);
        if (!n) viol.push({ kind: 'goalTxnRemove', txn: t, goalId: t.goalId, amount: t.amount });
        else {
          const moved = !inGoal(n) || n.goalId !== t.goalId || n.date > today || n.accountId !== t.accountId || n.toAccountId !== t.toAccountId;
          const dec = moved ? t.amount : Math.max(0, t.amount - n.amount);
          if (dec > 0) viol.push({ kind: 'goalTxnEdit', txn: t, goalId: t.goalId, amount: dec });
        }
      }
      for (const [id, n] of dt) {
        if (!outGoal(n)) continue;
        const o = bt.get(id);
        const inc = n.amount - (outGoal(o) && o.goalId === n.goalId ? o.amount : 0);
        if (inc > 0) viol.push({ kind: 'goalWithdraw', txn: n, goalId: n.goalId, amount: inc, edited: !!o });
      }
      const refs = this.referencedGoals(v.cfg); const dg = Util.byId(draft.goals);
      for (const g of before.goals) {
        const n = dg.get(g.id); const saved = Goals.progress(before, g).saved;
        if (!n) { if (saved > 0 || refs.has(g.id)) viol.push({ kind: 'goalDelete', goal: g, goalId: g.id, amount: saved, young: this.age(g, now) < DISC.GRACE_MS }); continue; }
        if (!refs.has(g.id) && g.mode !== 'account') continue;
        const what = [];
        if (n.target < g.target) what.push('giảm số tiền mục tiêu');
        if (g.status === 'active' && n.status === 'paused') what.push('tạm dừng mục tiêu');
        if (g.status !== 'done' && n.status === 'done' && Goals.progress(before, g).saved < g.target) what.push('đánh dấu hoàn thành khi chưa đủ tiền');
        if (n.mode !== g.mode || n.accountId !== g.accountId) what.push('đổi cách theo dõi');
        if (what.length && refs.has(g.id)) viol.push({ kind: 'goalLoosen', goal: g, newGoal: n, baseUpdatedAt: g.updatedAt, goalId: g.id, what, amount: Math.max(0, g.target - n.target), young: this.age(g, now) < DISC.GRACE_MS });
      }
      // Mọi khoản tiền rời tài khoản tích lũy (đích của quy tắc / mục tiêu theo số dư) sang nơi khác đều được ghi & đếm.
      const goalAccs = this.reservedAccounts(before, v.cfg);
      for (const [id, n] of dt) {
        if (bt.has(id) || !goalAccs.has(n.accountId)) continue;
        const outflow = n.type === 'expense' || n.type === 'debt_payment' || (n.type === 'transfer' && !goalAccs.has(n.toAccountId)) || (n.type === 'adjustment' && n.direction === 'out');
        if (outflow) warns.push({ kind: 'goalAccountOut', txn: n, amount: n.amount });
      }
      return { viol, warns, v };
    },
    routes(x) {
      switch (x.kind) {
        case 'goalTxnRemove': case 'goalTxnEdit': return ['fix', 'withdrawn'];
        case 'goalWithdraw': return x.edited ? ['fix', 'withdrawn'] : ['request', 'withdrawn', 'emg'];
        case 'goalDelete': case 'goalLoosen': return x.young ? ['fix', 'request'] : ['request'];
        default: return ['request'];
      }
    },
    describe(st, x) {
      const g = st.goals.find(y => y.id === x.goalId) || x.goal; const gn = g ? `"${g.name}"` : 'mục tiêu';
      switch (x.kind) {
        case 'goalTxnRemove': return `Xóa giao dịch đã vào quỹ ${gn} hơn 24 giờ (${Money.format(x.amount)})`;
        case 'goalTxnEdit': return `Sửa giao dịch đã vào quỹ ${gn} hơn 24 giờ — quỹ giảm ${Money.format(x.amount)}`;
        case 'goalWithdraw': return `Rút ${Money.format(x.amount)} khỏi quỹ ${gn}`;
        case 'goalDelete': return `Xóa mục tiêu ${gn}${x.amount > 0 ? ` đang giữ ${Money.format(x.amount)}` : ''}`;
        case 'goalLoosen': return `Nới mục tiêu ${gn}: ${x.what.join(', ')}`;
        default: return 'Thay đổi làm nới lỏng cam kết';
      }
    },
    /** Gọi trong App._commit (không áp dụng cho dữ liệu đến từ đồng bộ). Có thể ném lỗi DISCIPLINE. */
    beforeSave(before, draft, opts) {
      // Nhập/khôi phục không được đổi epoch (tránh xóa nhật ký trên mọi thiết bị bằng file cũ hoặc file sửa tay).
      if (opts.discipline && opts.discipline.reason === 'import' && draft.settings) draft.settings.disciplineEpoch = this.epoch(before);
      const epoch = this.epoch(draft);
      draft.commitLog = opts.resetLog ? CommitLog.merge([], draft.commitLog, epoch) : CommitLog.merge(before.commitLog, draft.commitLog, epoch);
      clearMemo(draft);
      const created = [];
      if (opts.resetLog) return { created };
      const dv = this.view(draft);
      if (!opts.noAlloc && dv.active && dv.armedAt) {
        const armDay = DateUtil.isoDateVN(dv.armedAt); const bIds = this.facts(before);
        for (const t of draft.transactions.slice()) {
          if (t.type !== 'income' || bIds.has(t.id) || t.date < armDay) continue;
          const a = this.createAllocation(draft, t, dv); if (a) created.push(a.id);
        }
      }
      const g = this.guard(before, draft);
      const push = ev => { draft.commitLog.push(ev); };
      if (g.viol.length) {
        const d = opts.discipline;
        if (g.v.inTrial) for (const x of g.viol) push(this.newEvent('wouldBlock', { refId: x.txn ? x.txn.id : x.goalId, amount: x.amount, payload: { type: 'note', note: this.describe(before, x).slice(0, 160) } }, draft));
        else if (g.v.enforce) {
          const ok = d && g.viol.every(x => d.reason === 'request' || d.reason === 'import' || this.routes(x).includes(d.reason));
          if (!ok) { const e = new AppError('Thao tác này làm nới lỏng cam kết tài chính của bạn.'); e.code = 'DISCIPLINE'; e.info = { viol: g.viol, offered: d ? d.reason : null }; throw e; }
          for (const x of g.viol) {
            const ev = this.newEvent('override', { cls: d.reason, refId: d.reqId || (x.txn ? x.txn.id : x.goalId), amount: x.amount, payload: { type: 'note', note: this.describe(before, x).slice(0, 160) } }, draft);
            push(ev);

      const warned = g.v.active && !opts.discipline ? g.warns.length : 0;
      if (g.v.active && !opts.discipline) for (const w of g.warns) push(this.newEvent('override', { cls: 'goal_account_out', refId: w.txn.id, amount: w.amount }, draft));

    },
    addNote(draft, cevId, code, text, kind = 'reason') {

    },
    purgeNotes(draft) {
      const cut = TrustedClock.now() - DISC.NOTE_TTL_MS;

      draft.commitNotes = draft.commitNotes.filter(n => n.kind !== 'reason' || !(Date.parse(n.createdAt) < cut));
      return before - draft.commitNotes.length;
    },
    commitmentText(st) { const n = (st.commitNotes || []).filter(x => x.kind === 'commitment').sort((a, b) => a.createdAt < b.createdAt ? 1 : -1)[0]; return n ? n.text : ''; },
    noteFor(st, cevId) { return (st.commitNotes || []).find(n => n.cevId === cevId) || null; },

    /** Phát hiện bất thường sau đồng bộ: sự kiện mang giờ tương lai (máy khác chỉnh đồng hồ nhanh). */

    /** Mốc sàn trong dữ liệu (đồng bộ) để yêu cầu mới không bị tính từ giờ máy đã lùi. */
    clockFloor(st) {
      const skew = TrustedClock.skew(); const cap = skew === null ? null : Date.now() - skew + DISC.SKEW_MAX_MS;
      return memo(st, 'cfloor:' + (cap === null ? 'x' : Math.floor(cap / 60000)), () => {
        const vals = [];

    effectiveAtISO(st) { return new Date(Clock.effectiveAt(TrustedClock.now(), this.clockFloor(st))).toISOString(); },

    /* ---------- Chỉ số kỷ luật ---------- */
    metrics(st, today = DateUtil.today()) {
      const v = this.view(st);
      const from6 = DateUtil.addMonths(today, -6, Number(today.slice(8, 10)));
      const allocs = this.allAllocs(st).filter(a => !a.orphan && a.alc.date >= from6);
      let ontime = 0; let saved = 0; let income = 0;
      for (const a of allocs) {
        income += a.income.amount;
        const deadline = Date.parse(a.alc.createdAt) + DISC.COOLDOWN_MS;
        const allDone = a.lines.every(l => l.status === 'done' || l.status === 'released');
        if (allDone && a.lines.every(l => !l.txn || Date.parse(l.txn.createdAt) <= deadline)) ontime++;
        saved += Util.sum(a.lines, l => Math.min(l.doneAmt, l.amount));

      const mStart = Date.parse(DateUtil.monthStart(DateUtil.monthKey(today)) + 'T00:00:00+07:00');
      const month = v.events.filter(e => Date.parse(e.at) >= mStart);
      const cnt = f => month.filter(f).length;
      const stale = this.openLines(st).filter(o => v.now - Date.parse(o.info.alc.createdAt) > 7 * 86400000).length;
      return {
        allocCount: allocs.length, onTimePct: allocs.length ? ontime / allocs.length * 100 : null,
        savingsPct: income > 0 ? saved / income * 100 : null, saved, income,
        emg: cnt(e => (e.kind === 'override' || e.kind === 'release') && e.cls === 'emg'),
        withdrawn: cnt(e => e.kind === 'override' && e.cls === 'withdrawn'),
        fix: cnt(e => e.kind === 'override' && e.cls === 'fix'),
        requests: cnt(e => e.kind === 'request'), cancels: cnt(e => e.kind === 'cancel'),
        goalAccOut: cnt(e => e.kind === 'override' && e.cls === 'goal_account_out'),
        staleEarmarks: stale
