    },
    requestStatusText(r) {
      return ({ pending: 'Đang chờ', ripe: 'Đã đến hạn — cần xác nhận lại', confirmed: 'Đã thực hiện', cancelled: 'Đã hủy', expired: 'Hết hạn (không xác nhận trong 7 ngày)', stale: 'Không áp dụng (quy tắc đã đổi sau khi tạo yêu cầu)', 'done-elsewhere': 'Đã thực hiện trên thiết bị khác' })[r.status] || r.status;
    }
  };
  return D;
})();

/* ==========================================================================
   PORTFOLIO — danh mục chứng khoán: định giá & lấy giá (TẮT mặc định, bật riêng
   từng hồ sơ trên từng thiết bị). Chỉ gửi DANH SÁCH MÃ tới VPS/VNDirect —
   không gửi khối lượng, giá vốn, email. Bộ nhớ đệm giá nằm ngoài dữ liệu đồng bộ.
   ========================================================================== */
const PriceService = (() => {
  const CK = 'finpilot.prices.v1' + Profiles.suffix();
  const QK = 'finpilot.quotes.v1' + Profiles.suffix();
  const CONSENT_VERSION = '4a-2026-10-17';
  const VPS = 'https://bgapidatafeed.vps.com.vn/getliststockdata/';
  const VND = 'https://dchart-api.vndirect.com.vn/dchart/history';
  const read = k => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return Util.isObj(v) ? v : null; } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let consent = read(CK) || { enabled: false };
  let cache = read(QK) || { quotes: {} };
  if (!Util.isObj(cache.quotes)) cache.quotes = {};
  let busy = null; let ctrl = null;
  const vnParts = ms => {
    const p = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date(ms));
    const g = t => (p.find(x => x.type === t) || {}).value;
    return { date: `${g('year')}-${g('month')}-${g('day')}`, hm: Number(g('hour')) % 24 * 60 + Number(g('minute')) };
  };
  /** Ngày phiên giao dịch gần nhất đã mở (bỏ thứ Bảy, Chủ nhật; chưa tính ngày lễ). */
  const lastSession = ms => {
    const n = vnParts(ms); let d = n.date;
    if (n.hm < 9 * 60) d = DateUtil.addDays(d, -1);
    while (DateUtil.dow(d) === 0 || DateUtil.dow(d) === 6) d = DateUtil.addDays(d, -1);
    return d;
  };
  async function getJSON(url) {
    ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const t = setTimeout(() => { if (ctrl) ctrl.abort(); }, 4000);
    try {
      const r = await fetch(url, { method: 'GET', mode: 'cors', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer', signal: ctrl ? ctrl.signal : undefined });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }
  const svc = {
    version: 0,
    CONSENT_VERSION,
    HOSTS: ['bgapidatafeed.vps.com.vn', 'dchart-api.vndirect.com.vn'],
    enabled() { return !!(consent.enabled && consent.consentVersion === CONSENT_VERSION); },
    consentInfo() { return { ...consent }; },
    needsReconsent() { return !!(consent.enabled && consent.consentVersion !== CONSENT_VERSION); },
    enable() { consent = { enabled: true, enabledAt: new Date().toISOString(), consentVersion: CONSENT_VERSION }; write(CK, consent); },
    disable() { consent = { enabled: false, disabledAt: new Date().toISOString(), consentVersion: consent.consentVersion || '' }; write(CK, consent); if (ctrl) try { ctrl.abort(); } catch (e) {} },
    clearCache() { cache = { quotes: {} }; write(QK, cache); this.version++; },
    quote(sym) { return cache.quotes[sym] || null; },
    lastSession() { return lastSession(Date.now()); },
    freshness(q) {
      if (!q || !q.fetchedAt) return 'none';
      const fetched = Date.parse(q.fetchedAt); const ls = lastSession(Date.now());
      const f = vnParts(fetched);
      if (q.closeDate && q.closeDate >= ls) return 'fresh';
      if (f.date === ls && f.hm >= 9 * 60) return 'fresh';
      if (f.date > ls) return 'fresh';
      return 'stale';
    },
    label(q) {
      if (!q) return '';
      const f = vnParts(Date.parse(q.fetchedAt)); const today = vnParts(Date.now()).date;
      const when = q.closeDate ? `đóng cửa ${DateUtil.toVN(q.closeDate)}` : (f.date === today ? `${DateUtil.timeVN(q.fetchedAt)} hôm nay` : DateUtil.dateTimeVN(q.fetchedAt));

    },
    /** Lấy giá cho danh sách mã. Không bao giờ chạy khi chưa đồng ý. */
    async refresh(symbols, { force = false } = {}) {
      if (!this.enabled()) throw new AppError('Chưa bật "Cập nhật giá chứng khoán" cho hồ sơ này trên thiết bị này.');
      while (busy) { try { await busy; } catch (e) {} } // xếp hàng: không bỏ yêu cầu của mã khác đang chờ
      const syms = Array.from(new Set((symbols || []).map(s => String(s).toUpperCase()).filter(s => Portfolio.SYM_RE.test(s)))).slice(0, 60);
      const now = Date.now(); const nowP = vnParts(now);
      const needs = syms.filter(s => {

        const got = new Set(); const at = new Date().toISOString(); const today = nowP.date;

          if (!this.enabled()) throw new Error('đã tắt');
          const json = await getJSON(VPS + needs.map(encodeURIComponent).join(','));
          const m = Portfolio.parseVps(json);
          for (const [sym, q] of m) {
            if (!needs.includes(sym)) continue;
            const prev = cache.quotes[sym];
            const prevClose = prev && prev.sessionDate && prev.sessionDate < today && Number.isSafeInteger(prev.price) ? prev.price : null;
            const suspect = Portfolio.rightsFlag(q.ref, prevClose, q.market);

            got.add(sym); res.updated.push(sym);

        } catch (e) { res.errors.push('VPS: ' + (e && e.name === 'AbortError' ? 'quá 4 giây' : (e && e.message) || 'lỗi')); }

          if (!this.enabled()) break; // "Tắt" là dừng ngay, kể cả giữa vòng dự phòng
          try {
            const to = Math.floor(now / 1000), from = to - 20 * 86400;

            const q = Portfolio.parseVnd(json);

            got.add(sym); res.updated.push(sym);

        }
        cache.updatedAt = at; write(QK, cache); this.version++;
        return res;
      })();
      try { return await busy; } finally { busy = null; }
    },
    clearRightsFlag(sym) { const q = cache.quotes[sym]; if (q) { q.rightsSuspect = false; q.rightsAck = new Date().toISOString(); write(QK, cache); this.version++; } }
  };
  return svc;
})();

/* --------------------------- Định giá danh mục (dựa trên dữ liệu đã lưu + giá đệm) --------------------------- */
const Holdings = {
  id(accountId, sym) { return `hld_${accountId}_${sym}`; },
  rows(st) {
    return memo(st, 'hold:' + PriceService.version + ':' + DateUtil.today(), () => {
      const acc = Util.byId(st.accounts); const today = DateUtil.today();
      const rows = (st.holdings || []).map(x => {
        const q = PriceService.quote(x.symbol);
        const pr = Portfolio.priceFor(x, q);
        const value = pr.price ? Portfolio.value(x.qty, pr.price) : 0;
        const cost = x.avgCost ? Portfolio.value(x.qty, x.avgCost) : null;
        return { holding: x, account: acc.get(x.accountId) || null, quote: q, price: pr.price, priceSource: pr.source, value, cost, pnl: cost !== null && pr.price ? value - cost : null, fresh: pr.source === 'quote' || pr.source === 'VPS' || pr.source === 'VNDirect' ? PriceService.freshness(q) : pr.source, rightsSuspect: !!(q && q.rightsSuspect),
          // biên an toàn chỉ tính trên giá thị trường/giá nhập tay — không bao giờ trên giá vốn
          val: Portfolio.valuation(x, pr.source === 'cost' || pr.source === 'none' ? null : pr.price, today) };
      });
      rows.sort((a, b) => b.value - a.value || (a.holding.symbol < b.holding.symbol ? -1 : 1));
      return rows;
    });
  },
  total(st) { return Util.sum(this.rows(st), r => r.value); },
  valTotals(st) { return Portfolio.valuationTotals(this.rows(st).map(r => ({ qty: r.holding.qty, val: r.val }))); },
  symbols(st) { return Array.from(new Set((st.holdings || []).filter(x => x.qty > 0).map(x => x.symbol))); }
};

/* --------------------------- Lớp tài sản: dựng danh sách khoản từ dữ liệu thật --------------------------- */
const LayerData = {
  reserveAccounts(st) {
    return new Set((st.goals || []).filter(g => g.type === 'emergency' && g.mode === 'account' && g.accountId && g.status !== 'done').map(g => g.accountId));
  },
  /** Mỗi khoản đúng một lần: tài khoản (số dư sổ) · tài sản nhập tay (giá trị gần nhất) · mã cổ phiếu (KL × giá thị trường). */
  items(st, today) {
    const cur = Ledger.current(st); const ctx = { reserveAccounts: this.reserveAccounts(st) }; const out = [];
    for (const a of st.accounts) {
      const v = cur.balances.get(a.id) || 0; if (!a.active && v === 0) continue;
      const r = Layers.resolve('account', a, ctx);
      out.push({ key: 'acc:' + a.id, kind: 'account', ref: a.id, name: a.name, sub: ACCOUNT_TYPES[a.type] + (a.type === 'investment' ? ' · phần tiền mặt' : ''), ...r, value: v, stale: false, staleNote: '', valuedAt: today, fxGold: false });
    }
    for (const as of st.assets) {
      const v = Ledger.assetValue(as, today); let last = '';
      for (const x of as.history) if (x.date <= today) last = x.date;
      const lim = Layers.STALE_DAYS[as.group] || 90; const age = last ? DateUtil.diffDays(last, today) : null;
      const stale = !last || age > lim;
      const r = Layers.resolve('asset', as, ctx);
      out.push({ key: 'ast:' + as.id, kind: 'asset', ref: as.id, name: as.name, sub: ASSET_GROUPS[as.group] || '', ...r, value: v, stale, staleNote: stale ? (last ? `giá trị cập nhật ${age} ngày trước` : 'chưa có giá trị') : '', valuedAt: last, fxGold: as.group === 'gold' || as.group === 'foreign' });
    }
    for (const row of Holdings.rows(st)) {
      const x = row.holding; if (!x.qty && !row.value) continue;
      let stale = false, note = '', at = '';
      if (row.priceSource === 'cost' || row.priceSource === 'none') { stale = true; note = 'chưa có giá thị trường (đang tính theo giá vốn)'; }
      else if (row.priceSource === 'manual') { at = x.manualPriceAt ? DateUtil.isoDateVN(x.manualPriceAt) : ''; const age = at ? DateUtil.diffDays(at, today) : null; stale = !at || age > 7; note = stale ? (at ? `giá nhập tay ${age} ngày trước` : 'giá nhập tay chưa có ngày') : ''; }
      else { at = row.quote && row.quote.fetchedAt ? DateUtil.isoDateVN(row.quote.fetchedAt) : ''; stale = row.fresh === 'stale'; note = stale ? 'giá chưa cập nhật phiên gần nhất' : ''; }
      const r = Layers.resolve('holding', x, ctx);
      out.push({ key: 'hld:' + x.id, kind: 'holding', ref: x.id, name: x.symbol, sub: `${Money.num(x.qty)} cp${row.account ? ' · ' + row.account.name : ''}`, ...r, value: row.value, stale, staleNote: note, valuedAt: at, fxGold: false });
    }
    return out;
  },
  /** Thu nhập thụ động đã nhận trong năm (giao dịch thu thuộc danh mục đánh dấu "thụ động"). */
  passive(st, today) {
    const cats = new Map(st.categories.filter(c => c.kind === 'income' && c.passive).map(c => [c.id, c]));
    const from = today.slice(0, 4) + '-01-01';
    const txns = st.transactions.filter(t => t.type === 'income' && cats.has(t.categoryId) && t.date >= from && t.date <= today).sort((a, b) => (a.date < b.date ? 1 : -1));
    return { total: Util.sum(txns, t => t.amount), count: txns.length, txns, cats: Array.from(cats.values()), from };
  },
  build(st) {
    const today = DateUtil.today();
    return memo(st, 'layers:' + PriceService.version + ':' + today, () => {
      const cur = Ledger.current(st); const plan = st.settings.layerPlan || Defaults.layerPlan();
      const items = this.items(st, today); const agg = Layers.aggregate(items, { includeUse: plan.includeUse });
      const lastFull = DateUtil.addMonthKey(DateUtil.monthKey(today), -1);
      const spend = Layers.avgMonthlySpend(Ledger.monthly(st, DateUtil.addMonthKey(lastFull, -2), lastFull), 3);
      const debts = st.debts.filter(d => d.active).map(d => ({ name: d.name, balance: cur.debtBalances.get(d.id) || 0, rateType: d.rateType }));
      const rules = Layers.checkRules(agg, plan, { monthlySpend: spend, debts });
      const passive = this.passive(st, today);
      return { today, cur, plan, items, agg, rules, spend, passive, liabilities: cur.liabilities, netWorth: cur.netWorth, matchesLedger: agg.gross === cur.totalAssets };
    });
  }
};

  function startRedirectAuth({ silent = false } = {}) {
    const state = Util.uid('st');
    try { localStorage.setItem(LS_OAUTH, JSON.stringify({ state, profile: Profiles.activeId(), route: location.hash && !/access_token|error=/.test(location.hash) ? location.hash : '#/data', silent, at: Date.now() })); } catch (e) {}
    const p = new URLSearchParams({ client_id: cfg.clientId, redirect_uri: redirectUri(), response_type: 'token', scope: SCOPE, include_granted_scopes: 'true', state });
    if (silent) p.set('prompt', 'none');
    const hint = boundEmail() || cfg.email; if (hint) p.set('login_hint', hint);
    location.assign('https://accounts.google.com/o/oauth2/v2/auth?' + p.toString());
  }
  /** Xử lý kết quả trả về sau khi đăng nhập (nằm trong phần # của URL). Gọi trước khi định tuyến. */
  function handleRedirect() {
    const hash = location.hash.replace(/^#\/?/, '');
    if (!/(^|&)(access_token|error)=/.test(hash)) return null;
    const p = new URLSearchParams(hash);
    let saved = null; try { saved = JSON.parse(localStorage.getItem(LS_OAUTH) || 'null'); } catch (e) {}
    try { localStorage.removeItem(LS_OAUTH); } catch (e) {}
    const route = saved && saved.route ? saved.route : '#/data';
    history.replaceState(null, '', location.pathname + location.search + route);
    if (!saved || p.get('state') !== saved.state) return { ok: false, silent: false, error: 'Phản hồi đăng nhập không khớp phiên yêu cầu — đã bỏ qua để đảm bảo an toàn.' };
    if (p.get('error')) return { ok: false, silent: !!saved.silent, error: p.get('error') };
    const scope = p.get('scope') || '';
    if (scope && !scope.includes('drive.appdata')) return { ok: false, silent: false, error: 'Bạn chưa cấp quyền lưu dữ liệu ứng dụng trên Google Drive.' };
    const prof = saved.profile && Profiles.list().some(x => x.id === saved.profile) ? saved.profile : Profiles.activeId();
    if (prof !== Profiles.activeId()) {
      // Đăng nhập được khởi tạo từ hồ sơ khác → ghi token vào đúng hồ sơ đó rồi mở lại hồ sơ đó
      const key = cfgKey(prof); const c = readCfg(key);
      c.token = p.get('access_token'); c.expiresAt = Date.now() + (Number(p.get('expires_in')) || 3600) * 1000; c.enabled = true;
      try { localStorage.setItem(key, JSON.stringify(c)); } catch (e) {}
      Profiles.select(prof);
      return { ok: true, silent: !!saved.silent, reload: true };
    }
    cfg.token = p.get('access_token'); cfg.expiresAt = Date.now() + (Number(p.get('expires_in')) || 3600) * 1000; cfg.enabled = true; writeCfg();
    return { ok: true, silent: !!saved.silent };
  }

  /* ---------- Đăng nhập: cửa sổ Google Identity Services ---------- */
  let gisPromise = null;
  function loadGis() {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve();
    if (gisPromise) return gisPromise;
    gisPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { gisPromise = null; reject(new Error('Không tải được thư viện đăng nhập Google (cần Internet).')); };
      document.head.appendChild(s);
    });
    return gisPromise;
  }
  function popupAuth() {
    return new Promise((resolve, reject) => {
      if (!(window.google && window.google.accounts && window.google.accounts.oauth2)) { reject(new Error('Thư viện đăng nhập Google chưa sẵn sàng, vui lòng bấm lại sau vài giây.')); return; }
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: cfg.clientId, scope: SCOPE, prompt: (boundEmail() || cfg.email) ? '' : 'consent', login_hint: boundEmail() || cfg.email || undefined,
        callback: resp => {
          if (resp.error) { reject(new Error(resp.error_description || resp.error)); return; }
          cfg.token = resp.access_token; cfg.expiresAt = Date.now() + (Number(resp.expires_in) || 3600) * 1000; cfg.enabled = true; writeCfg(); resolve();
        },
        error_callback: e => reject(new Error(e && e.type === 'popup_closed' ? 'Cửa sổ đăng nhập đã bị đóng.' : e && e.type === 'popup_failed_to_open' ? 'Trình duyệt đã chặn cửa sổ đăng nhập.' : 'Đăng nhập Google thất bại.'))
      });
      client.requestAccessToken();
    });
  }

  /* ---------- Google Drive API ---------- */
  async function api(url, opts = {}) {
    if (!tokenValid()) throw err('AUTH', 'Phiên đăng nhập Google đã hết hạn.');
    let res;
    try { res = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + cfg.token } }); }
    catch (e) { throw err('NETWORK', 'Không kết nối được Google Drive (mất mạng?).'); }
    if (res.status === 401) { cfg.token = null; writeCfg(); throw err('AUTH', 'Phiên đăng nhập Google đã hết hạn hoặc bị thu hồi.'); }
    if (!res.ok) {
      let msg = ''; try { const j = await res.json(); msg = j && j.error && j.error.message || ''; } catch (e) {}
      if (res.status === 403 && /scope|insufficient|permission/i.test(msg)) { cfg.token = null; writeCfg(); throw err('AUTH', 'Thiếu quyền Google Drive: ' + msg); }
      throw err(res.status === 404 ? 'NOTFOUND' : 'HTTP', `Google Drive báo lỗi ${res.status}${msg ? ': ' + msg : ''}`);
    }
    return res;
  }
  async function listFiles() {
    const q = encodeURIComponent(`name='${FILE_NAME}' and trashed=false`);
    const r = await api(`${API}/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime,size,createdTime)&orderBy=createdTime&pageSize=20`);
    return (await r.json()).files || [];
  }
  async function getMeta(id) {
    try { const r = await api(`${API}/files/${encodeURIComponent(id)}?fields=id,modifiedTime,size,trashed`); const j = await r.json(); return j.trashed ? null : j; }
    catch (e) { if (e.code === 'NOTFOUND') return null; throw e; }
  }
  async function download(id) { const r = await api(`${API}/files/${encodeURIComponent(id)}?alt=media`); return r.text(); }
  async function createFile(content) {
    const b = 'finpilot' + Math.random().toString(36).slice(2);
    const meta = { name: FILE_NAME, parents: ['appDataFolder'], mimeType: 'application/json' };
    const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${content}\r\n--${b}--`;
    const r = await api(`${UPLOAD}/files?uploadType=multipart&fields=id,modifiedTime`, { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body });
    return r.json();
  }
  async function updateFile(id, content) {
    const r = await api(`${UPLOAD}/files/${encodeURIComponent(id)}?uploadType=media&fields=id,modifiedTime`, { method: 'PATCH', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: content });
    return r.json();
  }
  async function deleteFile(id) { await api(`${API}/files/${encodeURIComponent(id)}`, { method: 'DELETE' }); }
  async function fetchEmail() {
    const r = await api(`${API}/about?fields=user(emailAddress)`); const j = await r.json();
    const e = normEmail(j.user && j.user.emailAddress);
    if (!e) throw err('IDENTITY', 'Không xác định được tài khoản Google đang đăng nhập.');
    return e;
  }
  /** Bảo đảm token thuộc đúng Gmail đã gắn với hồ sơ — kiểm tra TRƯỚC mọi thao tác đọc/ghi dữ liệu. */
  async function ensureIdentity() {
    if (verifiedToken && verifiedToken === cfg.token) return;
    const email = await fetchEmail();
    const bound = boundEmail();
    if (bound && email !== bound) {
      cfg.token = null; cfg.expiresAt = null; writeCfg(); verifiedToken = null;
      throw err('ACCOUNT', `Hồ sơ "${Profiles.active().name}" đã gắn với tài khoản ${bound}, nhưng bạn vừa đăng nhập ${email}.\n\nĐể không trộn dữ liệu của hai người, ứng dụng đã dừng đồng bộ và KHÔNG gửi dữ liệu nào lên tài khoản ${email}.\n\n• Nếu đây là hồ sơ của bạn: bấm "Đăng nhập lại Google" và chọn đúng ${bound}.\n• Nếu bạn là người khác: vào Cài đặt → Hồ sơ trên thiết bị này, tạo hồ sơ mới cho ${email}.`);
    }
    if (!bound) Profiles.setEmail(Profiles.activeId(), email);
    cfg.email = email; cfg.boundEmail = email; writeCfg();
    verifiedToken = cfg.token;
  }

  function payload(st) {
    const data = { settings: st.settings, tombstones: st.tombstones || [] }; const counts = {};
    for (const c of COLLECTIONS) { data[c] = st[c]; counts[c] = st[c].length; }
    return JSON.stringify({ format: 'finpilot-sync', app: APP_NAME, schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, updatedAt: Util.nowISO(), deviceId: deviceId(), counts, data });
  }
  function parseRemote(text) {
    let obj; try { obj = JSON.parse(text); } catch (e) { throw err('REMOTE', 'Tệp đồng bộ trên Drive bị hỏng (không phải JSON hợp lệ).'); }
    if (!Util.isObj(obj) || obj.format !== 'finpilot-sync' || !Util.isObj(obj.data)) throw err('REMOTE', 'Tệp đồng bộ trên Drive không đúng định dạng FinPilot.');
    if (!Number.isInteger(obj.schemaVersion) || obj.schemaVersion > SCHEMA_VERSION) throw err('VERSION', `Dữ liệu trên Drive dùng cấu trúc phiên bản ${obj.schemaVersion} mới hơn ứng dụng này. Hãy cập nhật FinPilot trên thiết bị này.`);
    for (const c of COLLECTIONS) { if (obj.data[c] === undefined && obj.schemaVersion < (COLL_SINCE[c] || 1)) { obj.data[c] = []; continue; } if (!Array.isArray(obj.data[c])) throw err('REMOTE', `Tệp đồng bộ thiếu danh sách ${COLL_LABELS[c]}.`); }
    return Model.dataset(obj.data);
  }

  /* ---------- Quy trình đồng bộ ---------- */
  async function run(reason) {
    await ensureIdentity();
    const dirty = App.state.meta.revision !== cfg.syncedRevision;
    let syncedRev = App.state.meta.revision;
    const upload = async id => {
      syncedRev = App.state.meta.revision;
      const content = payload(App.state);
      const r = id ? await updateFile(id, content) : await createFile(content);
      cfg.fileId = r.id || id; cfg.lastRemoteModified = r.modifiedTime;
      if (r.modifiedTime && typeof TrustedClock !== 'undefined') TrustedClock.observeServer(r.modifiedTime);
    };
    let files = null, fileId = cfg.fileId || null, remoteMod = null;
    if (fileId) {
      const meta = await getMeta(fileId);
      if (!meta) { fileId = null; cfg.fileId = null; cfg.lastRemoteModified = null; }
      else remoteMod = meta.modifiedTime;
    }
    if (!fileId) {
      files = await listFiles();
      if (files.length) { fileId = files[0].id; remoteMod = files[0].modifiedTime; }
    }
    let uploaded = false, merged = null;
    if (!fileId) {
      await upload(null); uploaded = true;
    } else if (fileId === cfg.fileId && remoteMod === cfg.lastRemoteModified && !(files && files.length > 1)) {
      if (dirty) { await upload(fileId); uploaded = true; }
    } else {
      let remote = parseRemote(await download(fileId));
      if (files && files.length > 1) { // hai thiết bị cùng tạo tệp lần đầu → gộp và dọn tệp thừa
        for (const f of files.slice(1)) { try { const other = parseRemote(await download(f.id)); remote = MergeService.merge(remote, other).data; } catch (e) {} }
      }
      merged = await App.applyRemote(remote);
      syncedRev = App.state.meta.revision;
      cfg.fileId = fileId;
      if (merged.remoteNeedsUpdate || (files && files.length > 1)) {
        await upload(fileId); uploaded = true;
        if (files && files.length > 1) for (const f of files.slice(1)) { try { await deleteFile(f.id); } catch (e) {} }
      } else cfg.lastRemoteModified = remoteMod;
    }
    cfg.syncedRevision = syncedRev;
    cfg.lastSyncAt = Util.nowISO(); cfg.lastError = null;
    writeCfg();
    return { uploaded, merged, reason };
  }

  async function syncNow(reason = 'manual') {
    if (!cfg.enabled || !cfg.clientId) return null;
    if (!supported()) { setStatus('error', 'Cần mở ứng dụng qua địa chỉ https để đồng bộ'); return null; }
    if (!navigator.onLine) { setStatus('offline', 'Ngoại tuyến — sẽ đồng bộ khi có mạng'); return null; }
    if (!tokenValid()) { setStatus('auth', 'Cần đăng nhập lại Google'); return null; }
    if (!App.canSync()) { setStatus('error', 'Tạm dừng đồng bộ vì dữ liệu cục bộ đang bị khóa ghi'); return null; }
    if (syncing) { pending = true; return null; }
    syncing = true; setStatus('busy', 'Đang đồng bộ…');
    let result = null;
    try {
      result = await run(reason);
      const m = result.merged;
      setStatus('ok', 'Đã đồng bộ ' + DateUtil.timeVN());
      if (m && m.localChanged && reason !== 'poll') Toast.show(`Đã nhận dữ liệu từ thiết bị khác: ${m.stats.added} mới, ${m.stats.updated} cập nhật, ${m.stats.deleted} xóa.`, { type: 'info' });
      else if (m && m.localChanged) Toast.show('Đã cập nhật dữ liệu mới từ thiết bị khác.', { type: 'info' });
    } catch (e) {
      cfg.lastError = e.message; writeCfg();
      if (e.code === 'AUTH') setStatus('auth', 'Cần đăng nhập lại Google');
      else if (e.code === 'ACCOUNT') { setStatus('auth', 'Sai tài khoản Google — đã chặn đồng bộ'); Modal.alert({ title: 'Đăng nhập sai tài khoản Google', message: e.message, tone: 'danger' }); return null; }
      else if (e.code === 'NETWORK') setStatus('offline', 'Mất kết nối — sẽ thử lại');
      else setStatus('error', 'Lỗi đồng bộ: ' + e.message);
      if (reason === 'manual' || reason === 'connect') Toast.show(e.message, { type: 'error' });
    } finally {
      syncing = false;
      if (pending) { pending = false; schedule(1500); }
    }
    return result;
  }
  function schedule(ms = 2500) {
    if (!cfg.enabled) return;
    clearTimeout(timer); timer = setTimeout(() => syncNow('auto'), ms);
  }

  return {
    status, FILE_NAME, SCOPE,
    get cfg() { return cfg; },
    supported, redirectUri, tokenValid, isStandaloneIOS, handleRedirect, loadGis,
    onStatus(fn) { listeners.push(fn); },
    isEnabled() { return !!cfg.enabled && !!cfg.clientId; },
    isSyncing() { return syncing; },
    setClientId(id) {
      const v = String(id || '').trim();
      if (!/^[0-9]+-[a-z0-9_]+\.apps\.googleusercontent\.com$/i.test(v)) throw new AppError('Client ID không đúng định dạng (dạng 1234…-abc….apps.googleusercontent.com).');
      if (v !== cfg.clientId) { cfg.clientId = v; cfg.token = null; cfg.expiresAt = null; cfg.fileId = null; cfg.lastRemoteModified = null; }
      writeCfg();
    },
    setAuthMode(m) { cfg.authMode = m === 'popup' ? 'popup' : 'redirect'; writeCfg(); },
    authMode() { return cfg.authMode === 'popup' ? 'popup' : 'redirect'; },
    async connect() {
      if (!cfg.clientId) throw new AppError('Vui lòng nhập OAuth Client ID trước.');
      if (!supported()) throw new AppError('Đăng nhập Google chỉ hoạt động khi ứng dụng được mở qua địa chỉ https (ví dụ GitHub Pages).');
      if (!navigator.onLine) throw new AppError('Thiết bị đang ngoại tuyến.');
      const st = App.state;
      if (!boundEmail() && st && (st.transactions.length || st.accounts.length)) {
        const ok = await Modal.confirm({ title: 'Gắn hồ sơ với tài khoản Google', message: `Hồ sơ "${Profiles.active().name}" đang có ${st.accounts.length} tài khoản và ${st.transactions.length} giao dịch.\n\nKhi kết nối, toàn bộ dữ liệu này sẽ được đưa lên Google Drive của tài khoản bạn sắp đăng nhập, và hồ sơ sẽ gắn cố định với tài khoản đó.\n\nNếu dữ liệu này KHÔNG phải của bạn, hãy bấm Hủy và tạo hồ sơ mới (Cài đặt → Hồ sơ trên thiết bị này).`, confirmText: 'Đây là dữ liệu của tôi — kết nối' });
        if (!ok) return;
      }
      cfg.enabled = true; writeCfg();
      if (this.authMode() === 'popup') { await popupAuth(); await syncNow('connect'); startPolling(); }
      else { await App.flush(); startRedirectAuth({ silent: false }); }
    },
    async reconnect() { return this.connect(); },
    /** Khi mở app: nếu token hết hạn và dùng chế độ chuyển trang → thử gia hạn im lặng (không hỏi lại). */
    async autoStart() {
      if (!cfg.enabled || !cfg.clientId) { setStatus('off', 'Chưa bật đồng bộ'); return; }
      startPolling();
      if (!supported()) { setStatus('error', 'Cần mở qua https để đồng bộ'); return; }
      if (tokenValid()) { syncNow('open'); return; }
      if (this.authMode() === 'redirect' && navigator.onLine && (boundEmail() || cfg.email)) {
        let tried = 0; try { tried = Number(sessionStorage.getItem(SS_SILENT) || 0); } catch (e) {}
        if (Date.now() - tried > 5 * 60000) {
          try { sessionStorage.setItem(SS_SILENT, String(Date.now())); } catch (e) {}
          await App.flush(); startRedirectAuth({ silent: true }); return;
        }
      }
      setStatus('auth', 'Cần đăng nhập lại Google');
    },
    afterRedirect(res) {
      if (!res || res.reload) return;
      if (res.ok) { setStatus('idle', 'Đã đăng nhập Google'); }
      else if (res.silent) setStatus('auth', 'Cần đăng nhập lại Google');
      else { setStatus('error', 'Đăng nhập thất bại'); Toast.show('Đăng nhập Google thất bại: ' + res.error, { type: 'error', timeout: 8000 }); }
    },
    syncNow, schedule, boundEmail,
    disconnect({ keepConfig = true } = {}) {
      const id = cfg.clientId, mode = cfg.authMode, dev = cfg.deviceId, be = cfg.boundEmail;
      cfg = keepConfig ? { clientId: id, authMode: mode, deviceId: dev, boundEmail: be } : { deviceId: dev, boundEmail: be };
      verifiedToken = null;
      writeCfg(); stopPolling(); setStatus('off', 'Chưa bật đồng bộ');
    },
    async deleteRemote() {
      const files = cfg.fileId ? [{ id: cfg.fileId }] : await listFiles();
      for (const f of files) await deleteFile(f.id);
      cfg.fileId = null; cfg.lastRemoteModified = null; writeCfg();
    }
  };
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(() => { if (document.visibilityState === 'visible' && cfg.enabled && !syncing && tokenValid()) syncNow('poll'); }, 90000);
  }
  function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
})();

/* ==========================================================================
   UI — thông báo, hộp thoại, biểu mẫu, biểu đồ SVG, thành phần dùng chung
   ========================================================================== */
const Toast = {
  show(msg, { type = 'info', action = null, timeout = 4200 } = {}) {
    const root = document.getElementById('toast-root'); if (!root) return () => {};
    let t;
    const remove = () => { clearTimeout(t); el.classList.add('out'); setTimeout(() => el.remove(), 200); };
    const el = h('div', { class: 'toast toast-' + type, role: type === 'error' ? 'alert' : 'status' },
      h('span', { class: 'toast-msg', text: msg }),
      action ? h('button', { class: 'toast-action', type: 'button', onclick: () => { remove(); action.fn(); } }, action.label) : null,
      h('button', { class: 'toast-close', type: 'button', 'aria-label': 'Đóng thông báo', onclick: remove }, Icon('x', 14)));
    root.append(el);
    while (root.children.length > 4) root.firstChild.remove();
    t = setTimeout(remove, action ? Math.max(timeout, 8000) : (type === 'error' ? Math.max(timeout, 7000) : timeout));
    return remove;
  }
};

const Modal = {
  stack: [],
  open({ title, body, footer = null, size = 'md', onClose = null, dismissible = true }) {
    const root = document.getElementById('modal-root');
    const prevFocus = document.activeElement;
    let closed = false;
    const entry = { dismissible, close: () => close() };
    const backdrop = h('div', { class: 'modal-backdrop' });
    const dialog = h('div', { class: 'modal modal-' + size, role: 'dialog', 'aria-modal': 'true', 'aria-label': title, tabindex: '-1' });
    const bodyEl = h('div', { class: 'modal-body' }, body);
    dialog.append(h('div', { class: 'modal-head' }, h('h2', { text: title }), h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Đóng', onclick: () => { if (dismissible) close(); } }, Icon('x'))), bodyEl);
    if (footer) dialog.append(h('div', { class: 'modal-foot' }, footer));
    backdrop.append(dialog);
    backdrop.addEventListener('mousedown', e => { if (e.target === backdrop && dismissible) close(); });
    root.append(backdrop);
    this.stack.push(entry);
    document.body.classList.add('modal-open');
    setTimeout(() => {
      if (dialog.contains(document.activeElement) && document.activeElement !== dialog) return;
      const f = dialog.querySelector('[autofocus]') || (window.matchMedia('(pointer:fine)').matches ? dialog.querySelector('input:not([type=hidden]):not([type=checkbox]):not([disabled]):not(.date-picker-native),select,textarea') : null);
      (f || dialog).focus({ preventScroll: true });
    }, 30);
    function close() {
      if (closed) return; closed = true;
      backdrop.remove();
      const i = Modal.stack.indexOf(entry); if (i >= 0) Modal.stack.splice(i, 1);
      if (!Modal.stack.length) document.body.classList.remove('modal-open');
      if (onClose) onClose();
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
    }
    return { close, dialog, body: bodyEl };
  },
  closeTop() { const t = this.stack[this.stack.length - 1]; if (t && t.dismissible) t.close(); },
  closeAll() { while (this.stack.length) this.stack[this.stack.length - 1].close(); },
  confirm({ title = 'Xác nhận', message, confirmText = 'Đồng ý', cancelText = 'Hủy', danger = false, details = null }) {
    return new Promise(resolve => {
      let done = false, m;

}

  /** Đọc & kiểm tra sơ bộ các trường giao dịch. */

  openTxn({ txn = null, preset = {} } = {}) {

    const againBtn = editing ? null : h('button', { class: 'btn', type: 'button' }, 'Lưu & thêm tiếp');
    let m;
    const submit = async (again) => {
      F.clearErrors(form);
      const { obj, errs } = this.txnCollect(form, type);
      const now = Util.nowISO();
      const clean = Model.transaction({ ...obj, id: editing ? txn.id : Util.uid('txn'), createdAt: editing ? txn.createdAt : now, updatedAt: now, recurringId: editing ? txn.recurringId : '', recurringDate: editing ? txn.recurringDate : '', allocationId: editing && obj.goalId === txn.goalId ? txn.allocationId : '', archivedGoalId: editing ? txn.archivedGoalId : '' });

        }, { undoLabel: editing ? 'Đã cập nhật giao dịch' : null });
        const msg = (editing ? 'Đã cập nhật giao dịch' : 'Đã thêm giao dịch') + (res.durable ? '' : ' (chưa lưu bền vững)');
        Toast.show(msg, { type: res.durable ? 'success' : 'warn', action: editing ? { label: 'Hoàn tác', fn: () => App.undo() } : null });
        if (again) {
          raw.amount = ''; raw.principal = ''; raw.interest = ''; raw.payee = ''; raw.note = ''; raw.tags = ''; raw.reconciled = false;

    };

  },
  async deleteTxn(txn) {
    const L = lookups(App.state); const info = TxnView.info(txn, L);
    const ok = await Modal.confirm({ title: 'Xóa giao dịch?', message: `${DateUtil.toVN(txn.date)} · ${info.title}\n${TXN_TYPES[txn.type].label}: ${Money.format(txn.amount)}\n\nSố dư, báo cáo và ngân sách sẽ được tính lại.`, confirmText: 'Xóa', danger: true });
    if (!ok) return;

      const res = await App.commit('Xóa giao dịch', d => {
        const i = d.transactions.findIndex(x => x.id === txn.id); if (i < 0) throw new AppError('Giao dịch không còn tồn tại.');

Pages.filterTxns = function (st, f) {
  const L = lookups(st);
  const q = Util.norm(f.q);
  let list = Ledger.sortedTxns(st);
  list = list.filter(t => {
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (f.type && t.type !== f.type) return false;
    if (f.accountId && t.accountId !== f.accountId && t.toAccountId !== f.accountId) return false;
    if (f.categoryId && !(t.categoryId === f.categoryId || (f.categoryId === INTEREST_CAT_ID && t.type === 'debt_payment' && t.interest > 0))) return false;
    if (q) {
      const hay = Util.norm([t.payee, t.note, (t.tags || []).join(' '), (L.cat.get(t.categoryId) || {}).name, (L.acc.get(t.accountId) || {}).name, (L.acc.get(t.toAccountId) || {}).name, (L.debt.get(t.debtId) || {}).name, TXN_TYPES[t.type].label, String(t.amount), Money.num(t.amount)].join(' '));
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const s = f.sort || 'date_desc';
  list = list.slice();

Pages.importFile = function (file) {

  reader.onload = () => {
    const res = ImportExport.parse(String(reader.result));

    Pages.importPreview(res, file.name);

  reader.readAsText(file, 'utf-8');

  shareText(s) { return s.fixed ? Money.format(s.fixed) : Util.fmtPct((s.bp || 0) / 100, 2); },
  chips(codes, selected, onPick) {
    const wrap = h('div', { class: 'chip-row', role: 'radiogroup' });
    const draw = cur => wrap.replaceChildren(...codes.map(([k, l]) => h('button', { type: 'button', class: 'chip-btn' + (k === cur ? ' active' : ''), role: 'radio', 'aria-checked': String(k === cur), onclick: () => { draw(k); onPick(k); } }, l)));
    draw(selected);
    return wrap;
  },
  noteInput(ph = 'Ghi chú (không bắt buộc, tối đa 140 ký tự)') { return h('input', { type: 'text', maxlength: '140', placeholder: ph, class: 'note-input', 'aria-label': 'Ghi chú lý do' }); },
  /** Toast mềm cho các thông báo "đã giữ nguyên"/"đã tạo yêu cầu" (không phải lỗi). */
  info(msg) { Toast.show(msg, { type: 'info', timeout: 6500 }); }
};

/* ---------------------- Hộp thoại khi thao tác nới lỏng cam kết ---------------------- */
Pages.disciplinePrompt = function (info) {
  return new Promise(resolve => {
    const st = App.state; const viol = info.viol || [];
    let routes = viol.reduce((acc, x) => acc.filter(r => Discipline.routes(x).includes(r)), ['fix', 'withdrawn', 'emg', 'request']);
    if (viol.length > 1) routes = routes.filter(r => r !== 'request');
    const emgGoal = viol.length && viol.every(x => { const g = st.goals.find(y => y.id === x.goalId); return g && g.type === 'emergency'; });
    if (!emgGoal) routes = routes.filter(r => r !== 'emg');
    let done = false, m;
    const finish = v => { if (done) return; done = true; m.close(); resolve(v); };
    const commit = Discipline.commitmentText(st);
    const body = h('div', { class: 'disc-prompt' },
      h('ul', { class: 'disc-viol' }, viol.slice(0, 5).map(x => h('li', { text: Discipline.describe(st, x) }))),
      commit ? h('blockquote', { class: 'commit-quote' }, '“' + commit + '”', h('div', { class: 'tiny muted', text: 'Lời cam kết của bạn khi thiết lập' })) : null);
    const section = (title, codes, btnText, makeChoice, tone = '') => {
      let code = codes[0][0]; const note = DiscUI.noteInput();
      return h('div', { class: 'disc-sec ' + tone }, h('div', { class: 'disc-sec-title', text: title }), DiscUI.chips(codes, code, k => { code = k; }), note,
        h('button', { class: 'btn ' + (tone === 'primary' ? 'btn-primary' : ''), type: 'button', onclick: () => finish(makeChoice(code, note.value.trim())) }, btnText));
    };
    if (routes.includes('fix')) body.append(h('div', { class: 'disc-sec' }, h('div', { class: 'disc-sec-title', text: 'Tôi nhập nhầm, cần sửa lại' }), h('p', { class: 'small muted', text: 'Ghi nhận đúng sự thật luôn được phép. Lần sửa này được đếm trên thẻ Kỷ luật.' }), h('button', { class: 'btn', type: 'button', onclick: () => finish({ reason: 'fix' }) }, 'Tôi nhập nhầm, sửa lại')));
    if (routes.includes('withdrawn')) body.append(section('Tiền này đã được rút ra thật', EMG_AND_HF(), 'Ghi nhận đã rút', (code, note) => ({ reason: 'withdrawn', code, note })));
    if (routes.includes('emg')) body.append(section('Khẩn cấp — rút quỹ dự phòng (không phải chờ)', Discipline.EMG_CODES, 'Rút ngay (khẩn cấp)', (code, note) => ({ reason: 'emg', code, note })));
    if (routes.includes('request')) body.append(section('Muốn chi — tạo yêu cầu chờ 72 giờ', Discipline.HF_CODES, 'Tạo yêu cầu (chờ 72 giờ)', (code, note) => ({ request: true, code, note }), 'primary'));
    if (!routes.length) body.append(C.callout('info', 'Hãy thực hiện từng thay đổi riêng lẻ để chọn cách xử lý phù hợp.'));
    m = Modal.open({ title: 'Thao tác này nới lỏng cam kết của bạn', body, size: 'md', footer: [h('button', { class: 'btn btn-ghost', type: 'button', autofocus: true, onclick: () => finish(null) }, 'Giữ nguyên')], onClose: () => { if (!done) { done = true; resolve(null); } } });
  });
};
function EMG_AND_HF() { return Discipline.EMG_CODES.filter(c => c[0] !== 'other').concat(Discipline.HF_CODES); }

Pages.requestFromBlock = function (info, choice) {
  const x = info.viol[0]; const eff = Discipline.effectiveAtISO(App.state);
  let payload;
  if (x.kind === 'goalWithdraw') payload = { type: 'txn', op: 'add', txn: x.txn };
  else if (x.kind === 'goalDelete') payload = { type: 'deleteGoal', goalId: x.goalId, name: x.goal ? x.goal.name : '' };
  else if (x.kind === 'goalLoosen') payload = { type: 'goal', goal: x.newGoal, baseUpdatedAt: x.baseUpdatedAt || '' };
  return {
    mutate: d => { const ev = Discipline.newEvent('request', { cls: 'hf', refId: x.goalId || '', amount: x.amount || 0, effectiveAt: eff, payload }, d); d.commitLog.push(ev); if (choice.code || choice.note) Discipline.addNote(d, ev.id, choice.code || '', choice.note || ''); },
    message: `Đã tạo yêu cầu: ${Discipline.describe(App.state, x)}. Có thể thực hiện từ ${DateUtil.whenVN(eff)} — khi đó bạn cần xác nhận lại một lần nữa. Chưa có thay đổi nào được ghi.`
  };
};

/* ---------------------- Hành động trên nhật ký cam kết ---------------------- */
const DiscActions = {
  async createRequest(payload, { amount = 0, refId = '', code = '', note = '' } = {}) {
    const eff = Discipline.effectiveAtISO(App.state);
    await App.commit('Tạo yêu cầu nới lỏng', d => { const ev = Discipline.newEvent('request', { cls: 'hf', refId, amount, effectiveAt: eff, payload }, d); d.commitLog.push(ev); if (code || note) Discipline.addNote(d, ev.id, code, note); }, { noPrompt: true });
    Toast.show(`Đã tạo yêu cầu. Hiệu lực từ ${DateUtil.whenVN(eff)} — khi đó cần xác nhận lại. Hủy bất cứ lúc nào chỉ với 1 chạm.`, { type: 'success', timeout: 8000 });
  },
  async cancel(r) {
    try { await App.commit('Hủy yêu cầu', d => d.commitLog.push(Discipline.newEvent('cancel', { refId: r.ev.id, amount: r.ev.amount }, d)), { noPrompt: true }); Toast.show(r.ev.amount > 0 ? `Bạn vừa giữ lại ${Money.format(r.ev.amount)} cho tương lai.` : 'Đã hủy yêu cầu — cam kết giữ nguyên.', { type: 'success' }); }
    catch (e) { Toast.show(e.message, { type: 'error' }); }
  },
  async execute(r) {
    const v = Discipline.view(App.state);
    const cur = v.requests.find(x => x.ev.id === r.ev.id);
    if (!cur || cur.status !== 'ripe') return Toast.show(v.skewBad ? 'Đồng hồ thiết bị lệch quá 10 phút so với Google — hãy bật "Đặt giờ tự động" rồi đồng bộ lại.' : 'Yêu cầu chưa đến hạn hoặc không còn hiệu lực.', { type: 'warn' });
    const p = r.ev.payload || {};
    const ok = await Modal.confirm({ title: 'Vẫn muốn thực hiện?', message: `${Pages.requestText(App.state, r)}\n\nBạn đã chờ đủ thời gian. Đây là lần xác nhận cuối cùng.`, confirmText: 'Vẫn muốn thực hiện', cancelText: 'Để sau' });
    if (!ok) return;
    try {
      const now = Util.nowISO(); const today = DateUtil.today();
      await App.commit('Thực hiện yêu cầu', d => {
        d.commitLog.push(Discipline.newEvent('confirm', { refId: r.ev.id, amount: r.ev.amount }, d));
        if (p.type === 'txn' && p.txn) {
          const id = 'txn_req_' + r.ev.id;
          if (!d.transactions.some(t => t.id === id)) {
            const t = Model.transaction({ ...p.txn, id, date: today, createdAt: now, updatedAt: now });
            const e = Validation.transaction(t, d); if (Object.keys(e).length) throw new AppError('Không thể tạo giao dịch: ' + Validation.first(e));
            d.transactions.push(t);
          }
        } else if (p.type === 'deleteGoal') {
          d.goals = d.goals.filter(g => g.id !== p.goalId);
          for (const t of d.transactions) if (t.goalId === p.goalId) { t.archivedGoalId = p.goalId; t.goalId = ''; t.goalDir = ''; }
        } else if (p.type === 'goal' && p.goal) {
          const i = d.goals.findIndex(g => g.id === p.goal.id);
          if (i >= 0 && p.baseUpdatedAt && d.goals[i].updatedAt !== p.baseUpdatedAt) throw new AppError('Mục tiêu đã được sửa sau khi tạo yêu cầu — để không ghi đè thay đổi mới, hãy hủy yêu cầu này và tạo lại.');
          if (i >= 0) d.goals[i] = Model.goal({ ...p.goal, updatedAt: now });
        }
      }, { discipline: { reason: 'request', reqId: r.ev.id }, noPrompt: true, noAlloc: true });
      Toast.show('Đã thực hiện yêu cầu.', { type: 'success' });
    } catch (e) { Modal.alert({ title: 'Không thực hiện được', message: e.message, tone: 'danger' }); }
  },
  async saveConfig(newCfg, { commitment = null, setup = false } = {}) {
    const st = App.state; const v = Discipline.view(st);
    const reasons = setup ? [] : RuleDiff.loosening(v.cfg, newCfg);
    const cls = setup ? 'setup' : reasons.length ? 'trial' : 'tighten';
    if (reasons.length && v.enforce) {
      const choice = await Pages.reasonSheet('Thay đổi này nới lỏng cam kết', reasons, Discipline.HF_CODES, 'Tạo yêu cầu (chờ 72 giờ)');
      if (!choice) return false;
      await this.createRequest({ type: 'config', config: newCfg, baseVersion: v.version }, { code: choice.code, note: choice.note });
      if (commitment !== null && commitment !== Discipline.commitmentText(st)) await App.commit('Lưu lời cam kết', d => Discipline.addNote(d, Discipline.newEvent('audit', {}, d).id, '', commitment, 'commitment'), { noPrompt: true });
      return true;
    }
    await App.commit(setup ? 'Thiết lập kỷ luật' : 'Cập nhật quy tắc', d => {
      const ev = Discipline.newEvent('set', { cls, payload: { type: 'config', config: newCfg, baseVersion: v.version } }, d); d.commitLog.push(ev);
      if (setup) d.commitLog.push(Discipline.newEvent('arm', {}, d));
      if (commitment !== null && commitment !== Discipline.commitmentText(st)) Discipline.addNote(d, ev.id, '', commitment, 'commitment');
    }, { noPrompt: true });
    Toast.show(setup ? 'Đã bật kỷ luật — 7 ngày chạy thử bắt đầu từ bây giờ.' : reasons.length ? 'Đã cập nhật (đang chạy thử nên áp dụng ngay).' : 'Đã siết chặt quy tắc — có hiệu lực ngay.', { type: 'success' });
    return true;
  },
  async confirmLine(alcInfo, line, on) {
    const st = App.state; const inc = alcInfo.income; const s = line.step;
    try {
      if (on) {
        const g = s.goalId ? st.goals.find(x => x.id === s.goalId) : null;
        const now = Util.nowISO();
        const t = Model.transaction({ id: line.txnId, type: 'transfer', date: DateUtil.today(), amount: line.amount, accountId: inc.accountId, toAccountId: s.toAccountId, goalId: g && g.mode === 'transfer' ? g.id : '', goalDir: 'in', allocationId: alcInfo.alc.id, payee: 'Trả cho mình trước', note: `Phân bổ ${alcInfo.alc.ruleName} ${DateUtil.toVN(alcInfo.alc.date)}`, createdAt: now, updatedAt: now });
        const e = Validation.transaction(t, st); if (Object.keys(e).length) throw new AppError('Không ghi được lệnh chuyển: ' + Validation.first(e));
        await App.commit('Xác nhận đã chuyển', d => { const i = d.transactions.findIndex(x => x.id === t.id); if (i >= 0) d.transactions[i] = { ...d.transactions[i], amount: line.amount, updatedAt: now }; else d.transactions.push(t); }, { silentAlloc: true });
      } else {
        await App.commit('Bỏ xác nhận đã chuyển', d => { d.transactions = d.transactions.filter(x => x.id !== line.txnId); }, { silentAlloc: true });
      }
      return true;
    } catch (e) { Toast.show(e.message, { type: 'error' }); return false; }
  },
  async releaseLine(alcInfo, line) {
    const st = App.state; const v = Discipline.view(st);
    const g = line.step.goalId ? st.goals.find(x => x.id === line.step.goalId) : null;
    const payload = { type: 'release', alc: alcInfo.alc.id, key: line.key, amount: line.open };
    if (!v.enforce) {
      if (!(await Modal.confirm({ title: 'Không chuyển dòng này?', message: `${DiscUI.stepLabel(st, line.step)} · ${Money.format(line.open)} sẽ trở lại "Được phép chi".${v.inTrial ? '\n(Đang chạy thử: áp dụng ngay, được ghi để xem trước.)' : ''}`, confirmText: 'Không chuyển' }))) return;
      await App.commit('Bỏ qua dòng phân bổ', d => d.commitLog.push(Discipline.newEvent('release', { cls: 'trial', amount: line.open, payload }, d)), { noPrompt: true, silentAlloc: true });
      return;
    }
    const emg = g && g.type === 'emergency';
    const choice = await Pages.reasonSheet(`Không chuyển ${Money.format(line.open)} vào ${DiscUI.stepLabel(st, line.step)}?`, ['Khoản này sẽ trở lại "Được phép chi".'], emg ? Discipline.EMG_CODES : Discipline.HF_CODES, emg ? 'Bỏ qua ngay (khẩn cấp)' : 'Tạo yêu cầu (chờ 72 giờ)');
    if (!choice) return;
    if (emg) await App.commit('Bỏ qua dòng phân bổ (khẩn cấp)', d => { const ev = Discipline.newEvent('release', { cls: 'emg', amount: line.open, payload }, d); d.commitLog.push(ev); if (choice.code || choice.note) Discipline.addNote(d, ev.id, choice.code, choice.note); }, { noPrompt: true, silentAlloc: true });
    else await this.createRequest(payload, { amount: line.open, refId: alcInfo.alc.id, code: choice.code, note: choice.note });
  }
};

/** Bảng chọn lý do dùng chung → Promise<{code, note}|null>. */
Pages.reasonSheet = function (title, reasons, codes, btnText) {
  return new Promise(resolve => {
    let done = false, m, code = codes[0][0];
    const finish = v => { if (done) return; done = true; m.close(); resolve(v); };
    const note = DiscUI.noteInput(); const commit = Discipline.commitmentText(App.state);
    const body = h('div', { class: 'disc-prompt' },
      reasons.length ? h('ul', { class: 'disc-viol' }, reasons.map(r => h('li', { text: r }))) : null,
      commit ? h('blockquote', { class: 'commit-quote' }, '“' + commit + '”', h('div', { class: 'tiny muted', text: 'Lời cam kết của bạn khi thiết lập' })) : null,
      h('div', { class: 'disc-sec-title', text: 'Lý do' }), DiscUI.chips(codes, code, k => { code = k; }), note);
    m = Modal.open({ title, body, size: 'sm', footer: [h('button', { class: 'btn btn-ghost', type: 'button', autofocus: true, onclick: () => finish(null) }, 'Giữ nguyên'), h('button', { class: 'btn btn-primary', type: 'button', onclick: () => finish({ code, note: note.value.trim() }) }, btnText)], onClose: () => { if (!done) { done = true; resolve(null); } } });
  });
};

Pages.requestText = function (st, r) {
  const p = r.ev.payload || {};
  if (p.type === 'config') { const reasons = RuleDiff.loosening(Discipline.view(st).cfg, p.config); return 'Đổi quy tắc phân bổ' + (reasons.length ? ': ' + reasons.join(', ') : ''); }
  if (p.type === 'exit') return 'Tắt chế độ kỷ luật';
  if (p.type === 'release') { const a = (st.allocations || []).find(x => x.id === p.alc); const s = a && a.steps.find(x => x.key === p.key); return `Không chuyển ${Money.format(p.amount || r.ev.amount)} vào ${s ? DiscUI.stepLabel(st, s) : 'một bậc'}${a ? ' (' + a.ruleName + ' ' + DateUtil.toVN(a.date) + ')' : ''}`; }
  if (p.type === 'txn' && p.txn) return `Rút ${Money.format(p.txn.amount)} ${p.txn.goalId ? 'khỏi quỹ ' + DiscUI.goalName(st, p.txn.goalId) : 'từ ' + DiscUI.accName(st, p.txn.accountId)} → ${DiscUI.accName(st, p.txn.toAccountId)}`;
  if (p.type === 'deleteGoal') return `Xóa mục tiêu "${p.name || p.goalId}"`;
  if (p.type === 'goal' && p.goal) return `Thay đổi mục tiêu "${p.goal.name}" (số tiền ${Money.format(p.goal.target)}, ${GOAL_STATUS[p.goal.status] || ''})`;
  return 'Yêu cầu nới lỏng';
};

/* ---------------------- Sheet "Trả cho mình trước" ---------------------- */
Pages.allocSheet = function (alcId, { direct = false } = {}) {
  const st0 = App.state; const a0 = (st0.allocations || []).find(x => x.id === alcId); if (!a0) return;
  let phase = direct || Discipline.allocInfo(st0, a0).lines.some(l => l.status !== 'open') ? 2 : 1;
  const box = h('div', { class: 'alloc-sheet' });
  const draw = () => {
    const st = App.state; const alc = (st.allocations || []).find(x => x.id === alcId); if (!alc) { m.close(); return; }
    const info = Discipline.allocInfo(st, alc); const isBonus = alc.ruleId === 'bonus';
    const head = h('div', { class: 'alloc-head' },
      h('div', { class: 'small muted', text: `${alc.ruleName} · ${DateUtil.toVN(alc.date)} · ${info.income ? DiscUI.accName(st, info.income.accountId) : ''}` }),
      h('div', { class: 'alloc-total money', text: Money.format(alc.incomeAmount) }));
    const kids = [head];
    if (info.orphan) kids.push(C.callout('alert', 'Khoản thu gốc đã bị xóa — phân bổ này không còn giữ tiền.', 'warn'));
    else if (info.revised) kids.push(C.callout('alert', `Khoản thu đã đổi thành ${Money.format(info.income.amount)}. Mở trang Kỷ luật để cập nhật phân bổ theo số mới.`, 'warn'));
    if (phase === 1) {
      if (isBonus) kids.push(h('div', { class: 'alloc-free' }, h('div', { class: 'small', text: 'Phần thưởng của bạn' }), h('div', { class: 'money big', text: Money.format(info.spend) }), h('div', { class: 'small', text: 'tiêu thoải mái, không áy náy' })));
      kids.push(h('div', { class: 'alloc-flow' }, info.lines.map(l => {
        const capped = Alloc.share(alc.incomeAmount, l.step) > l.amount;
        return h('div', { class: 'alloc-row locked' }, h('span', { class: 'nm', text: DiscUI.stepLabel(st, l.step) }), h('span', { class: 'small muted', text: DiscUI.shareText(l.step) + (capped ? ' · chạm trần, phần dư chảy xuống' : '') }), h('span', { class: 'money num', text: Money.format(l.amount) }));
      }), h('div', { class: 'alloc-row spend' }, h('span', { class: 'nm', text: 'Được phép chi từ khoản này' }), h('span', {}), h('span', { class: 'money num', text: Money.format(info.spend) }))));
      kids.push(h('button', { class: 'btn btn-primary btn-lg btn-block', type: 'button', onclick: () => { phase = 2; draw(); } }, Icon('lock', 18), `Khóa ${Money.format(info.locked)} cho tương lai`));
      kids.push(h('p', { class: 'tiny muted center', text: 'Khoản khóa là "khóa ảo": tiền vẫn ở ngân hàng của bạn. Bước tiếp theo: chuyển thật trong app ngân hàng rồi đánh dấu "Đã chuyển".' }));
    } else {
      kids.push(h('div', { class: 'small', text: 'Chuyển thật trong app ngân hàng, rồi đánh dấu từng dòng. Có thể xác nhận từng phần.' }));
      kids.push(h('div', { class: 'xfer-list' }, info.lines.map(l => {
        const chk = h('input', { type: 'checkbox', checked: l.status === 'done', disabled: l.status === 'released' || info.orphan, 'aria-label': 'Đã chuyển ' + DiscUI.stepLabel(st, l.step) });
        chk.addEventListener('change', async () => { chk.disabled = true; await DiscActions.confirmLine(Discipline.allocInfo(App.state, (App.state.allocations || []).find(x => x.id === alcId)), l, chk.checked); draw(); });
        const copy = C.btn('Sao chép số tiền', async () => { try { await navigator.clipboard.writeText(String(l.open || l.amount)); Toast.show('Đã sao chép ' + Money.num(l.open || l.amount), { type: 'success', timeout: 1800 }); } catch (e) { Toast.show(Money.num(l.open || l.amount), { type: 'info' }); } }, { icon: 'copy', cls: 'btn-sm btn-ghost' });
        const stTxt = { open: 'Chờ chuyển', partial: `Đã chuyển ${Money.format(l.doneAmt)} / ${Money.format(l.amount)}`, done: 'Đã chuyển', released: 'Đã bỏ qua (được duyệt)' }[l.status];
        return h('div', { class: 'xfer ' + l.status },
          h('label', { class: 'xfer-main' }, chk, h('span', { class: 'grow' }, h('span', { class: 'cell-main', text: DiscUI.stepLabel(st, l.step) }), h('span', { class: 'cell-sub', text: `→ ${DiscUI.accName(st, l.step.toAccountId)} · ${stTxt}` })), h('span', { class: 'money num', text: Money.format(l.amount) })),
          l.status === 'open' || l.status === 'partial' ? h('div', { class: 'xfer-actions' }, copy, C.btn('Không chuyển dòng này', () => DiscActions.releaseLine(Discipline.allocInfo(App.state, alc), l).then(draw), { cls: 'btn-sm btn-ghost' })) : null);
      })));
      const sp = Discipline.spendable(st);
      kids.push(h('div', { class: 'alloc-row spend' }, h('span', { class: 'nm', text: 'Được phép chi (toàn bộ, hôm nay)' }), h('span', {}), h('span', { class: 'money num', text: Money.format(sp.value) })));
    }

Pages.disciplineConfig = function ({ setup = false } = {}) {
  const st = App.state; const v = Discipline.view(st);
  const goals = st.goals.filter(g => g.status === 'active' && (g.mode === 'transfer' || g.mode === 'account'));
  const accs = st.accounts.filter(a => a.active);
  if (!accs.length) return Modal.alert({ title: 'Cần tài khoản', message: 'Hãy tạo ít nhất một tài khoản trước.' });
  const incomeCats = st.categories.filter(c => c.kind === 'income' && c.active);
  const savingsAcc = (accs.find(a => a.type === 'savings') || accs.find(a => a.type !== 'investment') || accs[0]).id;
  const pri = { high: 0, medium: 1, low: 2 };
  const defaults = () => {
    const sorted = goals.slice().sort((a, b) => (a.type === 'emergency' ? -1 : 0) - (b.type === 'emergency' ? -1 : 0) || pri[a.priority] - pri[b.priority]);
    const steps = sorted.slice(0, 4).map((g, i) => ({ key: 'k' + i, goalId: g.id, toAccountId: g.mode === 'account' ? g.accountId : savingsAcc, bp: g.type === 'emergency' ? 1500 : 1000, fixed: null }));
    const inv = accs.find(a => a.type === 'investment'); if (inv) steps.push({ key: 'dca', goalId: '', toAccountId: inv.id, bp: 1000, fixed: null });
    const tot = Util.sum(steps, s => s.bp) || 1; let used = 0;
    const bonus = steps.map((s, i) => { const bp = i === steps.length - 1 ? 7000 - used : Math.floor(s.bp * 7000 / tot); used += bp; return { ...s, key: 'b' + i, bp }; }).filter(s => s.bp > 0);
    return { enabled: true, rules: [{ id: 'salary', name: 'Lương', categoryIds: incomeCats.some(c => c.id === 'cat_inc_salary') ? ['cat_inc_salary'] : [], steps }, { id: 'bonus', name: 'Thưởng', categoryIds: incomeCats.some(c => c.id === 'cat_inc_bonus') ? ['cat_inc_bonus'] : [], steps: bonus }] };
  };
  const cfg = Util.clone(v.cfg || defaults());
  for (const id of ['salary', 'bonus']) if (!cfg.rules.some(r => r.id === id)) cfg.rules.push({ id, name: id === 'salary' ? 'Lương' : 'Thưởng', categoryIds: [], steps: [] });

Pages.goalWithdraw = function (goal, presetAmount = null) {
  const st = App.state; const v = Discipline.view(st); const prog = Goals.progress(st, goal);
  const accs = st.accounts.filter(a => a.active);
  let from = goal.mode === 'account' ? goal.accountId : null;
  if (!from) { const cnt = new Map(); for (const t of st.transactions) if (t.type === 'transfer' && t.goalId === goal.id && (t.goalDir || 'in') === 'in') cnt.set(t.toAccountId, (cnt.get(t.toAccountId) || 0) + 1); from = Array.from(cnt).sort((a, b) => b[1] - a[1]).map(x => x[0])[0] || (accs[0] || {}).id; }
  const form = h('form', { novalidate: true, id: 'gw-form' }); const fe = F.formError();
  const fromSel = F.select('from', accs.map(a => ({ value: a.id, label: a.name })), from, { disabled: goal.mode === 'account' });
  const toSel = F.select('to', accs.filter(a => a.id !== from).map(a => ({ value: a.id, label: a.name })), (accs.find(a => a.id !== from && LIQUID_TYPES.includes(a.type)) || {}).id);
  form.append(h('div', { class: 'form-grid' }, F.field('Số tiền rút', F.money('amount', presetAmount), { required: true, name: 'amount', hint: `Quỹ hiện có ${Money.format(prog.saved)}` }), F.field('Từ tài khoản', fromSel, { name: 'from' }), F.field('Về tài khoản', toSel, { name: 'to' })));
  const emgFund = st.goals.find(g => g.type === 'emergency' && g.status === 'active' && g.id !== goal.id);
  const emgSaved = emgFund ? Goals.progress(st, emgFund).saved : 0;
  const isEmg = goal.type === 'emergency';
  let mode = isEmg ? 'emg' : 'hf'; let code = (isEmg ? Discipline.EMG_CODES : Discipline.HF_CODES)[0][0];
  const note = DiscUI.noteInput(); const commit = Discipline.commitmentText(st);
  const sec = h('div');
  const drawSec = () => {
    if (!v.enforce) { sec.replaceChildren(C.callout('info', v.inTrial ? 'Đang chạy thử: rút được ngay, ứng dụng ghi lại để bạn xem trước.' : 'Chưa bật kỷ luật — rút ngay.')); return; }
    const kids = [commit ? h('blockquote', { class: 'commit-quote' }, '“' + commit + '”') : null];
    if (!isEmg) kids.push(h('div', { class: 'segmented mt-8' }, [['hf', 'Muốn chi (chờ 72 giờ)'], ['emg', 'Khẩn cấp']].map(([k, l]) => h('button', { type: 'button', class: 'seg-btn' + (mode === k ? ' active' : ''), onclick: () => { mode = k; code = (k === 'emg' ? Discipline.EMG_CODES : Discipline.HF_CODES)[0][0]; drawSec(); } }, l))));
    if (mode === 'emg' && !isEmg && emgFund && emgSaved > 0) kids.push(C.callout('shield', h('span', {}, `Quỹ dự phòng còn ${Money.format(emgSaved)}. Khẩn cấp hãy rút từ quỹ dự phòng trước. `, h('a', { href: '#', onclick: e => { e.preventDefault(); m.close(); Pages.goalWithdraw(emgFund); } }, 'Rút từ Quỹ dự phòng')), 'warn'));
    kids.push(h('div', { class: 'disc-sec-title mt-8', text: 'Lý do' }), DiscUI.chips(mode === 'emg' ? Discipline.EMG_CODES : Discipline.HF_CODES, code, k => { code = k; }), note);
    sec.replaceChildren(...kids);
  };
  drawSec(); form.append(sec, fe);
  let m;
  const submit = async e => {
    if (e) e.preventDefault(); fe.textContent = ''; F.clearErrors(form);
    const a = F.moneyVal(form, 'amount'); if (!a.ok) return F.showErrors(form, { amount: a.error });
    if (a.value > prog.saved) return F.showErrors(form, { amount: `Vượt số đang có trong quỹ (${Money.format(prog.saved)}).` });
    const fromId = fromSel.value, toId = toSel.value; if (!toId || toId === fromId) return F.showErrors(form, { to: 'Chọn tài khoản nhận khác tài khoản nguồn.' });
    if (mode === 'emg' && !isEmg && v.enforce && emgFund && emgSaved >= a.value) return (fe.textContent = 'Quỹ dự phòng đủ để trang trải — hãy rút từ Quỹ dự phòng.');
    const now = Util.nowISO();
    const txn = Model.transaction({ id: Util.uid('txn'), type: 'transfer', date: DateUtil.today(), amount: a.value, accountId: fromId, toAccountId: toId, goalId: goal.mode === 'transfer' ? goal.id : '', goalDir: goal.mode === 'transfer' ? 'out' : '', payee: 'Rút quỹ ' + goal.name, createdAt: now, updatedAt: now });
    const ve = Validation.transaction(txn, App.state); if (Object.keys(ve).length) return (fe.textContent = Validation.first(ve));
    try {
      if (v.enforce && mode === 'hf') { await DiscActions.createRequest({ type: 'txn', op: 'add', txn }, { amount: a.value, refId: goal.id, code, note: note.value.trim() }); m.close(); App.render(); return; }
      await App.commit('Rút khỏi quỹ', d => {
        d.transactions.push(txn);
        if (v.enforce && goal.mode === 'account') { const ev = Discipline.newEvent('override', { cls: 'emg', refId: txn.id, amount: a.value }, d); d.commitLog.push(ev); if (code || note.value.trim()) Discipline.addNote(d, ev.id, code, note.value.trim()); }
      }, { discipline: v.enforce ? { reason: 'emg', code, note: note.value.trim() } : null, noPrompt: true });
      Toast.show(`Đã rút ${Money.format(a.value)} khỏi quỹ ${goal.name}.`, { type: 'success' }); m.close();
    } catch (err) { fe.textContent = err.message; }
  };
  form.addEventListener('submit', submit);
  m = Modal.open({ title: `Rút khỏi quỹ "${goal.name}"`, body: form, size: 'md', footer: [h('button', { class: 'btn btn-ghost', type: 'button', onclick: () => m.close() }, 'Giữ nguyên'), h('button', { class: 'btn btn-primary', type: 'submit', form: 'gw-form' }, 'Tiếp tục')] });

  /* ---------- Ghi dữ liệu: nguyên tử, kiểm tra toàn vẹn, chỉ báo "Đã lưu" khi ghi thành công ---------- */

    Snapshots.upsertToday(draft);
    if (!fromSync) Changes.stamp(before, draft);

    clearMemo(draft);

    if (newErrors.length) throw new AppError('Thao tác bị từ chối vì sẽ làm sai lệch dữ liệu:\n• ' + newErrors.slice(0, 5).join('\n• '));

        throw new AppError('Dữ liệu đã được thay đổi ở tab/cửa sổ khác. Thao tác chưa được lưu — vui lòng tải lại dữ liệu.');

  /** Hợp nhất dữ liệu từ Drive vào dữ liệu cục bộ. */
  async applyRemote(remote) {
    const pick = st => { const o = { settings: st.settings, tombstones: st.tombstones || [] }; for (const c of COLLECTIONS) o[c] = st[c]; return o; };
    const pre = MergeService.merge(pick(this.state), remote);
    let localChanged = pre.localChanged;
    if (localChanged) {
      await this.commit('Đồng bộ từ Google Drive', d => {
        const m = MergeService.merge(pick(d), remote);
        for (const c of COLLECTIONS) d[c] = Util.clone(m.data[c]);
        d.tombstones = Util.clone(m.data.tombstones); d.settings = Model.settings(Util.clone(m.data.settings));
      }, { fromSync: true });
      const odd = Discipline.audit(this.state);
      if (odd) this.banner('disc-audit', 'warn', 'Phát hiện mốc giờ bất thường trong nhật ký cam kết', `${odd} sự kiện mang thời gian ở tương lai — có thể một thiết bị đang để sai đồng hồ. Hãy bật "Đặt giờ tự động" trên các thiết bị.`);
    }
    const post = MergeService.merge(pick(this.state), remote);
    return { localChanged, remoteNeedsUpdate: post.remoteChanged, stats: pre.stats };
  },
  async wipe(propagate) {
    await this.commit('Xóa toàn bộ dữ liệu', d => {
      const fresh = Defaults.state();
      const ep = Discipline.epoch(d);
      for (const c of COLLECTIONS) d[c] = fresh[c];
      d.settings = fresh.settings;
      d.settings.disciplineEpoch = propagate ? ep + 1 : ep;
    }, { bypassBlock: true, allowBaseline: true, keepPrev: true, resetTombstones: !propagate, resetLog: true, noAlloc: true });
    this.undoEntry = null;
    this.navigate('dashboard');
  },

  /* ---------- Giao diện khung ---------- */
  buildShell() {
    const brand = document.querySelector('.brand'); brand.prepend(LogoMark(30));
    const nav = document.getElementById('nav');
    nav.replaceChildren(...Object.entries(ROUTES).map(([k, r]) => h('a', { href: '#/' + k, dataset: { route: k } }, Icon(r.icon), h('span', {}, r.title))));
    const bn = document.getElementById('bottom-nav');
    const bItem = (k, label, icon) => h('a', { href: '#/' + k, dataset: { route: k } }, Icon(icon, 22), label);
    bn.replaceChildren(bItem('dashboard', 'Tổng quan', 'dashboard'), bItem('transactions', 'Giao dịch', 'list'), h('button', { class: 'bn-add', type: 'button', 'aria-label': 'Thêm giao dịch', onclick: () => Forms.openTxn() }, Icon('plus', 26)), bItem('budgets', 'Ngân sách', 'pie'), h('button', { type: 'button', onclick: () => this.toggleNav(true) }, Icon('menu', 22), 'Thêm'));
    document.getElementById('btn-menu').replaceChildren(Icon('menu'));
    document.getElementById('btn-add').replaceChildren(Icon('plus', 16), h('span', {}, 'Giao dịch'));
    const sel = document.getElementById('period-select');
    sel.replaceChildren(...Object.entries(Period.OPTIONS).map(([v, l]) => h('option', { value: v }, l)));
  },
  bindGlobal() {
    document.getElementById('btn-menu').addEventListener('click', () => this.toggleNav());
    document.getElementById('sidebar-scrim').addEventListener('click', () => this.toggleNav(false));
    document.getElementById('nav').addEventListener('click', e => { if (e.target.closest('a')) this.toggleNav(false); });
    document.getElementById('btn-add').addEventListener('click', () => Forms.openTxn());
    document.getElementById('btn-profile').addEventListener('click', () => Pages.profileSwitcher());
    document.getElementById('btn-privacy').addEventListener('click', () => { this.setPref('privacyMode', !this.prefs.privacyMode); this.applyPrivacy(); });
    document.getElementById('save-status').addEventListener('click', () => this.navigate('data'));
    document.getElementById('period-select').addEventListener('change', e => this.onPeriodChange(e.target.value));
    window.addEventListener('resize', Util.debounce(() => { if (!Modal.stack.length) this.render(); }, 250));
    if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); const f = () => { if (this.prefs.theme === 'system') { this.applyTheme(); this.render(); } }; if (mq.addEventListener) mq.addEventListener('change', f); }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { if (Modal.stack.length) { Modal.closeTop(); e.preventDefault(); } else this.toggleNav(false); return; }
      const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable || Modal.stack.length || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); Forms.openTxn(); }
      else if (e.key === '/' && this.route === 'transactions') { const s = document.getElementById('txn-search'); if (s) { e.preventDefault(); s.focus(); } }
    });
    window.addEventListener('beforeunload', e => { if (this.unsaved) { e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && SyncService.isEnabled()) { const last = SyncService.cfg.lastSyncAt; if (!last || Date.now() - new Date(last).getTime() > 20000) SyncService.syncNow('focus'); } });
    window.addEventListener('online', () => { if (SyncService.isEnabled()) SyncService.syncNow('online'); this.renderStatus(); });
    window.addEventListener('offline', () => this.renderStatus());
  },
  toggleNav(force) { const app = document.getElementById('app'); const open = force === undefined ? !app.classList.contains('nav-open') : force; app.classList.toggle('nav-open', open); },
  onPeriodChange(v) {
    if (v === 'custom') {
      const cur = this.period();
      const form = h('form', { novalidate: true, id: 'period-form' }); const fe = F.formError();
      form.append(h('div', { class: 'form-grid' }, F.field('Từ ngày', F.date('from', cur.from), { name: 'from', required: true }), F.field('Đến ngày', F.date('to', cur.to), { name: 'to', required: true })), fe);
      let m;
      form.addEventListener('submit', e => { e.preventDefault(); F.clearErrors(form); const f = F.dateVal(form, 'from'), t = F.dateVal(form, 'to'); const errs = {}; if (!f) errs.from = 'Ngày không hợp lệ.'; if (!t) errs.to = 'Ngày không hợp lệ.'; if (f && t && f > t) errs.to = 'Ngày kết thúc phải sau ngày bắt đầu.'; if (f && t && DateUtil.diffDays(f, t) > 36600) errs.to = 'Khoảng ngày quá dài.'; if (Object.keys(errs).length) return F.showErrors(form, errs); this.setPref('period', { key: 'custom', custom: { from: f, to: t } }); m.close(); this.render(); });
      m = Modal.open({ title: 'Chọn khoảng ngày', size: 'sm', body: form, footer: [h('button', { class: 'btn btn-ghost', type: 'button', onclick: () => m.close() }, 'Hủy'), h('button', { class: 'btn btn-primary', type: 'submit', form: 'period-form' }, 'Áp dụng')], onClose: () => this.renderHeader() });
      return;
    }
    this.setPref('period', { key: v, custom: null }); this.render();
  },
  navigate(route) { if (('#/' + route) === location.hash) this.render(); else location.hash = '#/' + route; },
  onRoute(initial) {
    const r = (location.hash.match(/^#\/([a-z-]+)/) || [])[1];
    this.route = ROUTES[r] ? r : 'dashboard';
    if (!ROUTES[r] && !initial) { history.replaceState(null, '', '#/dashboard'); }
    Modal.closeAll();
    this.render(true);
  },
  renderHeader() {
    const r = ROUTES[this.route];
    document.getElementById('page-title').textContent = r.title;
    const prof = Profiles.active(); const multi = Profiles.count() > 1;
    document.title = `${r.title}${multi ? ' · ' + prof.name : ''} · ${APP_NAME}`;
    const pb = document.getElementById('btn-profile');
    if (pb) { pb.replaceChildren(Pages.avatar(prof), h('span', { class: 'nm', text: prof.name })); pb.title = `Hồ sơ: ${prof.name}${prof.email ? ' (' + prof.email + ')' : ''} — bấm để chuyển hồ sơ`; }
    const pc = document.getElementById('period-ctl'); pc.style.display = r.period ? '' : 'none';
    const p = this.period(); const sel = document.getElementById('period-select'); sel.value = p.key;
    document.getElementById('page-sub').textContent = r.period ? p.range : '';
    for (const a of document.querySelectorAll('[data-route]')) a.classList.toggle('active', a.dataset.route === this.route);
    const due = this.state ? Recurring.due(this.state).length : 0;
    const navRec = document.querySelector('#nav [data-route=recurring]');
    if (navRec) { const old = navRec.querySelector('.nav-badge'); if (old) old.remove(); if (due) navRec.append(h('span', { class: 'nav-badge warn', text: String(due) })); }
    const bux = this.state ? Budget.usage(this.state, DateUtil.monthKey(DateUtil.today())) : null; const over = bux ? bux.overCount + (bux.allOver ? 1 : 0) : 0;
    const navB = document.querySelector('#nav [data-route=budgets]');
    if (navB) { const old = navB.querySelector('.nav-badge'); if (old) old.remove(); if (over) navB.append(h('span', { class: 'nav-badge', text: String(over) })); }
    this.renderSidebarFoot();
  },
  renderSidebarFoot() {
    const el = document.getElementById('sidebar-foot'); if (!el || !this.state) return;
    const info = StorageService.info;
    el.replaceChildren(
      h('div', { class: 'row', style: { cursor: 'pointer' }, onclick: () => Pages.profileSwitcher(), title: 'Chuyển hồ sơ' }, Icon('eye', 13), 'Hồ sơ: ' + Profiles.active().name),
      h('div', { class: 'row' }, Icon('database', 13), ({ indexeddb: 'Lưu: IndexedDB', localstorage: 'Lưu: localStorage', memory: 'Lưu: tạm thời!' })[info.mode]),
      h('div', { class: 'row' }, Icon(SyncService.isEnabled() ? 'cloud' : 'cloudOff', 13), SyncService.isEnabled() ? 'Đồng bộ: ' + (SyncService.status.text || 'bật') : 'Đồng bộ: tắt'),
      h('div', { class: 'row', style: { opacity: .7 } }, `v${APP_VERSION} · #${this.state.meta.revision}`));
  },
  setSave(kind, text) { this.saveState = { kind, text }; this.renderStatus(); },
  renderStatus() {
    const pill = document.getElementById('save-status'); if (!pill) return;
    const s = this.saveState; const sy = SyncService.status; const syncOn = SyncService.isEnabled();
    pill.className = 'status-pill ' + s.kind + (syncOn ? ' sync-' + ({ ok: 'ok', busy: 'busy', idle: 'ok', offline: 'warn', auth: 'warn', error: 'warn' }[sy.state] || '') : '');
    const kids = [h('span', { class: 'dot' }), h('span', { class: 'txt', text: s.text })];
    if (syncOn) kids.push(h('span', { class: 'sync-ico', title: sy.text }, Icon(sy.state === 'busy' ? 'sync' : (sy.state === 'ok' || sy.state === 'idle') ? 'cloud' : 'cloudOff', 15)));
    pill.replaceChildren(...kids);
    pill.title = `Lưu cục bộ: ${s.text}${syncOn ? ' · Đồng bộ: ' + sy.text : ''}${!navigator.onLine ? ' · Đang ngoại tuyến' : ''}`;
    this.renderSidebarFoot();
  },
  banner(id, tone, title, text, actions = []) {
    const root = document.getElementById('banners'); const old = root.querySelector(`[data-banner="${id}"]`); if (old) old.remove();
    root.append(h('div', { class: 'banner ' + (tone === 'info' ? '' : tone), dataset: { banner: id }, role: tone === 'danger' ? 'alert' : 'status' }, Icon(tone === 'info' ? 'info' : 'alert'), h('div', { class: 'b-body' }, h('div', { class: 'b-title', text: title }), h('div', { class: 'small', text }), actions.length ? h('div', { class: 'b-actions' }, actions.map(a => h('button', { class: 'btn btn-sm', type: 'button', onclick: a.fn }, a.label))) : null), tone !== 'danger' ? h('button', { class: 'icon-btn sm', type: 'button', 'aria-label': 'Ẩn thông báo', onclick: () => this.clearBanner(id) }, Icon('x', 14)) : null));
  },
  clearBanner(id) { const el = document.querySelector(`#banners [data-banner="${id}"]`); if (el) el.remove(); },
  render(resetScroll = false) {
    if (!this.state) return;
    this.renderHeader();
    const view = document.getElementById('view');
    const y = window.scrollY;
    const frag = h('div', { class: 'page' });
    try { (Pages[this.route] || Pages.dashboard)(frag); }
    catch (e) {
      console.error(e);
      frag.replaceChildren(C.card('Đã xảy ra lỗi khi hiển thị trang', h('div', {}, C.callout('alert', String(e && e.message || e), 'danger'), h('p', { class: 'small mt-12', text: 'Dữ liệu của bạn không bị ảnh hưởng. Bạn có thể xuất bản sao lưu hoặc chuyển sang trang khác.' }), h('div', { class: 'btn-group mt-12' }, C.btn('Xuất sao lưu', () => Pages.exportBackup(false), { icon: 'download' }), C.btn('Về Tổng quan', () => this.navigate('dashboard'))))));
    }
    view.replaceChildren(frag);
    if (resetScroll) window.scrollTo(0, 0); else window.scrollTo(0, y);
  }
};

/* Biểu tượng cho "Thêm vào màn hình chính" (tạo PNG tại chỗ, không tải từ mạng) */
function installTouchIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#0f2350'; x.fillRect(0, 0, 180, 180);
    x.strokeStyle = '#ffffff'; x.lineWidth = 14; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(42, 126); x.lineTo(74, 88); x.lineTo(98, 106); x.lineTo(138, 56); x.stroke();
    x.fillStyle = '#7ef0c0'; x.beginPath(); x.arc(138, 56, 12, 0, Math.PI * 2); x.fill();
    const link = document.createElement('link'); link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png'); document.head.appendChild(link);
  } catch (e) {}
}

window.addEventListener('error', e => { try { console.error(e.error || e.message); Toast.show('Lỗi không mong muốn: ' + (e.message || 'không rõ') + '. Dữ liệu đã lưu không bị ảnh hưởng.', { type: 'error' }); } catch (_) {} });
window.addEventListener('unhandledrejection', e => { try { console.error(e.reason); const msg = e.reason && e.reason.message || String(e.reason); if (!(e.reason instanceof AppError)) Toast.show('Lỗi: ' + msg, { type: 'error' }); } catch (_) {} });

/* Giao diện kiểm tra/khám phá dành cho người dùng nâng cao (chỉ đọc) */
window.FinPilot = Object.freeze({
  version: APP_VERSION,
  getState: () => Util.clone(App.state),
  totals: (from, to) => Ledger.totals(App.state, from, to),
  current: () => { const c = Ledger.current(App.state); return { cash: c.cash, totalAssets: c.totalAssets, liabilities: c.liabilities, netWorth: c.netWorth, balances: Object.fromEntries(c.balances), debts: Object.fromEntries(c.debtBalances) }; },
  integrity: () => Validation.integrity(App.state),
  _internal: { App, Ledger, Validation, MergeService, ImportExport, Recurring, DateUtil, Money, SyncService, StorageService, Discipline, TrustedClock, CommitLog, Alloc, Model, Goals, Holdings: typeof Holdings !== 'undefined' ? Holdings : null, PriceService: typeof PriceService !== 'undefined' ? PriceService : null, Pages, Portfolio, Layers, LayerData: typeof LayerData !== 'undefined' ? LayerData : null }
});

installTouchIcon();
App.init().catch(e => { console.error(e); document.getElementById('view').replaceChildren(h('div', { class: 'card' }, h('h3', { text: 'Không khởi động được ứng dụng' }), h('p', { text: String(e && e.message || e) }))); });

})();
</script>
